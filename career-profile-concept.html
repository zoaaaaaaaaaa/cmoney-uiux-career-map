const storageKey='cmoney-career-concept-unlock-v1';
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const encode=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function decrypt(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(config.iv)},key,bytes(config.payload)));}
function show(html){document.open();document.write(html);document.close();const button=document.createElement('button');button.textContent='鎖定並忘記密碼';button.type='button';button.style.cssText='padding:6px 12px;border:1px solid #dbe3dd;border-radius:8px;background:white;color:#246956;font:inherit;cursor:pointer';button.onclick=()=>{try{localStorage.removeItem(storageKey)}catch(e){}location.reload()};document.querySelector('header').append(button);}
document.querySelector('#unlock').onsubmit=async e=>{e.preventDefault();const submit=document.querySelector('#submit'),status=document.querySelector('#status');submit.disabled=true;status.textContent='解鎖中…';try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.querySelector('#password').value),'PBKDF2',false,['deriveBits']);const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes(config.salt),iterations:config.rounds,hash:'SHA-256'},material,256);const html=await decrypt(raw);try{if(document.querySelector('#remember').checked)localStorage.setItem(storageKey,JSON.stringify({salt:config.salt,key:encode(raw)}));else localStorage.removeItem(storageKey)}catch(e){}show(html)}catch(e){status.textContent='密碼不正確，請再試一次。';submit.disabled=false;document.querySelector('#password').focus()}};
