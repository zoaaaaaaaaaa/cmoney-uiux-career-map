<script>const DATA={"version": "v5", "date": "2026-09-15", "items": [{"id": "C1", "name": "問題釐清", "source_ids": ["C1"], "definition": "先了解使用者想完成什麼、產品希望改善什麼，以及業務和技術有哪些限制，再決定要解決的問題和設計方向。這項看的是：你能不能說清楚為什麼要做、先做什麼、有哪些選擇，以及為什麼選這個做法。隨著職階提高，負責的範圍會從明確的設計任務，擴大到多個產品的共同問題。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能從需求、範例與討論開始整理設計內容；說清楚使用對象、任務目標與限制，以及依這些條件決定細部設計時，仍需要同事引導或協助判斷。", "在明確的目標和範圍內，能說明使用對象、任務和限制，自己決定細部設計並解釋理由。遇到不清楚、互相矛盾或較難取捨的地方，會主動找負責人確認。", "穩定完成明確任務之外，能多次找出原需求沒注意到的限制或衝突，提出有依據的替代做法，確認後調整設計。能說明因此補上哪些遺漏、避免哪些不必要的工作，並將判斷用在後續任務。"], "actions": ["先寫清楚誰會在什麼情況下使用，以及這次想改善什麼。", "列出已知限制和還不確定的地方，找相關負責人確認，再比較做法。", "記下選這個方案的理由，以及哪些問題要請資深設計師或 PM 決定。"], "example": "假設情境：調整收藏按鈕前，你先確認目標是讓使用者找回收藏，發現按鈕文字和入口位置都有影響，再跟 PM 確認這次可以改到哪裡。", "observations": [], "responsibility": "在目標與範圍清楚的設計任務中，釐清使用對象、任務和限制，決定細部設計。"}, {"scores": ["能從明確需求或同事的引導提出設計做法；把需求整理成產品問題、確認關鍵假設，以及比較方案代價與處理範圍時，部分重要判斷仍需要協助。", "針對自己負責的產品問題，能獨立釐清使用情境、目標、限制和未知，比較可行方案並提出建議。超出原定範圍或自己的決定權時，會帶著建議找負責人確認。", "穩定釐清產品問題之外，能處理需求模糊、假設錯誤或限制衝突的情況，用證據提出調整範圍與方案的建議。能在不同任務或後續迭代中說明取捨帶來的改善，例如少做無效設計、減少大幅重做。"], "actions": ["開始前先寫清楚使用者要做什麼、卡在哪裡，以及目標、限制和假設。", "比較可行選項，說明推薦哪個方案、哪些先不做，以及原因。", "記下決定和還沒解決的風險；要改範圍時，找負責範圍與資源決策的人確認。"], "example": "假設情境：PM 想新增篩選器，你從客服回饋和操作紀錄發現，主要問題是排序看不懂。比較後建議先改排序，獲得同意後記下省去的篩選流程，以及還要驗證的查找成功率。", "observations": [], "responsibility": "針對一個範圍明確的產品問題，釐清需求背後的原因、比較方案，提出設計取捨。"}, {"scores": ["能從熟悉的產品問題提出改善機會；要自己找出領域內值得處理的問題、比較多個機會，並提出優先順序及最小驗證範圍時，仍需要同事協助分析。", "能主動找出產品或領域的機會，說明問題、目標、證據和限制。比較後提出先後順序及最小驗證範圍，再跟有決定權的負責人確認選擇和下一步。", "穩定提出領域方向之外，當多個機會競爭資源或證據互相矛盾時，能找出關鍵未知與被忽略的風險，提出可比較的選項。後續決策與結果能說明因此避免的無效投入或重大遺漏，並幫助相關工作更準確界定問題。"], "actions": ["寫清楚使用者問題、產品目標、已有證據，以及還不知道的事。", "比較維持現況、小幅修改和完整方案，建議先做到哪裡、哪些先不做。", "找有決定權的負責人確認，記下沒選其他方案的原因、下一步和何時要重新討論。"], "example": "假設情境：原需求是重做訂閱頁，你查出主要問題是使用者看不懂權益，因此建議先測試權益說明。記下調整前後的範圍、理由、決定和測試結果；如果提案沒被採用，就如實記錄，不算成已完成的產品改善。", "observations": [], "responsibility": "主動找出單一產品或領域值得解決的問題，比較多個機會，提出先做什麼及最小驗證範圍。"}, {"scores": ["能從熟悉的產品或領域提出改善方向，開始整理跨產品問題；比較各產品的目標、共同處理的效益與保留差異的必要性，並形成跨產品建議時，仍需要協助。", "能根據各產品的證據找出共同問題，比較共用、保留差異和分階段處理的做法，說明短期與長期代價，協助負責人做出決定並確認誰接著做。", "穩定提出跨產品方向之外，能在目標衝突或資訊不明時，補上關鍵證據、調整問題範圍，促成可執行的選擇。後續能確認錯誤投入減少或共同體驗改善，其他團隊也能運用判斷方法處理新的共同問題。"], "actions": ["選一個共同問題，比較各產品的使用情況、證據和限制。", "列出共用、保留差異和暫緩處理的做法，以及各自的成本與影響。", "找負責這項決策的人確認，記下選擇理由和後續分工。"], "example": "假設情境：兩款產品想共用會員流程，比較後發現權限不同，因此決定只共用身分辨識、保留各自的授權步驟，並追蹤實作和使用者是否看得懂。", "observations": [], "responsibility": "找出多個產品各自處理仍難以解決的共同問題，判斷哪些一起解、哪些保留差異，提出跨產品方向。"}], "clarifications": []}, {"id": "C2", "name": "UI 品質與資訊呈現", "source_ids": ["C2"], "definition": "依使用者的閱讀順序與任務重點，建立清楚的資訊層級，透過字級、排版、間距、色彩與對比，讓重要內容容易辨識。畫面也要維持產品內的視覺一致性，符合品牌風格與識別，並在不同內容、狀態和適用裝置下保持好讀。這項同時看設計稿與實作是否一致；跨產品採用共同原則時，保留各自需要的品牌特色與使用差異。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依範例與既有規則製作畫面；安排清楚的資訊層級，並在不同內容、尺寸或狀態下維持可讀性、產品與品牌風格時，仍需要同事協助判斷與檢查。", "能在明確任務內安排資訊層級，做好排版、間距、對齊與對比，沿用產品的視覺規則和品牌風格。以任務需要的內容、尺寸與狀態自行檢查，修正細節並記下實作差異。", "穩定做好任務畫面之外，能多次改善長內容、資訊擁擠或版型限制造成的難讀、漏看問題，同時維持產品與品牌風格。透過前後畫面、實作檢查或使用回饋，確認重點更容易辨識，並將做法用在後續任務。"], "actions": ["依明確任務確認使用者先看什麼、再看什麼，沿用產品與品牌規則安排字級、間距、色彩和版面。", "用任務會出現的長短內容、狀態和裝置尺寸，檢查標題是否突出、資訊是否擠在一起或容易漏看。", "比對設計稿與實作，修正自己負責的細節；留下前後畫面與檢查結果，說明哪些地方更清楚。"], "example": "假設情境：文章卡片換成長標題後，標題與摘要擠在一起，日期也容易被漏看。你在既有版型內調整字級、間距和資訊分組，再用長短標題與沒有圖片的情況檢查設計及實作，確認資訊主次清楚，產品和品牌風格一致。", "observations": [], "responsibility": "把明確任務的資訊主次與畫面細節做好，符合既有產品視覺與品牌規則。"}, {"scores": ["能從熟悉畫面著手安排主要資訊與視覺做法；獨立決定一個產品問題的資訊層級，並顧到相關畫面、內容變化與實作品質時，部分判斷仍需要同事協助。", "能獨立建立清楚的資訊層級，完成好讀、符合產品一致性與品牌風格的畫面，涵蓋任務需要的內容、尺寸和狀態。能自行檢查層級、字級、間距、對比與風格，追蹤實作差異並說明修正或取捨。", "穩定完成相關畫面的資訊層級之外，能處理高資訊量、特殊內容與品牌規則的衝突，讓使用者更容易找到重點、比較差異。不同任務或後續版本的使用觀察與檢查，能確認誤讀或漏看問題減少，產品風格仍保持一致。"], "actions": ["根據任務重點安排資訊層級，再檢查畫面是否符合產品一致性與品牌風格。", "挑出任務涉及的長短內容、空值、尺寸和狀態，確認層級、對比與風格都能維持。", "比對實作，記下資訊與視覺呈現的差異、造成的影響，以及如何修正或取捨。"], "example": "假設情境：投資列表同時出現長公司名與大數值時不易閱讀。你重新安排資訊層級，保留產品的色彩、字體與品牌風格，並檢查不同內容及實作，留下前後對照和使用觀察。", "observations": [], "responsibility": "為一個產品問題建立清楚的資訊層級，顧到相關畫面、內容與裝置，並確認實作維持設計品質。"}, {"scores": ["能處理熟悉功能的資訊呈現，提出局部改善；統整領域內多個功能、找出反覆閱讀問題，並處理舊版限制與視覺差異時，仍需要同事協助規劃與取捨。", "能獨立整理同一產品或領域多個功能的資訊呈現，找出反覆出現的難找、難讀、難比較或風格不一致問題。能協調相關畫面一起改善，說明舊版限制、品牌與可讀性之間的取捨，並追蹤實作，確認相關功能維持清楚、一致的呈現。", "穩定統整領域內資訊呈現之外，當不同功能的閱讀重點不同，或統一版型反而難讀時，能判斷哪些層級一致、哪些依情境調整。使用觀察與後續版本檢查能確認功能切換後仍容易辨認重點，同類閱讀問題持續減少。"], "actions": ["整理同一產品或領域中多個功能的資訊呈現，找出反覆出現的難找、難讀、難比較或風格不一致問題。", "比較使用者閱讀需求、既有設計限制與品牌規則，決定相關畫面要怎麼調整，並說明取捨。", "追蹤相關功能的實作與後續使用，確認同類閱讀問題是否減少，新功能也能維持適合的資訊層級與風格。"], "example": "假設情境：同一款看盤 App 的自選股清單、個股頁和價格提醒，對漲跌金額、漲跌幅的呈現不一致：有的只靠紅綠色，有的沒標單位，容易看錯。你把三處都改成「股價 → 漲跌金額 → 漲跌幅」的閱讀順序，補上正負號與單位，統一字級、間距及色彩用法，維持產品的品牌風格。再檢查長股名和大數值的實作，請使用者指出目前價格與漲跌，確認能分辨；後續新版也用相同方式驗收。", "observations": [], "responsibility": "整理同一產品或領域多個功能的資訊呈現，解決反覆出現的閱讀與視覺問題，維持整體品質。"}, {"scores": ["能從單一產品經驗提出跨產品的視覺建議；判斷哪些資訊呈現原則適合共用、哪些應保留品牌或使用差異，並推進各產品實作時，仍需要其他負責人協助。", "能針對跨產品的共同呈現問題，提出清楚的資訊層級與視覺品質原則，搭配可實作的範例；說明各產品需要一致的地方與各自品牌特色，並確認實作和使用者理解。", "穩定建立跨產品呈現原則之外，能處理不同品牌、裝置與舊版限制的衝突，讓各團隊找到可實作的調整方式。後續各團隊能自行運用與調整原則，實作或使用回饋也顯示共同的難找、難讀問題持續減少。"], "actions": ["比較多個產品的資訊層級與視覺呈現，找出共同閱讀問題，以及各自需要保留的品牌差異。", "用可實作的原則與範例，跟各團隊確認如何調整，再檢查實際畫面是否做到。", "查看後續版本是否能自行延續、調整這些做法，並用實作與使用回饋確認跨產品的共同問題持續改善。"], "example": "假設情境：兩款產品都讓使用者看不懂訂閱狀態，但品牌和版面不同。你提出共同的資訊優先順序與清楚的範例，各團隊保留自己的品牌特色並完成調整。後續新增權益時，團隊能自行延用或調整，並提供實作和使用回饋確認狀態仍容易辨識。", "observations": [], "responsibility": "提出多個產品能採用的資訊呈現與視覺原則，兼顧共同品質、各產品品牌特色與實作差異。"}], "clarifications": [{"question": "這裡的 UI 品質具體看哪些地方？", "answer": "主要看資訊層級是否清楚、內容是否好讀、產品內的視覺是否一致、是否符合品牌風格，以及實作是否呈現這些設計。字級、間距、對齊、色彩和對比都是可以直接檢查的細節，不只用「看起來漂亮」判斷。"}, {"question": "產品沒有完整的視覺或品牌規範，怎麼做？", "answer": "可以先從現有畫面、品牌素材與使用情境整理需要一致的部分，再跟設計負責人確認。評分看你在這個職階如何運用、釐清或改善規則，不以公司是否已提供完整文件來判斷。"}, {"question": "符合期待與超出期待，怎麼區分？", "answer": "先看目前職等負責的範圍：Jr. 是明確任務的畫面，Md. 是一個產品問題的相關畫面，Sr. 是同一產品或領域的多個功能，Principal 是多個產品的共同呈現問題。符合期待是在這個範圍內做好資訊層級、產品與品牌一致性並檢查實作；超出期待還要在較難的限制或衝突下做出額外判斷，並確認後續閱讀問題改善。Principal 也看各團隊能否自行運用與調整。只整理文件或例子不足以判斷為超出期待。"}]}, {"id": "C3", "name": "流程與互動設計", "source_ids": ["C3"], "definition": "從使用者實際要完成的任務出發，把整段流程想周全，讓每個會操作的地方都順暢，前後步驟能自然銜接。依任務會遇到的情境，考慮輸入、選擇、切換、返回、等待、修改與中斷後繼續等操作，提供清楚、及時的回饋，減少多餘步驟和重複輸入。遇到錯誤或特殊狀況時，使用者也知道發生什麼、如何修正並繼續完成任務；有 AI 功能時，同樣要考慮等待、結果修改、重試與替代操作。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依範例安排主要操作步驟；補齊輸入與按鈕回饋、等待、返回、修改或重試，並確認前後操作順暢時，仍需要同事帶著檢查或協助補齊。", "依確認好的範圍設計主要流程，讓按鈕、輸入、返回與需要的狀態都有清楚回饋。能自己從頭操作到完成，檢查步驟是否順暢、失敗後能否繼續；遇到較複雜的例外或其他流程的配合需求，會提出並確認。", "穩定完成明確任務的流程之外，能多次找出容易忽略的重複操作、誤觸、回饋不清或返回後卡住的問題。調整後用實際操作、測試或回饋確認任務更容易完成，必要的失敗處理也保留，並將改善延續到後續任務。"], "actions": ["依明確任務畫出從入口到完成的步驟，標出按鈕、輸入、返回，以及每次操作後要出現的回饋。", "檢查這次需要的等待、空白、錯誤和重試情境，讓使用者知道目前狀態，也知道怎麼接著做。", "自己從頭操作到完成，修正重複操作或回饋不清的細節；較複雜的例外找相關同事一起確認。"], "example": "假設情境：使用者按下收藏後沒有回饋，常連按好幾次；未登入時還會跳走。你在確認好的範圍內補上處理中與成功回饋，讓登入後能接著收藏，失敗時也能重試，再自己走完這些步驟確認操作順暢。", "observations": [], "responsibility": "把明確任務的操作步驟與互動細節想周全，讓主要操作、回饋與常見失敗情況都能接續。"}, {"scores": ["能設計熟悉情境的主要路徑；要自己釐清從開始到完成的整段流程，顧到角色差異、返回修改、失敗重試與中斷後繼續時，部分路徑與影響仍需要同事協助確認。", "能針對自己負責的產品問題，獨立設計從開始到完成的流程，讓每一步的操作、回饋與前後銜接清楚順暢。會考慮任務需要的角色差異、返回修改、失敗重試與中斷後繼續，並跟工程確認做法可行。", "穩定完成整段流程之外，遇到多條路徑、角色或限制互相影響時，能找出卡關、重複輸入或來回跳轉的原因並改善。後續操作觀察能確認主要流程更順，返回、重試與中斷後繼續也能完成，相關操作沒有因此變困難。"], "actions": ["從使用者要完成的任務畫出整段流程，檢查每一步要看什麼、做什麼，接下來會發生什麼。", "逐一檢查輸入、切換、返回、修改和等待時的互動，補上任務需要的失敗重試與中斷後繼續方式。", "實際操作原型或產品，找出多餘步驟、重複輸入和回饋不清的地方，修改後再檢查整段流程。"], "example": "假設情境：使用者在訂閱頁改付款方式時，要重新填資料，付款失敗後也找不到下一步。你保留已填內容，讓使用者能返回修改、看到處理狀態並重試，再檢查取消與成功後的流程。透過實際操作觀察，確認使用者能順利完成，並記下還會卡住的地方。", "observations": [], "responsibility": "獨立規劃一個產品問題從開始到完成的使用流程，顧到角色差異、例外與操作中斷後如何繼續。"}, {"scores": ["能處理個別功能的流程，提出銜接建議；整合領域內多個功能的切換、資料帶入、狀態變化與例外，並確認修改不影響其他功能時，仍需要同事協助梳理與檢查。", "能獨立整理領域內多個功能的操作流程，讓使用者在功能切換與前後步驟間順暢完成任務。能處理舊版限制、狀態變化與失敗後的操作，並透過檢查或測試確認：改善其中一段時，其他相關流程也能正常使用。", "穩定串接領域內功能之外，能解決角色、舊版限制與多功能連動造成的重複輸入、反覆切換或等待不明。協調相關功能一起調整後，後續版本的操作觀察能確認整段任務更順，必要的返回、重試與接續操作仍正常。"], "actions": ["走過領域內跨功能的完整任務，找出功能切換、資料帶入和狀態回饋之間容易卡住的地方。", "跟相關同事與工程確認限制，協調功能一起修改；AI 功能也要考慮等待、結果修改、重試與替代操作。", "檢查修改後的主要流程和必要例外，再追蹤後續版本，確認改善一個功能時，其他相關操作仍然順暢。"], "example": "假設情境：同一產品從訂閱到付款、再回到內容頁時，常出現重填資料和權益狀態未更新。你整理各功能的資料帶入與狀態回饋，協調修改返回、等待和重試的互動。上線後再觀察整段任務，確認不用在功能間反覆跳轉，也追蹤新版本是否維持順暢。", "observations": [], "responsibility": "處理同一產品或領域跨功能的使用流程，讓功能切換、資料帶入與狀態變化都順暢。"}, {"scores": ["能從單一產品經驗提出跨產品流程或共同互動的改善方向；釐清各產品的差異、切換後如何接續，以及驗證與實作方式時，仍需要其他負責人協助判斷。", "能釐清跨產品流程，或多個產品共同的互動問題，讓相關操作前後銜接順暢，必要的狀態、返回與失敗處理都有考慮。說清楚哪些做法需要一致、哪些保留產品差異，並跟合作團隊完成驗證與實作。", "穩定處理共同互動問題之外，能在產品版本或技術互相限制時提出分階段做法，讓過渡期間的切換、修改與重試仍順暢。各團隊在後續版本能自行運用與調整，使用紀錄也顯示共同的卡關、重複操作或回饋問題持續減少。"], "actions": ["比較多個產品的完整任務，找出共同卡關或跨產品接續問題，分清需要一致與保留差異的操作。", "跟各團隊確認共同互動做法與分階段修改方式，檢查過渡期和完成後的操作、回饋與失敗處理。", "查看各團隊後續能否自行運用和調整，再用各產品的操作觀察或使用紀錄確認共同問題是否持續減少。"], "example": "假設情境：兩款沒有串接的產品，都讓付款失敗的使用者重填資料。你與兩個團隊整理保留輸入、清楚回饋和重試的共同做法，各產品依自己的付款流程實作。後續新增付款方式時，團隊能自行調整，並用操作觀察確認同類卡關持續減少。", "observations": [], "responsibility": "解決跨產品任務或多個產品共有的互動問題，建立各團隊能採用、又保留必要差異的做法。"}], "clarifications": [{"question": "每個案子都要跨平台或有很多角色嗎？", "answer": "依實際任務判斷。狀態互相影響、舊版限制和失敗處理，都可能讓問題變複雜。跨產品也可以處理重複的互動問題；有 AI 功能時，結果怎麼修改、無法使用時怎麼繼續，都屬於基本要求。"}, {"question": "怎麼看出流程真的變順，而不只是少了幾個步驟？", "answer": "要看使用者是否更容易完成任務，例如不必重複填資料、返回修改後能接著做、操作後知道系統有沒有收到，或失敗後知道怎麼重試。有些確認步驟是必要的，不能只比點擊次數。Jr. 看明確任務的細部互動，Md. 看一個產品問題的完整流程，Sr. 看同一領域多個功能的銜接，Principal 看多產品的共同問題與後續採用。3 超出期待要在各自範圍內看到額外判斷與持續改善，可以用操作檢查、使用觀察或既有紀錄，不限定大樣本數據。"}]}, {"id": "C4", "name": "質化或量化研究", "source_ids": ["C4", "C5"], "definition": "用有根據的資訊了解使用者，並說明設計判斷的依據。先查看既有的使用者回饋、客服紀錄、行為數據或研究結果，分清已知事實與待驗證的假設。當現有資料不足以回答問題、需要更了解使用者或確認設計是否有效，而且時間與資源允許時，應安排適合的質化或量化研究。這項看的是能否判斷證據是否適用、合理解讀並用在設計上；資料不足時，要說明限制，跟團隊確認下一步與驗證時機。", "facets": [{"name": "質化研究", "question": "透過訪談、操作觀察或開放式回饋，了解使用情境、想法與操作困難。"}, {"name": "量化研究", "question": "透過行為資料、結構式問卷、任務成功率或適合的實驗，了解問題規模與變化。"}], "scoring_note": "看證據如何支持設計判斷與改善，不按研究次數或方法種類評分；質化或量化可擇一或搭配。", "clarifications": [{"question": "一定要自己做一次新研究，才能評這項嗎？", "answer": "不用。既有使用者回饋、客服紀錄、數據或研究結果，只要來源可信、適用於目前問題，也能作為依據。評分看你如何判讀、用在設計上，以及辨識還有哪些未知。需要進一步了解或驗證、時間與資源也允許時，應安排適合的研究；沒有新研究本身不扣分，但也不能把尚未驗證的假設寫成已知結果。"}, {"question": "只有做質化，或只有用量化資料，也可以達標嗎？", "answer": "可以。評的是你能不能依問題選方法、合理解讀結果並用在設計上。質化或量化擇一適合就能提供證據，也可以搭配；不要求每個案子或整段評估期間都湊齊兩種方法，做的種類多也不會自動加分。"}, {"question": "沒時間訪談，或需要的數據查不出來，怎麼辦？", "answer": "先說明缺什麼、會影響哪些判斷，再跟 PM 或主管討論可行做法。例如參考適用的既有訪談、客服紀錄或報表，安排較小範圍的操作觀察，或調整這次能回答的問題。替代資料仍要確認來源與限制；若只能找到線索，就如實保留為待驗證，不能當成已證明有效。主管也要協助安排時間、權限或資源。"}, {"question": "沒做另一種研究，就要把整項標未觀察嗎？", "answer": "不用。只要目前採用的方法與結果，已足以判斷這個職階的表現，就可以評分。只有因為缺少合理機會，導致整項仍沒有足夠證據時，才先標未觀察並保留已完成部分；缺資源不直接等於低分。"}, {"question": "只有研究計畫，或結果不支持原本方案，怎麼評？", "answer": "只有計畫還不能當成完成驗證；可以用既有資料支持它實際能回答的判斷。評分時看整理、判讀與應用的實際表現，決定不做或維持原方案也可以是好的判斷。若聲稱設計已改善問題，就要有相應的結果。原型觀察能說明理解或操作情況，不能直接當成正式轉換、留存或營收成果；資料前後有變化，也要考慮其他原因。"}], "levels": [{"scores": ["能依安排蒐集回饋、整理資料或執行測試；辨認來源、分清楚事實與推測，並找出與任務有關的發現時，仍需要同事引導或協助確認。", "能在協助下整理與任務有關的回饋、數據或研究結果，記錄來源，分清事實與推測。依討論把發現用在設計上；需要補充了解且條件允許時，能參與安排好的研究或測試，記錄結果。", "穩定整理與應用任務資料之外，能多次從回饋、數據或觀察找出原先忽略的差異，提出確認方式，經討論後補查或調整設計。後續紀錄能說明哪些錯誤理解已修正、哪些設計因此改善；不要求新增研究或湊齊方法。"], "actions": ["先確認要了解什麼，整理目前已有的使用者回饋、客服紀錄、觀察或數據。", "跟負責人確認哪些是事實、哪些仍是推測，以及資料是否適用；需要補充了解且條件允許時，參與研究或測試。", "把確認過的發現用在設計修改上，留下資料來源和還不能判斷的部分。"], "observations": ["使用質化資料時：能在協助下整理既有回饋、訪談或操作觀察，記下來源，分清實際看到的事與推測；需要補查時，依安排參與。", "使用量化資料時：能在協助下整理既有數據或研究結果，確認對象、期間與數字意義，說明資料還不能回答什麼。"], "example": "假設情境：客服紀錄附有使用者找不到收藏入口的操作截圖。你整理出入口文字容易誤解的線索，跟負責人討論後調整文字，保留原始紀錄。這些資料能說明曾發生什麼問題，還不能證明修改已有效；後續有合適機會時，再觀察使用者是否找得到。", "responsibility": "整理任務相關的回饋與資料，分清楚事實和推測，經討論後用在設計上。"}, {"scores": ["能整理產品問題的資料與初步發現；獨立判斷證據是否適用、還缺什麼，選擇查證方式並將結果用於設計與後續安排時，部分重要判斷仍需要同事協助。", "針對自己負責的產品問題，能獨立整理並判讀既有回饋、數據或研究結果，說明設計依據與仍待驗證的假設。需要更了解使用者或確認設計、時間與資源也允許時，能選擇並完成適合的質化或量化研究。把實際發現用在設計與下一步安排，追蹤後續結果。", "穩定用證據支持設計之外，遇到資料矛盾或結果不明時，能找出容易誤判的地方，運用適合的既有資料或可行查證，協助決定調整、維持或停止方案。不同任務或後續迭代能說明誤判、無效投入減少，並依新結果修正判斷。"], "actions": ["先寫清楚要回答的問題，查看相關的既有回饋、客服紀錄、數據或研究，整理已知與未知。", "判斷現有證據是否足夠；需要更了解使用者或驗證設計、時間資源也允許時，選擇質化或量化方法並實際執行。", "說明證據支持哪些設計調整、還不能證明什麼，追蹤結果；暫時無法驗證的部分，跟團隊確認後續安排。"], "observations": ["使用質化資料時：能判斷既有回饋、訪談或操作觀察是否適用，整理使用情境與發現；需要補充了解且條件允許時，完成適合的研究。", "使用量化資料時：能選擇適用的既有指標、報表或研究結果，確認對象、期間、計算方式與限制；需要補充資料時，提出可行的取得方式。"], "example": "假設情境：團隊沒時間安排訪談，但有定義清楚的付款失敗紀錄。你比較版本、裝置與失敗步驟，發現特定版本的重試問題，建議先修正並追蹤後續紀錄。這次用量化資料就能支持這個決定；使用者為什麼放棄付款仍是未知，不能從紀錄直接下結論。", "responsibility": "獨立判斷一個產品問題有哪些可用證據、還缺什麼，選擇資料或研究方法並將結果用於設計。"}, {"scores": ["能整理領域內的問題與相關證據；找出最影響方向的未知、比較查證優先順序，並在資料矛盾或資源有限時提出有依據的選擇，仍需要同事協助分析。", "能找出最影響領域方向的未知，判斷既有回饋、數據與研究結果是否足以支持決策。需要補充證據時，依風險和可用資源安排查證；條件允許時完成適合的研究或測試，條件不足時協調替代做法與後續時機。向有決定權的負責人提出有依據的選項，追蹤決定與效果。", "穩定安排領域內查證之外，在證據衝突、資料少或資源有限時，能找出仍可採用的依據與必要的補查方式，讓關鍵決策得以推進。後續決策與結果能說明如何減少試錯、避免無效投入或改善使用者問題，並持續修正判斷。"], "actions": ["整理影響領域方向的假設、既有證據和缺少的條件，依判斷錯誤的代價決定先釐清什麼。", "現有證據不足時，協調時間與資源，安排適合的研究或查證；暫時無法執行時，討論替代資料、縮小問題或分階段驗證。", "帶著實際發現、限制和選項討論決定，追蹤效果，確認仍待驗證的部分何時再看。"], "observations": ["使用質化資料時：能整合領域內的既有回饋與研究，處理矛盾線索，找出仍需了解的部分；需要且條件允許時安排補查，支持方向判斷。", "使用量化資料時：能判斷領域內的既有數據是否足以回答問題，處理定義、比較條件與資料限制；有缺口時安排可行查證，再提出投入建議。"], "example": "假設情境：團隊想重做訂閱流程，你先整理既有客服回饋與付款紀錄，發現失敗重試是可能的問題，但還不確定使用者卡在哪一步。你確認有時間與工程配合後，安排小範圍操作觀察，再測試局部修改。負責人據此先修這段流程；整體付款轉換是否提升，等資料齊全後再追蹤。", "responsibility": "找出影響產品或領域方向的重要未知，整合相關證據，安排優先查證並支持投入與改善決策。"}, {"scores": ["能從各產品資料整理共通問題與差異；判斷證據能否相互參考、哪些問題需要分別驗證，以及如何支持共同方向與投入安排時，仍需要其他負責人協助。", "能分清跨產品的共同問題與必要差異，判斷各產品既有證據的適用範圍。需要補充了解或驗證、條件也允許時，協調時間、資源與分工，完成適合的研究或查證；條件不足時確認替代做法與後續時機。用實際發現支持共同決定並持續追蹤，不要求各團隊採用同一方法。", "穩定支持跨產品判斷之外，遇到情境不同、證據衝突或查證成本高時，能釐清可共用與需分開判斷的發現，促成有依據的選擇。後續各團隊能自行判讀證據與安排必要查證，並有結果說明共同決策或體驗持續改善。"], "actions": ["比較各產品的問題與既有資料，分清共同發現、情境差異，以及還不能確定的部分。", "需要補充證據時，協調各產品可用的時間、資料和研究機會，完成適合的查證，不要求用同一方法。", "整理發現與適用範圍，協助共同決策並追蹤效果；未能回答的問題，確認後續時機和負責人。"], "observations": ["使用質化資料時：能比較各產品既有回饋與研究的適用範圍，分清共同發現與情境差異；需要補查時，協調各團隊的時間與資源。", "使用量化資料時：能確認各產品既有數據是否可比，處理指標、族群與產品階段差異；指出需要補足的部分，支持有依據的共同決定。"], "example": "假設情境：兩款產品都有導覽問題。一款已有近期任務觀察，足以支持調整分類；另一款只有點擊量，還不知道使用者為什麼找不到。你協助兩個團隊分清證據能回答什麼，後者在時間與資源允許下補做操作觀察，再各自決定怎麼改，留下結果、限制與後續安排。", "responsibility": "判斷跨產品證據能否相互參考，釐清共通與不同需求，支持多個團隊的共同方向與資源安排。"}], "facet_mode": "method_options"}, {"id": "C5", "name": "溝通協作與設計交付", "source_ids": ["C6", "C7"], "definition": "清楚表達自己的設計決策，說明要解決什麼問題、為什麼選這個做法，以及考量了哪些依據、限制與取捨。能理解並回應 PM、工程師、業務或其他利害關係人的問題，釐清對方的顧慮；尚無法確認的部分，會說明並追蹤回覆。依專案需要確認分工，安排時程、規格、版本與驗收；有分歧或變動時，整理選項、確認決定並更新資訊。這項看的是設計理由是否講得清楚、疑問是否得到適當回應，以及各方能否順利接手完成工作。", "facets": [{"name": "溝通與決策討論", "question": "能否說清楚自己的設計決策、依據與取捨，回應利害關係人的問題，並確認決定與分工？"}, {"name": "工作安排與設計交付", "question": "設計內容、版本、配合順序與驗收條件是否清楚，合作同事能否接著做？"}], "scoring_note": "溝通與交付分開記錄，最後給整項一個分數；符合期待與超出期待都需要兩個面向都符合目前職等的期待。分別看設計決策的說明、提問的回應與後續確認，以及交接和執行安排，並記下所需協助及外部限制。", "clarifications": [{"question": "溝通與交付的熟練程度不同，怎麼評？", "answer": "分開記下兩邊已能獨立完成的部分，以及需要協助的步驟，再對照整項描述。2 符合期待需要兩個面向都完成這個職階的責任；設計說明、回應提問、規格或交接安排中需要支持的部分，可以列為下一步練習。"}, {"question": "利害關係人的問題，一定要當場全部答出來嗎？", "answer": "先確認對方想了解什麼，用已知依據回應。需要查證時，說明待確認的部分、找誰協助與何時回覆，再完成後續確認。Jr. 遇到複雜取捨時可以請同事一起討論；評分看是否讓疑問獲得處理，不要求即席回答所有問題。"}, {"question": "PM 沒接受提案，或工程延誤，就不能達標嗎？", "answer": "看是否說清楚設計依據與取捨、理解並回應對方的顧慮，以及找對決策負責人確認。有變動時，更新範圍、時程與交接安排。不同意見和外部延誤不直接等於低分；要對照你實際負責的溝通與交付工作。"}], "levels": [{"scores": ["能介紹設計畫面、回應熟悉的問題，依安排整理交付；說清楚設計理由、處理待確認提問，以及補齊規格、版本與驗收資訊時，仍需要同事引導或協助。", "在明確任務內，能說清楚自己的設計決策與理由，回答相關同事對畫面和操作的問題；遇到複雜取捨或未知資訊，整理後請同事協助並追蹤回覆。能依範圍安排時間，交付清楚的畫面、狀態與版本，有變動時更新資訊並配合驗收修正。", "溝通與交付都穩定達標之外，能從提問發現容易誤解的設計，用對照或操作示範說清楚理由並完成回覆。交付順序變動時也能更新規格，後續任務能看到重複補問、版本混淆或交接遺漏減少。"], "actions": ["挑出任務中的主要設計決策，用目標、畫面和操作說明為什麼這樣做；聽清楚相關同事的問題，再針對疑問回答。", "遇到不確定的資訊或複雜取捨，記下問題、找誰協助和何時回覆；確認後更新設計說明與決定。", "安排討論與修改時間，整理畫面、狀態和版本，與接手同事確認交付及驗收方式；有變動時同步更新。"], "observations": ["能說清楚明確任務中的設計決策與理由，回答畫面和操作相關問題；需要協助的部分會整理並追蹤回覆。", "能安排自己的交付，提供正確規格與版本，有變動會更新並配合驗收。"], "example": "假設情境：你設計註冊表單，PM 問「錯誤訊息為什麼放在欄位下方？」你用畫面示範，說明讓使用者直接找到要修改的位置。工程追問帳號已存在時怎麼處理，你記下尚待確認的流程，和同事討論後補回說明，再把各種錯誤狀態整理到同一份規格，確認版本與驗收方式。", "responsibility": "說明自己任務的設計理由、回應相關提問，依分工完成規格、版本與驗收交接。"}, {"scores": ["能說明主要設計做法與常見疑問，安排部分交付；完整表達產品方案的依據與取捨，處理不同意見、範圍變更及交付衝突時，部分溝通與安排仍需要協助。", "針對自己負責的產品問題，能獨立說清楚設計決策、依據與取捨，回應利害關係人對需求、可行性和影響的問題；待確認的部分會追蹤回覆。能確認分工，安排交付、規格、版本與驗收，有變動時同步更新，讓合作同事理解並接著做。", "溝通與交付都穩定達標之外，面對不同立場的追問或工作互相等待時，能釐清顧慮，用證據、方案比較或原型說明取捨，協助確認決定。後續需求變動仍能順利交接，並有紀錄顯示誤解、等待或重做持續減少。"], "actions": ["整理問題、設計決策、支持依據與替代方案，說明為什麼這樣選，以及對使用者、產品目標和實作的影響。", "聽清楚 PM、工程或其他利害關係人的顧慮，用證據或示範回答；記下待查問題與回覆時間，找決策負責人確認取捨和分工。", "安排交付順序，提供畫面、狀態、版本與驗收條件；變更時更新相關說明，和接手同事確認是否能繼續做。"], "observations": ["能獨立說明產品問題中的設計決策、依據與取捨，回應利害關係人的顧慮並完成後續確認。", "能安排完整產品問題的交付順序、規格與驗收，讓合作同事順利接手。"], "example": "假設情境：付款改版時，你建議把折扣碼收在可展開的區塊。業務擔心使用者找不到，工程則問是否每個入口都要顯示。你用既有操作觀察和兩版原型說明建議理由，回應各入口的差異；找不到折扣碼的風險仍待驗證，你和 PM 確認測試安排，再整理採用方案、各種狀態與驗收條件交給工程。", "responsibility": "讓利害關係人理解一個產品問題的設計決策與取捨、獲得問題回覆，並協調完整設計交付。"}, {"scores": ["能說明熟悉功能的設計理由與交付安排；整合領域內跨功能取捨、回應各方關切，並安排多項工作與階段驗收時，部分重要討論與協調仍需要協助。", "能說清楚領域內的設計決策、依據與跨功能取捨，回應各方對產品目標、使用者體驗和實作限制的問題，並追蹤待確認事項。能釐清決定權，安排多個功能的階段交付、規格與驗收；需要調整資源或範圍時，帶著選項找有決定權的人確認。", "溝通與交付都穩定達標之外，遇到多方目標衝突、新舊版本並行或順序變動時，能用整段流程與方案比較說清楚影響、回應關鍵追問，並協調交付與驗收。後續版本能看到重複釐清、版本落差或重做減少，各方仍能理解取捨與接手條件。"], "actions": ["把領域內的重要設計決策串起來，說明各功能如何配合、為什麼這樣取捨，以及對各方目標和後續工作的影響。", "針對 PM、工程、業務等利害關係人的提問，先釐清顧慮，再用流程、證據或方案比較回應；待確認事項持續追蹤，需要拍板時帶選項找負責人。", "把確認好的決定排成階段交付、新舊規格與驗收順序；更新受影響的功能與版本，確認各方知道接下來怎麼做。"], "observations": ["能說明領域內設計決策與跨功能取捨，回應不同利害關係人的問題，確認待查事項和最後決定。", "能安排多功能的階段交付、新舊規格與驗收，處理版本和工作接續。"], "example": "假設情境：訂閱改版時，你建議把「已付款」和「服務已開通」分成兩個狀態。PM 問為什麼不能只顯示訂閱成功，客服擔心使用者會以為付款失敗。你用付款到開通的完整流程，說明等待期間要顯示什麼、如何查進度，以及兩種做法的影響；開通延遲多久需要提醒，則和工程確認後回覆，再更新會員與付款功能的規格和驗收順序。", "responsibility": "說明產品或領域內多個功能的設計決策，回應各方關切，整合分階段交付與跨功能配合事項。"}, {"scores": ["能提出跨產品方案與初步交付安排；向不同團隊說清楚共同原則與必要差異、回應採用成本的疑問，並處理跨產品分工、時程與驗收衝突時，仍需要其他負責人協助。", "在負責的跨產品範圍內，能說清楚設計決策的依據、共同原則與必要差異，回應各團隊對適用性、成本和體驗的問題，並完成待確認事項的後續回覆。能釐清決定權，協調版本順序、交付規格與驗收分工；有變動時更新安排，超出權限則找負責人協調。", "溝通與交付都穩定達標之外，能將多產品目標、版本或時程衝突整理成可比較的選項，說清楚共同與差異做法，協調過渡規格與驗收。後續各團隊能依清楚的依據處理新疑問，且有紀錄顯示誤解、等待或交接遺漏持續減少。"], "actions": ["說明跨產品的重要設計決策與依據，整理共同原則、需要保留的差異，以及各做法對體驗和投入的影響。", "回應各產品負責人與合作團隊的問題，用具體情境說明原則如何適用；將分歧整理成可比較的選項，確認決定權並追蹤待查問題。", "把確認好的決定轉成交付規格、版本順序與驗收分工；有調整時說明理由和影響，確認各團隊能依更新內容接續。"], "observations": ["能清楚表達跨產品設計決策，說明共同原則與必要差異，回應各團隊的顧慮並確認後續決定。", "能協調跨產品版本、過渡規格與驗收安排，讓各團隊清楚接手條件。"], "example": "假設情境：兩個產品要接同一套登入服務，其中一個產品希望保留原本的登入畫面。你說明哪些操作需要共用，例如登入失敗後的處理；哪些品牌呈現可以不同，再回答產品負責人對辨識度和改版成本的問題。尚未確定的技術限制請工程確認，回覆後記下最後決定，安排各產品的過渡版本與驗收條件。", "responsibility": "讓多個產品團隊理解共同設計方向與適用範圍，回應採用成本及體驗差異，協調各團隊如何落實。"}], "show_facets_in_map": false}, {"id": "C6", "name": "AI 探索與應用", "source_ids": ["C8"], "definition": "持續探索 AI 在設計工作中的用法，從實際遇到的問題出發，嘗試用 AI 協助整理需求、發想方案、製作內容或原型、檢查設計與交付。這項看的是能否把嘗試用到工作上，自己判斷、檢查並修正產出，讓設計品質更好、工作更有效率。也要比較使用前後的成果與投入，持續調整做法，累積真正有幫助的應用。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依教學或熟悉做法，用 AI 完成部分設計工作；選擇適合的用法、補足背景、檢查產出，以及比較修改成本與實際效果時，仍需要同事引導或協助。", "能在明確任務中主動嘗試適合的 AI 用法，提供背景與限制，檢查、修正後用到工作。能說明哪個步驟更省時或品質更好，並依結果調整做法。", "穩定把適合的 AI 用在任務之外，遇到產出不符需求或修改費時時，能找出原因並調整背景、操作方式或工具。後續任務能確認整體時間、遺漏或重做持續減少，品質維持或提升，並能分享適用的做法。"], "actions": ["挑一個自己常花時間或容易遺漏的步驟，先記下原本怎麼做、成果需要符合什麼條件。", "嘗試讓 AI 協助，提供必要背景；對照需求檢查產出，調整用法並自己完成修正。", "比較前後成果及包含修改在內的時間，留下有效做法；下一次任務再看是否適用。"], "example": "假設情境：你負責表單的錯誤提示，過去常漏掉字數或特殊輸入的情況。你把已確認的欄位規則交給 AI，請它列出情境和文案，再逐項對照，刪掉不適用的建議、修正語氣。記下整理與修改的總時間，下次表單再調整用法，比較是否更快整理齊全、少了哪些遺漏。", "observations": [], "responsibility": "探索 AI 在自己設計任務中的用法，實際嘗試、檢查產出，判斷是否讓工作更好或更快。"}, {"scores": ["能用 AI 協助熟悉的設計步驟並檢查明顯問題；從一個產品問題中找出值得嘗試的環節、調整用法與交接，並確認整體品質或效率時，部分判斷仍需要協助。", "能針對自己負責的產品問題，找出適合 AI 協助的設計工作，主動嘗試並用到實際任務。能調整做法、檢查與修正產出，讓成果符合需求，並用前後比較說明品質或效率的改善。", "穩定探索並應用 AI 之外，當製作變快卻增加修改或交接負擔時，能找出問題、調整工具搭配與工作方式。不同任務或後續迭代的紀錄能確認整體時間、遺漏或重做減少，成果維持品質，並說清楚用法的適用條件。"], "actions": ["從這次產品問題的設計工作中，找出最值得改善的環節，訂出品質要求與比較方式。", "嘗試 AI 用法並完成實際任務，檢查內容、畫面或互動，找出還需要自己判斷與修改的部分。", "把製作、檢查、修改和交接一起比較，保留有效做法，依後續任務繼續調整。"], "example": "假設情境：你要比較兩種搜尋結果的呈現方式，手動做兩套可輸入關鍵字的原型很花時間。你讓 AI 依既有元件產生草稿，自己補上無結果、載入與返回的互動，再確認兩套都能完成同一個任務。你把產生、修改與交接時間一起比較，留下適用的做法，讓下次比較方案時更快準備好可用原型。", "observations": [], "responsibility": "在一個產品問題的設計過程中主動找出 AI 可協助的環節，調整用法並確認品質或整體效率改善。"}, {"scores": ["能從自己熟悉的設計工作提出 AI 嘗試；找出領域內值得改善的共通工作、安排同事試用，並串接檢查、修改與交接流程時，仍需要協助規劃與判斷效果。", "能從產品或領域的設計工作中找出 AI 應用機會，安排實際嘗試並調整工作流程。能跟相關同事確認檢查與交接方式，持續比較包含修改成本的效率與品質，讓有效做法用在後續工作。", "穩定推進領域內 AI 應用之外，能處理多功能、新舊規則或同事工作方式不同造成的出錯、檢查費時與交接問題。後續版本與實際採用紀錄能說明整段工作更有效率或品質提升，效果不如預期時也會調整或停用。"], "actions": ["整理領域內反覆耗時、容易遺漏或重做的設計工作，選出值得先嘗試 AI 的環節。", "和相關同事用實際任務試做，確認輸入背景、檢查標準與交接方式，依問題調整流程。", "追蹤後續功能與版本的使用情況，比較整體時間和品質，繼續改進有效做法並停用效果差的用法。"], "example": "假設情境：同一產品每次新增方案，都要改方案頁、結帳頁和會員頁，設計審查常發現文案或狀態漏改。你試著讓 AI 依需求和既有規則整理受影響的畫面與檢查清單，找 PM、設計與工程用一個版本試做，人工確認清單並修正遺漏。後續版本再比較整理、審查與重做時間，以及漏改的情況，決定哪些步驟保留、哪些要調整。", "observations": [], "responsibility": "找出產品或領域內反覆耗時、容易出錯的設計工作，帶著同事試用 AI，改善整段工作流程。"}, {"scores": ["能從單一產品經驗提出跨產品 AI 應用方向；判斷哪些值得推廣、如何適應各團隊條件，以及如何確認採用後的整體效果時，仍需要其他負責人協助。", "能持續探索 AI 如何改善跨產品的設計工作，找出共同問題，和各團隊完成實際嘗試。能依產品差異調整用法與檢查方式，推動有效做法被採用，並確認整體品質或效率的改善。", "穩定推動跨產品 AI 應用之外，能解決各產品規則、流程與工具限制不同造成的採用障礙，讓團隊依情境調整。包含修改與維護成本的後續紀錄能確認品質或效率改善，各團隊也能在工具變動時自行評估、更新或停用。"], "actions": ["比較各產品的設計工作，找出共同瓶頸，選擇值得跨團隊嘗試的 AI 應用。", "讓各團隊用實際任務試做，釐清可共用的方法與需要保留的差異，確認成果及完整投入。", "追蹤採用後的品質與效率，讓團隊學會自行檢查、調整；遇到新工具或新需求時再評估。"], "example": "假設情境：兩個產品團隊都想用 AI 加快原型製作，但一個有完整元件庫，另一個還在探索版型。你和兩邊各選一個真實任務試做：前者讓 AI 沿用元件，後者用來比較版面方向。各自記下製作、修正和交接時間，確認成果可用後才延續做法；後續團隊也能依任務自行調整，回報哪些用法持續省時、哪些反而增加修改。", "observations": [], "responsibility": "推動多個產品團隊探索有價值的 AI 用法，依各團隊需求調整做法，確認採用後的品質與效率。"}], "clarifications": [{"question": "每個任務都要用 AI，或學很多工具嗎？", "answer": "看整段期間是否持續探索、把適合的用法放進實際工作，再依結果改進。每個任務不必硬用 AI，也不按工具數量或使用次數評分；要說明自己嘗試了什麼、如何判斷，以及帶來的品質或效率變化。"}, {"question": "怎麼確認 AI 真的有幫助？", "answer": "用相近任務比較前後成果，時間要算進檢查、修改和交接，品質可看資訊是否正確、狀態是否完整、重做是否減少。能提升品質或效率都可以，但省時後仍要符合任務的品質要求；只有產出草稿更快，還不足以說明整體改善。"}, {"question": "一定要用 AI 做原型或寫程式嗎？", "answer": "應用可以是整理需求、探索方案、製作內容或原型、檢查設計與交付。依實際工作選擇有幫助的用途；如果做原型，要說清楚哪些是模擬，正式程式與上線則依專案分工。"}]}, {"id": "C7", "name": "設計系統與知識共用", "source_ids": ["C9"], "definition": "先判斷現有元件、規則、案例和方法能不能用，適用時正確沿用；遇到反覆出現的需求，再整理成後續工作能繼續使用的內容。這項看用途和限制是否清楚、設計規範是否跟實作一致，以及有人使用、更新後，是否真的減少重做。共用內容可以是元件、原則或案例，不要求每個任務都新增元件，也不要求所有事業單位使用同一套系統。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依範例使用現有元件與規則；選擇變體、補齊狀態、套用命名，以及說明不適用的情況時，仍需要同事引導或協助檢查。", "能正確使用適合任務的元件、規則和命名，檢查變體與狀態。不適用時會說清楚缺什麼，並留下合作同事看得懂的交付與例外說明。", "穩定用對現有內容之外，能多次找出元件、命名或說明容易讓人用錯的地方，提出具體補充並確認後調整。後續任務能看出同類誤解或重做減少，也維持設計一致性。"], "actions": ["先查現有元件和範例，確認版本與適用情況。", "依規則命名、使用變體，避免沒有必要就複製新元件。", "遇到現有元件無法處理的情況，附上使用情境和畫面，找負責人確認。"], "example": "假設情境：收藏狀態好像需要第三種按鈕樣式，你先確認現有變體能不能表達，再把不足的地方整理給元件負責人。", "observations": [], "responsibility": "正確使用現有元件與設計規則，整理任務中的狀態與交付內容，遇到不適用時提出來。"}, {"scores": ["能使用熟悉的元件與規則完成主要畫面；判斷新情境是否適用、補足缺口，並說明替代做法、使用限制及延用方式時，部分重要判斷仍需要同事協助。", "能先判斷現有元件與規則是否適用，適用就正確使用，不適用則說明不足和替代做法。交付時把狀態、用途和限制寫清楚，避免不必要的重複或不同做法。", "穩定判斷與補足任務需要之外，能將常遇到的重複需求整理成可延用的元件、規則或案例，說清楚適用與不適用情況。後續任務實際使用並調整後，能確認重複解釋、製作或品質問題減少；不必建立全團隊的管理制度。"], "actions": ["交付前先查現有規則，判斷能不能直接使用。", "需要修改或新增時，寫清楚不足、用途、狀態和適用範圍，找負責人確認。", "看看後續任務怎麼用，修正難懂或不適用的內容。"], "example": "假設情境：不同表單都反覆遇到錯誤提示問題。你整理提示位置和文字原則，在下一個表單實際使用並依回饋修改，留下規則和兩次交付紀錄，不用先做出完整 Design System。", "observations": [], "responsibility": "判斷現有元件、規則或案例是否適合產品問題，補足缺口，讓這次成果能被接手與延用。"}, {"scores": ["能整理個別元件或案例，提出共用建議；從領域重複需求判斷值得共用的內容、處理工程差異與例外，並安排維護及後續使用時，仍需要協助。", "能針對領域內反覆出現的問題，選用或補強可共用的元件、規則與案例，說清楚用途、限制和維護方式，讓後續工作實際用得上。", "穩定提供領域共用內容之外，能解決既有規則、實際需求與工程實作之間的落差，完成修改及回報安排。內容在後續任務持續使用、更新，同事知道如何擴充並維持品質，且有實際案例顯示重做或不一致減少。"], "actions": ["從反覆發生的問題找共用機會，先檢查現有內容，再說明為什麼需要擴充。", "補齊使用情境、狀態、限制、工程對應和維護分工。", "追蹤後續任務的使用與問題，確認減少了哪些重做或不一致。"], "example": "假設情境：你補齊現有表單元件的錯誤狀態，跟工程確認一致，再追蹤後續功能怎麼使用。這項會看實際使用、回報和維護紀錄，不只看新增多少元件。", "observations": [], "responsibility": "把產品或領域反覆遇到的需求整理成可共用的元件、規則或案例，安排維護並確認後續真的好用。"}, {"scores": ["能從單一產品的共用經驗提出跨產品建議；比較共用效益、各團隊差異與維護成本，並確認適用範圍、擴充及維護分工時，仍需要其他負責人協助分析。", "能判斷哪些元件、規則或案例值得跨產品共用，與各團隊確認適用範圍、必要例外、擴充與維護分工。能推動多個團隊實際採用，確認設計與工程使用方式一致，並依後續問題調整內容；各產品可以保留有理由的差異。", "穩定推動跨產品採用之外，能解決不同需求與技術造成的難用、難更新問題，兼顧一致性與合理例外。後續各團隊能自行擴充、修改並持續維護，實際使用紀錄也顯示重複製作或品質問題減少。"], "actions": ["比較共用元件、只共用原則和分開處理，各自需要多少成本。", "選擇確實有幫助的內容讓團隊使用，確認例外情況和維護負責人。", "追蹤後續使用、擴充，以及設計和實作是否保持一致。"], "example": "假設情境：多個產品反覆重做價格資訊。你整理共用的資訊規則、保留不同排版，確認誰負責更新，再觀察後續任務能不能自行延伸使用。", "observations": [], "responsibility": "判斷哪些設計內容值得跨產品共用，協調適用範圍、擴充與維護方式，確認多個團隊持續採用。"}], "clarifications": [{"question": "一定要建 Design System，或做新元件嗎？", "answer": "先把適用的現有內容用對，也能提供評分證據。較高分會看後續是否真的有人使用、使用問題有沒有改善，以及是否持續更新。可以共用原則或案例，也可以保留產品差異；C8 再另外看同事的判斷能力是否進步。"}], "discussion_tag": "考慮與 C2 合併"}, {"id": "C8", "name": "主動當責與專業影響力", "source_ids": ["C10"], "definition": "在自己的責任範圍內，主動注意影響使用者體驗或工作品質的問題，提出可行做法，遇到阻礙時尋求必要協助並追蹤後續。能說明自己的判斷，發現不合適時願意調整，也把有效經驗用在之後的工作。隨著職階提高，進一步幫助同事與其他團隊改善做法、提升判斷能力。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能在提醒或明確分工下提出問題並完成修正；主動判斷影響、確認找誰協助、追蹤未完成事項，以及把回饋用在下一次任務時，仍需要同事引導或協助。", "能主動提出自己任務中的問題，說明目前判斷與需要的協助，完成自己負責的修正並確認後續。發現原本做法不適合時，能依回饋調整，並把學到的做法用到下一次工作。", "穩定主動處理任務問題之外，遇到做法或分工不清時，能先整理影響與自己可承接的部分，帶著建議確認並跟進。也會調整造成遺漏的工作習慣，後續任務能看到同類問題或需要提醒的情況持續減少。"], "actions": ["遇到問題先記下影響、自己的判斷，以及需要誰協助，及早拿出來討論。", "確認自己要處理的部分，完成修正；超出範圍的問題，確認交由誰接手及後續狀態。", "回頭看原本為什麼沒注意到，調整自己的做法，下一個任務再確認是否有改善。"], "example": "假設情境：你交完註冊表單後，自己發現錯誤提示會把原本輸入清空。你帶著操作紀錄告訴 PM 和工程，確認由自己補上保留輸入的設計，完成後再操作檢查。之後做其他表單時，你把「失敗後資料是否保留」加入自己的檢查習慣，記下哪些遺漏因此減少。", "observations": [], "responsibility": "主動提出自己任務中的問題，跟進處理，將回饋與修正經驗用在後續工作。"}, {"scores": ["能處理自己產品問題中已發現的遺漏，完成明確改善；主動釐清沒人接手的部分、持續跟進，並在結果不同於預期時修正判斷，仍需要同事協助。", "能主動承接自己負責的產品問題，發現遺漏或責任不清時，提出影響與可行做法，確認自己和相關同事各自處理的部分並跟進。會根據實際結果檢討與修正判斷，把有效經驗用到後續工作。", "穩定承接與跟進產品問題之外，面對反覆擱置、原先判斷被推翻或中途出現限制時，能主動調整做法、推進可行的下一步。後續任務能確認同類問題減少，合作同事也能運用這些經驗改善工作。"], "actions": ["主動查看自己負責問題的後續回饋，找出還沒處理或沒人接手的部分，說明影響與建議。", "確認自己可以承接什麼、哪些需要協助，跟進到問題已處理，或已有明確的後續決定。", "把結果和原先判斷對照，說清楚要修正什麼，將學到的做法用在下一次工作並分享。"], "example": "假設情境：你負責的取消訂閱流程已上線，但客服仍收到「取消後立刻不能用嗎」的疑問。你主動查看回饋，發現自己原先認為清楚的到期說明仍會被誤解，便提出並承接文案與資訊位置的調整。和 PM 確認安排後，你追蹤修改與後續回饋，再把這次判斷失準的原因用在其他權益說明。", "observations": [], "responsibility": "主動承接自己產品問題中的遺漏，釐清與同事的責任並跟進，依實際結果修正判斷。"}, {"scores": ["能推進熟悉的領域問題、分享經驗與回饋；持續處理跨功能反覆發生的問題，並透過審查或指導幫同事學會自行判斷時，仍需要協助規劃與調整做法。", "能主動推動領域內反覆問題的改善，確認自己與相關同事的責任，遇到阻礙時尋求必要協助並跟進。會檢討自己的判斷，也透過審查、合作或指導，幫助同事理解原因並逐步自行處理類似問題。", "穩定推動領域改善與指導之外，當問題跨功能反覆出現、既有做法失效或同事難以判斷時，能找出原因並調整自己的處理與指導方式。後續版本能看到同類問題減少，同事能自行比較選項、推進處理並把經驗傳下去。"], "actions": ["留意領域內反覆出現或尚未有人承接的問題，提出影響、自己能做的事，以及需要的配合。", "和相關同事確認處理方向並跟進，檢討原先判斷，遇到限制時調整做法或尋求協助。", "在審查、合作或指導中說明判斷方式，讓同事自己嘗試；後續再看問題是否減少、對方能否自行運用。"], "example": "假設情境：你發現團隊多次只設計付款成功的畫面，付款失敗後如何繼續常到驗收才補。你主動提出這個反覆問題，也檢討自己之前的審查只看主要流程。你和同事用一個功能練習判斷失敗情境，承接現有問題的改善；下一個功能讓同事自行整理，再看是否提早補齊、驗收時的遺漏有沒有減少。", "observations": [], "responsibility": "推動產品或領域反覆發生的問題獲得處理，並透過合作與指導，讓同事更能自行判斷與改善。"}, {"scores": ["能從單一產品經驗推進跨產品的初步改善；處理長期責任缺口、調整適合各團隊的指導方式，並幫助團隊自行延續改善時，仍需要其他負責人協助。", "能主動推動跨產品的共同問題獲得處理，確認自己與各團隊的責任，協調必要支持並追蹤改善。會依實際結果修正主張，透過合作、審查或指導，讓各團隊理解做法與適用範圍，能在後續工作中自行運用。", "穩定推動跨產品改善之外，遇到共同問題長期沒人承接、做法互相衝突或改善無法延續時，能重新檢視並調整自己的主張與推動方式。後續各團隊能自行發現缺口、承接與檢討，共同問題持續減少，經驗也能用到其他團隊。"], "actions": ["從多個產品的工作與回饋找出共同問題，主動提出自己能如何推動，確認各團隊願意承接的部分。", "和有決定權的負責人確認支持與分工，跟進實際改善；依產品差異和結果修正原先主張。", "讓團隊理解判斷理由並自行調整，觀察後續是否能持續發現、承接和改善問題，再提供需要的協助。"], "example": "假設情境：兩款產品的會員權益說明，常因業務規則變更而過期，卻都以為另一個角色會檢查。你主動提出共同的責任缺口，和各產品負責人確認誰提出變更、誰檢查體驗，並一起處理既有問題。你依兩邊情況調整原先建議，讓團隊理解判斷方式；後續推出新方案時，團隊能自行提出檢查並修正，過期說明也持續減少。", "observations": [], "responsibility": "主動推動跨產品共同問題的改善，協調責任並傳遞判斷方法，讓各團隊能自行延續改善。"}], "clarifications": [{"question": "同一個案子，C5 和 C8 怎麼分別評？", "answer": "C5 看設計討論、分工、規格與驗收是否清楚，合作同事能否順利接手；C8 看是否主動承接問題、依結果修正自己的判斷，以及把改善用到後續工作。可以用同一案子的不同紀錄說明，但單純準時交件不會讓兩項一起拿高分。"}, {"question": "當責代表所有問題都要自己扛嗎？", "answer": "在自己的責任與決定權內承接；超出範圍時，提出影響和建議，找有權限的人確認分工與資源，並跟進後續決定。評分看實際採取的行動，不要求加班、越權，或保證自己無法控制的結果。合理提出停止或延後，也可以是負責的判斷。"}, {"question": "只有自己一位設計師，怎麼展現專業影響力？", "answer": "Jr.、Md. 可以從自己的任務、修正判斷和後續改善累積，不必另外找人指導。Sr.、Principal 可以在正常工作中與 PM、工程或其他事業單位的設計師合作、審查或分享，讓對方實際運用。主管應協助安排相應機會與支持，x-lab 也一樣。"}, {"question": "和公司價值觀有重複嗎？", "answer": "公司價值觀沿用既有名稱與評估規則。C8 依目前職等，看具體工作中的承接、判斷修正與專業影響；要有行動和後續紀錄，不另外用「態度積極」或「很有責任感」直接給分。"}]}], "common_rules": [{"title": "這份職能地圖怎麼用", "text": "這份三段試評稿分成 8 項共同職能，每項都有四個職階的責任、做法與三段行為描述。先選目前職階，再對照實際工作紀錄，討論表現和下一步。正式考核制度還需要主管確認。先前的四角色 AI 模擬討論針對原 10 項版本，沒有重新審閱這次的三段文字。"}, {"title": "三段評等怎麼區分", "text": "1 能力發展中：已能做到部分工作，但本階的重要責任尚未穩定完成，需要具體引導或協助。2 符合期待：能穩定完成本階責任，包括合理判斷、品質檢查、合作與追蹤。3 超出期待：穩定達標之外，在較難情境中帶來可確認、能延續的改善。正常向 PM 確認目標、向工程師確認可行性及參與設計審查，不會因此被評低分。Jr. 的問題定義與複雜取捨，本來就可以由他人協助。"}, {"title": "職等銜接與表現評等，分開看", "text": "職等比較看責任如何從明確任務、一個產品問題，擴大到產品或領域及跨產品。每一項評等都只對照目前職等的責任；高一階的 1 不等於前一階的 2，也不預設已達成前一階全部要求。3 超出期待要有額外判斷與後續成果，不以文件、工具或工時數量決定，也不要求每項建立制度。是否晉升另外看下一階責任的實際表現。"}, {"title": "C4 看證據與研究判斷；C5 看溝通與交付", "text": "C4 先看設計判斷是否有適用的證據。既有回饋、數據或研究結果已足夠時，可以直接使用；需要更了解使用者或驗證設計，且時間與資源允許時，應安排質化或量化研究，可擇一或搭配。超出期待也不要求每案新增研究或湊齊兩種方法。C5 的溝通與決策討論、工作安排與設計交付，則是兩個都要負責的面向，符合期待與超出期待都需要兩邊達標。兩項都各給一個分數。缺少合理機會而無法判斷整項時，保留已有紀錄，標未觀察並安排補足。"}, {"title": "先確認評估期間與工作條件，再看整段表現", "text": "評估前，主管和設計師一起確認這段時間負責哪些工作、完成標準，以及可以取得的時間、資料和協助。評分時看整段期間的實際完成方式與需要的支持，不以單次失誤或一次需要提醒就決定分數。缺少資源或工作機會的部分，要分開記錄並安排補足。"}, {"title": "先說清楚這次要做到哪裡", "text": "任務開始時，先確認使用對象、流程起點與終點、負責範圍、相關平台和品質要求。完整是把這次需要的情況處理好，不是每個案子都要有跨平台、多角色或所有狀態。發現範圍外的風險時，仍要說明，並確認由誰接著處理。"}, {"title": "負責推動工作，和最後拍板是不同責任", "text": "設計師主導專業工作，包括提出問題和選項、找相關同事討論，以及追蹤決定和實作。資源、優先順序、上線和是否停止投入，要由專案中有這項決定權的負責人確認。提案沒被接受或遲遲沒回覆時，看你是否有合理判斷、及時找人協調並跟進；不要求越權，也不能把還沒採用的提案算成已完成的改善。"}, {"title": "證據能說明到哪裡，就評到哪裡", "text": "上線前測試、可操作原型和上線後資料都可以當證據，但要說清楚能回答的問題。原型能看出使用者懂不懂、能不能操作，還不能直接證明正式轉換、留存或營收。推翻假設、停止無效方案也可以是好的判斷。數字變好不會自動高分；前後有變化，也不一定就是這次設計造成的。"}, {"title": "缺少機會時，要一起安排怎麼補足", "text": "缺任務、時間、資料權限、工程協助或交流機會時，記下缺什麼、已經做了什麼、有哪些替代方式、誰會協助，以及何時再看。已有足夠證據就依實際表現評分；無法判斷整項才標未觀察，已有證據仍保留。C4 沒做另一種研究方法不會直接變成未觀察，替代資料也只能支持它實際能回答的問題。主管應在正常工作內安排機會，避免一直等不到，或到期末才突然增加要求。"}, {"title": "同一個案子可以用在多項，但要說明不同能力", "text": "每項要說清楚自己的責任、行動與結果。同一案子可以提供不同能力的紀錄：C1 看問題與取捨判斷，C4 看證據解讀與應用，C5 看溝通、規格與交接安排，C8 看主動承接、修正判斷及後續影響。不能只因準時交件或案子上線，就讓多項一起拿高分；團隊與他人的貢獻也要分開說明。"}, {"title": "不同事業單位，用同一套共同標準", "text": "各事業單位和 x-lab 的產品、階段與任務可以不同，評分仍對照相同的職階責任與共同職能。探索中的產品可以用查明了什麼、因此決定做或不做什麼來說明成果；成熟產品則可以用實際改善與後續使用情況說明。"}, {"title": "持續探索 AI，確認實際幫助", "text": "C6 看整段期間如何探索並善用 AI，提升設計品質或工作效率。要有實際嘗試、產出檢查與後續調整，不按工具數量或使用次數評分，也不要求每個任務都使用。比較效率要包含檢查、修改與交接成本，成果仍須符合任務要求。原型要說明模擬限制；正式程式與上線依專案分工。"}, {"title": "從主動承接，到帶動後續改善", "text": "C8 看如何在目前職等的責任內主動提出與承接問題、依結果修正判斷，並讓改善延續。Jr.、Md. 從自己的任務與產品問題累積；Sr.、Principal 也要透過合作、審查或指導，幫助同事及團隊自行判斷。不要求有部屬或開課；事業單位只有一位設計師或在 x-lab，主管仍應協助安排正常工作內的合作機會、相應決定權與資源。"}, {"title": "先看各項分布，再討論發展與晉升", "text": "三段試評呈現各項評等、已評項目數與未觀察項目，不計算總分、平均、百分比或整體高低分級。舊五分的分數不能直接換算，請用原工作案例重新對照。發展中項目要說明需要的支持，超出期待要有具體成果；不能用另一項的高表現抵銷尚未做到的責任。正式考核如何彙整，以及晉升的評估期間與判斷方式，仍需要確認。"}], "pending_decisions": ["三段試評是否適合正式採用、如何彙整各項判斷、看多長的期間，以及由誰一起用實際案例校準「穩定／持續」的標準。", "C4 採用的方法、結果與限制，以及 C5 的溝通和交付分別怎麼記錄；證據仍不足或缺少合理機會時，正式評分與晉升怎麼處理。", "各專案的優先順序、MVP、成功指標、資源、上線和停止投入，由誰決定；卡住時找誰協調。", "事業單位只有一位設計師、x-lab 或跨團隊工作時，由哪些主管提供時間、任務、資料和工程協助。", "Product Builder 若需要提交正式程式、整合或上線，先寫清楚適用職務、提供的協助，以及驗收條件。", "管理職的招募、人力安排、績效和培育制度另行定義；專業職四階不會默認包含這些責任。"], "mapping_v3": [["舊版 v3 項目", "這版對應項目", "調整方式"], ["工作大小", "C1、C5", "看責任、複雜度、取捨與設計交付；工時用來排程。"], ["元件使用", "C7 設計系統與知識共用", "保留正確使用、判斷是否適用，以及後續是否繼續使用。"], ["設計品質與一致性", "C2 UI 品質與資訊呈現", "看資訊呈現與實作品質；後續共用另看 C7。"], ["流程與資訊架構", "C3 流程與互動設計", "看操作路徑、狀態、例外，以及失敗後怎麼繼續。"], ["使用者體驗與互動設計", "C2、C3", "分開看資訊是否清楚、操作是否完整。"], ["用戶研究", "C4 質化或量化研究", "研究與驗證整理在同一項；依問題選質化或量化，記錄方法、實際結果與應用，不要求兩種都做。"], ["數據", "C4 質化或量化研究", "研究與驗證整理在同一項；依問題選質化或量化，記錄方法、實際結果與應用，不要求兩種都做。"], ["需求分析與產品策略", "C1 問題釐清", "看如何判斷問題、方向、範圍和代價。"], ["跨部門溝通與協作", "C5 溝通協作與設計交付", "看設計決策能否說清楚、利害關係人的問題是否獲得回應，以及交付能否順利接續。"], ["簡報會議", "C5 溝通協作與設計交付", "看能否說明設計決策、依據與取捨，回應提問並確認後續；不按聽眾職稱決定職階。"], ["領導", "C8 主動當責與專業影響力", "以主動承接與持續改善為基礎，資深職等也看同事和團隊能否運用；保留專業指導，正式人員管理另外定義。"], ["當責", "C8 主動當責與專業影響力", "看主動承接問題、依結果修正判斷，以及後續改善；C5 另看協作與交付安排，公司價值觀沿用既有規則。"], ["新增能力", "C6 AI 探索與應用", "聚焦持續探索並善用 AI，將嘗試用在實際工作，檢查產出並確認設計品質或整體效率的改善。"]], "mapping_v4": [["前一版 10 項（舊編號）", "本版對應（新編號）", "調整"], ["C1 問題理解與取捨", "C1 問題釐清", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C2 UI 品質與資訊呈現", "C2 UI 品質與資訊呈現", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C3 流程與互動完整性", "C3 流程與互動設計", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C4 用戶理解與證據判讀＋C5 驗證與持續迭代", "C4 質化或量化研究", "研究與驗證整理在同一項；依問題選質化或量化，記錄方法、實際結果與應用，不要求兩種都做。"], ["C6 協作與決策溝通＋C7 交付與工作管理", "C5 溝通協作與設計交付", "聚焦設計決策的說明、利害關係人提問的回應，以及分工、規格與交付安排。兩個面向各自觀察，整項給一個分數；主動承接與後續影響另看 C8。"], ["C8 AI、原型與工具應用", "C6 AI 探索與應用", "聚焦持續探索並善用 AI，將嘗試用在實際工作，檢查產出並確認設計品質或整體效率的改善。"], ["C9 設計系統與知識重用", "C7 設計系統與知識共用", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C10 專業指導與影響", "C8 主動當責與專業影響力", "擴大為主動承接、修正判斷與持續改善；資深職等保留透過合作、審查或指導帶動團隊的要求。"]], "context": {"roles": [["項目", "職能 1｜Jr. Designer", "職能 2｜Md. Designer／Product Designer", "職能 3｜Sr. Designer／Product Builder", "職能 4｜Principal Designer"], ["角色定位", "在明確目標下，獨立完成設計任務", "獨立解決範圍明確的產品問題", "主導一個產品或領域，找出機會並完成改善", "主導跨產品的體驗方向，解決共同問題"], ["負責範圍", "單一任務、功能或範圍清楚的一段流程", "完整使用流程或產品問題，從釐清到驗證", "產品或領域內互相影響的問題、優先順序與後續改善", "多個產品的共同體驗、系統與重要取捨"], ["如何獨立工作", "自己完成設計；釐清問題和複雜取捨時可請人協助", "自己釐清問題、比較方案；大幅調整範圍時一起討論決定", "主動提出做什麼、為什麼做、怎麼驗證，依專案分工完成", "提出跨產品方向，協調各方做出決定，並跟進實際使用"], ["品質責任", "自己交付的流程、畫面、狀態和規格", "負責問題的完整體驗與上線品質", "領域內的品質、重要設計決定和持續改善", "跨產品的品質原則與共同體驗問題"], ["期待成果", "符合任務目標，穩定交付，能依回饋修改", "確認問題有沒有改善，根據結果調整", "讓產品或領域有實際成果，並決定下一步", "改善跨產品問題，讓多個團隊持續受益"], ["如何幫助同事", "說明設計理由，把回饋用到工作上", "給同事有依據、做得到的建議", "透過指導與審查，幫助同事改善判斷", "讓多個團隊實際使用共同原則與方法，持續提升設計能力"], ["管理責任", "沒有正式人員管理要求", "沒有正式人員管理要求", "需要專業指導，不要求有直屬部屬或負責績效管理", "需要跨團隊專業影響，不要求有直屬部屬或負責績效管理"]], "scale": [["評等", "定義", "判斷重點"], ["1 能力發展中", "已能完成部分工作，但本職階的重要責任尚未穩定做到，需要引導或協助。", "說清楚已能做到什麼、哪些重要判斷或後續處理需要練習，以及誰能協助。"], ["2 符合期待", "能穩定完成本職階責任，做出合理判斷、自行檢查並完成合作與後續追蹤。", "這是本職階的達標表現。正常討論、請教與依權限確認決定都包含在內。"], ["3 超出期待", "穩定達標之外，在較難情境中做出額外判斷，並在不同任務或後續迭代中帶來可確認的改善。", "說明難在哪裡、多做了什麼判斷、改善了什麼，以及後續效果；不直接等於下一職階。"], ["未觀察", "還沒有足夠案例或工作機會，無法判斷這項職能。", "記下限制、已有部分、需要的協助與下次確認時間；不當成 0 分或能力發展中。"]], "values": [["價值觀", "在 UIUX 工作中可以看什麼", "責任增加後的表現", "可以參考的紀錄"], ["貢獻價值", "了解使用者需求，考慮長期目標，主動跟同事合作，讓成果真的有幫助", "從完成有價值的任務、改善產品問題，到領域與跨產品成果", "使用者遇到的問題是否改善、做了哪些取捨與合作；不只看交付數量"], ["自我超越", "找出自己不足的地方，設定目標、學習並用到工作，主動找回饋改進", "從改善自己的工作，到幫助同事和其他團隊提升能力", "原本不足的地方、設定的目標、實際運用和前後改變；不只看學了幾個工具"], ["身心靈一致", "了解目標，說明自己的判斷和疑慮，透過討論處理分歧，讓行動跟目標一致", "從清楚表達、完成確認好的決定，到幫助團隊釐清不同意見並一起行動", "遇到哪些分歧、如何討論取捨、後來怎麼做；不把順從或沒有異議當成高分"]], "promotion": [["晉升方向", "責任要有什麼改變", "需要哪些工作紀錄", "只有這些還不足以判斷晉升"], ["Jr. → Md.", "從完成任務，到獨立解決範圍明確的產品問題", "從釐清需求、比較方案，到跟同事完成實作、驗證和改善的完整案例，並說明哪些地方有別人協助", "畫面做得多、速度快，或一次高品質交付"], ["Md. → Sr.", "從解決已定義的問題，到主導產品或領域的機會與成果", "主動定義問題和 MVP、提出優先順序、協調資源並跟進改善，也能指導同事提升判斷", "被交辦大型案、會寫程式，或一次指標上升"], ["Sr. → Principal", "從領域成果，到跨產品的持續影響", "處理多團隊共同問題與重要取捨，實際採用並維護；後續團隊也能自行運作的紀錄", "擔任主管、向高層簡報，或寫好但沒人使用的共用文件"]], "responsibilities": [["要決定的事", "設計負責或提供什麼", "PM 負責或提供什麼", "工程負責或提供什麼", "如何做最後決定"], ["問題定義", "使用情境、體驗問題的證據，以及問題與機會判斷", "業務目標、產品背景和需求整理", "現有技術、限制和可行性", "一起釐清，再由負責這項決策的人確認"], ["優先順序", "體驗影響、風險和需要投入的設計工作", "整合業務價值、配合事項和資源", "工程成本和技術風險", "由獲得授權的產品負責人確認；需要更多資源時，找能決定的主管協調"], ["成功指標", "任務完成和體驗的判斷方式，參與結果分析", "產品成效和業務指標", "資料是否量得到，必要時找數據同事合作", "上線前一起確認指標怎麼算、由誰負責"], ["MVP 範圍", "保留能驗證價值的必要體驗，提出可以延後的項目", "整合目標、時程和範圍", "最小可行的實作方式和品質要求", "一起提出建議，再由負責這項決策的人確認"], ["原型與程式", "負責互動、驗證目的和設計品質，依能力與專案分工參與實作", "確認驗證對象、資源和後續用途", "負責正式程式的整合、測試和上線要求", "原型與正式產品各自確認驗收條件"], ["上線與後續改善", "體驗驗收、觀察使用結果並提出改善", "協調上線和成效討論", "技術驗收、發布和維運", "依專案確認的上線分工執行"]], "complexity": [["觀察面向", "明確任務", "完整產品問題", "領域或跨產品問題"], ["還有多少未知", "目標和範圍明確", "需要釐清問題、比較方案和驗證", "需要選出值得做的機會，協調不同團隊的方向"], ["哪些事情互相影響", "局部流程和狀態", "多個頁面、角色，或從開始到完成的流程", "多個功能、產品、團隊和舊版限制"], ["要做哪些決定", "在確認好的方向內選擇設計做法", "考慮使用者、業務和技術，做出合理取捨", "協調  $('#map').innerHTML=`<div class="panel summary">${[1,3,5].map(i=>`<div><label>${esc(roles[i][0])}</label>${esc(roles[i][level+1])}</div>`).join('')}</div>
 <div class="notice"><b>先看這個職階要做到什麼，再對照工作表現</b><br>1 能力發展中：重要責任尚未穩定做到，需要具體協助。2 符合期待：能穩定完成本階責任。3 超出期待：穩定達標之外，帶來可確認、能延續的改善。正常合作與請教，不會因此被評低分。<br>C4 先看證據，依問題與資源選用質化或量化方法；C5 則要同時看溝通與交付。缺少機會或資料、無法判斷時，先標未觀察並安排補足。</div>
 <div class="toolbar"><div><h2>共同職能 · ${titles[level]}</h2><span class="label">${N} 項職能 · 三段試評 · 2 代表符合期待</span></div><input id="search" aria-label="搜尋職能" placeholder="搜尋職能或關鍵字" value="${esc(query)}"></div>
 <div class="cards" id="cards"></div>`;
 $('#search').oninput=e=>{query=e.target.value;cardsUI()};cardsUI();
}
function facetsUI(item,compact=false){
 if(!item.facets.length||(!compact&&item.show_facets_in_map===false))return '';
 const guide=item.levels[level];
 const methodOptions=item.facet_mode==='method_options';
 const heading=methodOptions?'依問題選用資料或研究方法':'評分時，兩個面向都要看';
 return `<div class="facet-guide"><b>${heading}</b>${methodOptions?'<p>質化或量化可擇一或搭配，既有資料足夠時可直接使用。</p>':''}${item.facets.map((f,i)=>`<div><strong>${esc(f.name)}</strong><p>${esc(guide.observations[i])}</p></div>`).join('')}</div>`;
}
function cardsUI(){
 const q=query.trim().toLowerCase();
 const rows=ITEMS.filter(i=>/^c\d+$/.test(q)?i.id.toLowerCase()===q:(i.id+i.name+i.definition+i.levels[level].scores.join('')+i.levels[level].actions.join('')+i.facets.map(f=>f.name).join('')).toLowerCase().includes(q));
 $('#cards').innerHTML=rows.length?rows.map(item=>{
  const guide=item.levels[level];
  return `<article class="card"><h3 class="card-title"><span>${esc(item.id)}／${esc(item.name)}</span>${item.discussion_tag?`<span class="badge discussion-tag">${esc(item.discussion_tag)}</span>`:''}</h3>
  <div class="definition"><b>這項職能在看什麼？</b><p>${esc(item.definition)}</p></div>
  ${facetsUI(item)}
  <div class="action-guide"><b>這一階，我可以怎麼做？</b><ol>${guide.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ol><small>可以從這些做法開始；評分時仍要看實際表現和工作紀錄。</small></div>
  <details class="example"><summary>看一個工作例子</summary><p>${esc(guide.example)}</p><small>這是用來解釋做法的假設情境，實際分數仍要對照整段期間的表現。</small></details>
  <h4 class="rubric-heading">${titles[level]} · 三段評等標準</h4>
  <p class="role-responsibility"><b>這一階負責什麼：</b>${esc(guide.responsibility)}</p>
  <div class="rubric">${guide.scores.map((v,i)=>`<div class="rubric-row ${i===BASELINE_INDEX?'baseline':''}"><b>${i+1} · ${scoreNames[i]}</b><div>${esc(v)}</div></div>`).join('')}</div>
  <details><summary>評分時可能會想問</summary>${item.clarifications.map(c=>`<p><b>${esc(c.question)}</b></p><p>${esc(c.answer)}</p>`).join('')}</details>
  </article>`;
 }).join(''):'<div class="empty">沒有符合的職能，試試其他關鍵字。</div>';
}
function comparisonUI(){
 const item=ITEMS.find(i=>i.id===comparisonId);
 const shownScores=comparisonMode==='all'?scoreNames.map((_,i)=>i):[BASELINE_INDEX];
 const row=(label,cells,className='')=>`<tr class="${className}"><th scope="row">${label}</th>${cells.map(cell=>`<td>${cell}</td>`).join('')}</tr>`;
 const scope=row('這一階<br>負責什麼',item.levels.map(l=>esc(l.responsibility)),'comparison-scope');
 const rubrics=shownScores.map(i=>row(`${i+1}<small>${esc(scoreNames[i])}</small>`,item.levels.map(l=>esc(l.scores[i])),i===BASELINE_INDEX?'comparison-baseline':'')).join('');
 const examples=comparisonExamples?row('我可以怎麼做',item.levels.map(l=>`<ol>${l.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ol>`))+row('工作例子',item.levels.map(l=>esc(l.example))):'';
 $('#compare').innerHTML=`<div class="comparison-intro"><h2>同一項職能，四個職等怎麼不同？</h2><p>橫向看職等責任，縱向看三段評等。2 符合期待是各職等的達標標準。</p></div>
 <div class="comparison-controls">
  <label class="comparison-select" for="compare-item">選擇職能<select id="compare-item">${ITEMS.map(i=>`<option value="${i.id}"${i.id===comparisonId?' selected':''}>${esc(i.id)}／${esc(i.name)}</option>`).join('')}</select></label>
  <div class="comparison-modes" role="group" aria-label="比較哪些評等"><button type="button" data-comparison-mode="baseline" aria-pressed="${comparisonMode==='baseline'}" class="${comparisonMode==='baseline'?'active':''}">2／符合期待</button><button type="button" data-comparison-mode="all" aria-pressed="${comparisonMode==='all'}" class="${comparisonMode==='all'?'active':''}">完整三段評等</button></div>
  <label class="comparison-toggle"><input id="compare-examples" type="checkbox"${comparisonExamples?' checked':''}>一起看做法與案例</label>
 </div>
 <div class="definition comparison-definition"><h3 class="card-title"><span>${esc(item.id)}／${esc(item.name)}</span>${item.discussion_tag?`<span class="badge discussion-tag">${esc(item.discussion_tag)}</span>`:''}</h3><p>${esc(item.definition)}</p></div>
 <p class="comparison-hint">評等只對照目前職等的責任；跨職等不能直接換算，超出期待也不代表自動晉升。${comparisonExamples?'工作例子都是假設情境。':''}<span>表格可上下、左右捲動。</span></p>
 <div class="comparison-scroll" tabindex="0" role="region" aria-label="${esc(item.id)} 四個職等比較表，可捲動">
  <table class="comparison-table"><caption class="visually-hidden">${esc(item.id)}／${esc(item.name)}：${comparisonMode==='all'?'完整三段評等':'2 符合期待'}，四個職等比較</caption><colgroup><col class="comparison-label">${titles.map(()=>'<col>').join('')}</colgroup><thead><tr><th scope="col">比較項目</th>${titles.map((title,i)=>`<th scope="col"><small>職能 ${i+1}</small>${esc(title)}</th>`).join('')}</tr></thead><tbody>${scope}${rubrics}${examples}</tbody></table>
 </div>`;
 $('#compare-item').onchange=e=>{comparisonId=e.target.value;comparisonUI();syncRoute();$('#compare-item').focus()};
 document.querySelectorAll('[data-comparison-mode]').forEach(b=>b.onclick=()=>{comparisonMode=b.dataset.comparisonMode;comparisonUI();$(`[data-comparison-mode="${comparisonMode}"]`).focus()});
 $('#compare-examples').onchange=e=>{comparisonExamples=e.target.checked;comparisonUI();$('#compare-examples').focus()};
}
function reviewUI(){
 $('#review').innerHTML=`<div class="panel"><h2>先看目前表現，再看下一階需要什麼。</h2><p>先試評 ${titles[level]} 的 ${N} 項職能，看看哪些已穩定做到、哪些需要練習。四個職階分開暫存，重新整理後會清除。</p>
 <div class="notice"><b>C4、C5 怎麼評？</b><br>C4：先看既有證據是否足夠；需要補充了解或驗證、時間資源也允許時，再安排質化或量化研究。<br>C5：溝通與交付都符合本職階要求，才能評為 2 符合期待或 3 超出期待。<br>缺少合理機會、仍不足以判斷整項時，先標未觀察並安排補足。</div>
 <div class="calc"><div>${ITEMS.map((item,i)=>`<div class="score-block"><div class="score"><label for="s${i}">${item.id} ${esc(item.name)}</label><select id="s${i}" data-score="${i}"><option value="">未觀察</option>${scoreNames.map((name,j)=>`<option ${scores[level][i]==j+1?'selected':''} value="${j+1}">${j+1} · ${esc(name)}</option>`).join('')}</select></div>${facetsUI(item,true)}</div>`).join('')}</div><div class="result" id="result" aria-live="polite"></div></div>
 <p class="label">這版先看各項評等分布。請用實際案例重新對照三段標準，舊五分的分數不能直接換算。</p></div>
 <details><summary>評分前，要一起確認什麼？</summary>${commonRules()}</details>
 <details><summary>三段評等的共同定義</summary>${table(DATA.context.scale)}</details>
 <div class="panel"><h2>要晉升，需要累積哪些成果？</h2>${table(DATA.context.promotion)}<div class="notice">晉升另外看下一階責任的實際表現。正式考核如何彙整、評估期間，以及未觀察項目怎麼處理，還需要主管確認。</div></div>`;
 document.querySelectorAll('[data-score]').forEach(s=>s.onchange=()=>{scores[level][+s.dataset.score]=['1','2','3'].includes(s.value)?s.value:'';resultUI()});resultUI();
}
function resultUI(){
 const groups=scoreNames.map((_,j)=>ITEMS.filter((item,i)=>String(scores[level][i])===String(j+1)));
 const observed=groups.reduce((n,g)=>n+g.length,0);
 const missing=ITEMS.filter((item,i)=>!['1','2','3'].includes(String(scores[level][i])));
 $('#result').innerHTML=`<span>${observed===0?'尚未開始':observed<N?'部分完成':'已完成試評'}</span><strong>${observed} / ${N}</strong><p>已評職能</p><div class="rating-distribution">${groups.map((g,j)=>`<div data-rating-count="${j+1}"><b>${j+1} · ${esc(scoreNames[j])}</b><span>${g.length} 項</span><small>${g.length?g.map(i=>esc(i.id)).join('、'):'—'}</small></div>`).join('')}<div data-rating-count="unobserved"><b>未觀察</b><span>${missing.length} 項</span><small>${missing.length?missing.map(i=>esc(i.id)).join('、'):'—'}</small></div></div><p>先逐項確認需要的協助與後續行動；這裡不以總分或百分比判定整體表現，也不自動判斷晉升。</p>`;
}
function rulesUI(){
 $('#rules').innerHTML=`<div class="panel"><h2>公司價值觀 · Company Values</h2><p>沿用公司的 Inconsistent（不一致）、Successful（成功）、Exceptional（卓越），跟專業能力分開評估。</p>${table(DATA.context.values)}<div class="notice">要看整段期間的表現。Successful 需要絕大多數時間都符合；Exceptional 則要在這個基礎上，經常帶來額外的正面影響。依公司規則，只要任一情境被判為 Inconsistent，該價值觀就判為 Inconsistent；有 NoShow（沒有觀察到相關行為）的情境，通常不應給 Exceptional。資料不足時先記下待補內容。</div></div>
 <details open><summary>Sr.、PM 和工程，分別負責什麼？</summary><p>以下是分工建議。專案開始時，要確認實際由誰負責、誰做最後決定，以及卡住時找誰協調。</p>${table(DATA.context.responsibilities)}</details>
 <details><summary>任務大小怎麼看？</summary>${table(DATA.context.complexity)}<p>看問題的複雜度和負責範圍，工時用來排程。AI 讓製作變快，不代表問題就變簡單。正式人員管理會另外訂管理職標準。</p></details>
 <details><summary>還需要一起確認的事</summary><ul>${DATA.pending_decisions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>`;
}
function changesUI(){
 $('#changes').innerHTML=`<div class="panel"><span class="badge">三段試評版</span><h2>每個職等，先看發展中、符合期待與超出期待。</h2><p>保留 ${N} 項職能、四階責任與做法，共 ${N*4*RATING_COUNT} 條評等描述。符合期待延續原本的達標要求；能力發展中與超出期待重新整理，讓各段差異更清楚。舊分數需要用實際案例重新評估。</p><p>試評先呈現各項分布與未觀察項目，總分、百分比與整體分級不套用在這版。</p></div>
 <div class="panel"><span class="badge">歷史調整：10 項 → ${N} 項</span><h2>把重複的項目放在一起，說清楚各自看什麼。</h2><p>研究與驗證、協作與交付各整合成一項。對照表左欄保留舊版名稱，方便查找。</p>${table(DATA.mapping_v4)}</div>
 <div class="panel"><h2>C4 看證據與研究判斷，C5 看兩個責任面向。</h2><p>C4 先看既有證據能否支持設計判斷；需要更了解使用者或驗證設計、時間與資源也允許時，應安排質化或量化研究，可擇一或搭配。C5 的溝通與決策討論、工作安排與設計交付，則仍是兩個都需要完成的責任面向。</p><div class="notice">例如既有客服紀錄或行為資料已足以支持這次的設計判斷，就可以依實際表現評 C4。沒有新研究本身不扣分；只有計畫或推測，仍不能當成已完成驗證。缺少資源時，記下限制、已有成果和後續安排；只有無法判斷整項時才標未觀察。</div>
 <p>符合期待與超出期待都依各職階的具體責任判斷，兩項各給一個評等。</p></div>
 <div class="panel"><h2>原本的 v3 職能地圖，對應到哪裡？</h2>${table(DATA.mapping_v3)}</div>`;
}
function researchUI(){
 $('#research').innerHTML=`<div class="panel"><h2>三段評等的參考與選擇</h2><span class="label">查閱日期：${esc(DATA.rating_basis.date)}</span><p>${esc(DATA.rating_basis.summary)}</p>${table([['資料','可確認的做法與限制'],...DATA.rating_basis.sources.map(r=>[r.name,r.finding])])}<p>${DATA.rating_basis.sources.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)} ↗</a>`).join(' · ')}</p></div>
 <div class="panel"><h2>2026 大廠公開資料</h2><p>以下能力方向的查閱日期：2026-09-10。分別標明職階責任、官方職缺和設計案例，也說明可以確認的日期。</p><div class="notice">這次沒有取得各大廠完整的 2026 版內部考核表。以下資料可以參考能力方向，這份 ${N*4*RATING_COUNT} 條評等描述則是為 CMoney 撰寫的討論稿。</div></div>${DATA.research.map(r=>`<article class="panel"><span class="badge">${esc(r.kind)}</span><h2>${esc(r.company)}</h2><span class="label">${esc(r.date)}</span><p>${esc(r.finding)}</p><div class="notice"><b>這份職能地圖可以參考什麼？</b><br>${esc(r.implication)}</div><p><b>這份資料的限制：</b>${esc(r.limit)}</p><a href="${esc(r.url)}" target="_blank" rel="noopener">查看官方來源 ↗</a>${r.extra?` · <a href="${esc(r.extra)}" target="_blank" rel="noopener">查看補充職缺 ↗</a>`:''}</article>`).join('')}
 <div class="panel"><h3>較早的參考資料</h3><p>Intercom 的職階文章發布於 2021 年，因此沒有列為 2026 年更新的依據。參考 AI 相關要求時，也會一起保留設計基本功。</p></div>`;
}
function discussionUI(){
 $('#discussion').innerHTML=`<div class="panel"><span class="badge">版本與討論紀錄</span><h2>這份草稿怎麼整理出來的？</h2><p>先前由 UIUX 主管、Md.、Sr.、Principal 四個 AI 角色，針對當時的十項職能提問、討論並確認修改。歷史紀錄保留原編號、名稱和當時的意見。</p><p>之後依 Monica 確認的方向整理成八項，重寫相關評分、做法與觀察重點，再逐條調整成較自然的台灣職場用語。先前的角色沒有重新審閱這版文字。</p><div class="notice"><b>保留的討論共識</b><br>正常找同事討論不算能力不足；推動工作與最後拍板分清楚；評分要看證據實際能說明什麼；高分需要具體改善與持續效果。事業單位只有一位設計師，或在 x-lab，也要由主管安排正常工作內的交流機會。</div>
 <p><a href="archive/v4_10_items/UIUX角色討論與修訂紀錄.md" target="_blank">閱讀原十項角色討論</a> · <a href="archive/v4_10_items/uiux-career-map.html" target="_blank">查看原十項網頁</a></p><p><a href="UIUX職能合併修訂紀錄.md" target="_blank">查看項目與計分調整</a> · <a href="用語調整紀錄.md" target="_blank">查看用語調整與 Threads 參考</a></p></div>
 <div class="panel"><h2>還需要確認的制度內容</h2><ul>${DATA.pending_decisions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
}
function render(){
 levelUI();mapUI();comparisonUI();reviewUI();rulesUI();changesUI();researchUI();discussionUI();
 $('#levels').classList.toggle('hidden',page==='compare');
 document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!==page));
 document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-pressed',b.dataset.page===page)});
}
function readRoute(){
 const hash=window.location.hash.slice(1),match=/^compare(?:-(C[1-8]))?$/.exec(hash);
 if(match){page='compare';comparisonId=match[1]||'C1'}
 else page=pages.includes(hash)?hash:'map';
}
function syncRoute(){window.history.replaceState(null,'',page==='compare'?`#compare-${comparisonId}`:`#${page}`)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;syncRoute();render()});
window.addEventListener('hashchange',()=>{readRoute();render()});
readRoute();
render();

</script>
