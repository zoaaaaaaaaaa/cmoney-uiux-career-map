<script>const DATA={"version": "v5", "date": "2026-09-11", "items": [{"id": "C1", "name": "問題釐清與設計取捨", "source_ids": ["C1"], "definition": "先了解使用者想完成什麼、產品希望改善什麼，以及業務和技術有哪些限制，再決定要解決的問題和設計方向。這項看的是：你能不能說清楚為什麼要做、先做什麼、有哪些選擇，以及為什麼選這個做法。隨著職階提高，負責的範圍會從明確的設計任務，擴大到多個產品的共同問題。", "evidence": "問題說明、方案比較、決策紀錄，以及哪些需求因此調整或停止。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依具體範例開始設計，釐清使用對象、任務目標與限制時，需要同事逐步引導，也需要一起整理設計理由。", "能說明使用對象和主要目標，並提出局部設計做法；辨識已知限制、比較局部選項和整理選擇理由時，還需要同事協助。", "在明確的目標和範圍內，能說明使用對象、任務和限制，自己決定細部設計並解釋理由。遇到不清楚、互相矛盾或較難取捨的地方，會主動找負責人確認。", "能找出原需求沒提到的衝突，提出有理由的替代做法，確認後修改設計，並說明因此少漏了什麼、少做了哪些不必要的工作。", "在不同任務中，多次找出原需求沒注意到的問題，提出可以驗證的做法，幫助團隊修正方向，並留下判斷的依據。"], "actions": ["先寫清楚誰會在什麼情況下使用，以及這次想改善什麼。", "列出已知限制和還不確定的地方，找相關負責人確認，再比較做法。", "記下選這個方案的理由，以及哪些問題要請資深設計師或 PM 決定。"], "example": "假設情境：調整收藏按鈕前，你先確認目標是讓使用者找回收藏，發現按鈕文字和入口位置都有影響，再跟 PM 確認這次可以改到哪裡。", "observations": []}, {"scores": ["能依明確需求做出設計草稿；把需求整理成產品問題、比較可行做法和說明取捨，主要需要同事帶著完成。", "能整理需求、找出主要問題並提出方案；確認關鍵假設、比較選項和決定處理範圍時，部分判斷仍需要同事協助。", "針對自己負責的產品問題，能獨立釐清使用情境、目標、限制和未知，比較可行方案並提出建議。超出原定範圍或自己的決定權時，會帶著建議找負責人確認。", "能找出原需求忽略的衝突或錯誤假設，用證據建議調整問題或範圍，避免不必要的設計或大幅重做，並交代最後怎麼選、還有哪些風險。", "在不同產品問題中，持續做出合理取捨，把模糊的需求整理成可以處理的範圍。能用實際案例說明省下的投入或帶來的改善，讓同事參考判斷方式。"], "actions": ["開始前先寫清楚使用者要做什麼、卡在哪裡，以及目標、限制和假設。", "比較可行選項，說明推薦哪個方案、哪些先不做，以及原因。", "記下決定和還沒解決的風險；要改範圍時，找負責範圍與資源決策的人確認。"], "example": "假設情境：PM 想新增篩選器，你從客服回饋和操作紀錄發現，主要問題是排序看不懂。比較後建議先改排序，獲得同意後記下省去的篩選流程，以及還要驗證的查找成功率。", "observations": []}, {"scores": ["能針對已指定的問題提出設計方案；找出領域內值得處理的機會、設定問題和決定先做什麼，需要同事帶著整理。", "能主動提出領域內的改善機會；比較證據、排出優先順序與決定最小驗證範圍時，部分重要判斷仍需要同事協助。", "能主動找出產品或領域的機會，說明問題、目標、證據和限制。比較後提出先後順序及最小驗證範圍，再跟有決定權的負責人確認選擇和下一步。", "資訊互相矛盾，或有好幾件事都想做時，能找出最需要先釐清的問題，提出替代選項並協助做出決定，避免不必要的投入或重大遺漏。", "在自己負責的同一領域中，持續於不同決策找出被忽略的機會或風險。能用後續結果說明取捨的效果，也讓相關工作更能判斷要解決什麼、做到哪裡。"], "actions": ["寫清楚使用者問題、產品目標、已有證據，以及還不知道的事。", "比較維持現況、小幅修改和完整方案，建議先做到哪裡、哪些先不做。", "找有決定權的負責人確認，記下沒選其他方案的原因、下一步和何時要重新討論。"], "example": "假設情境：原需求是重做訂閱頁，你查出主要問題是使用者看不懂權益，因此建議先測試權益說明。記下調整前後的範圍、理由、決定和測試結果；如果提案沒被採用，就如實記錄，不算成已完成的產品改善。", "observations": []}, {"scores": ["能從熟悉的產品提出改善方向；整合多個產品的目標、限制和影響，並找出共同問題，需要其他負責人帶著梳理。", "能指出跨產品的共同問題，整理各產品需求；比較共用、分開處理或分階段執行的代價時，仍需要其他負責人協助形成完整建議。", "能根據各產品的證據找出共同問題，比較共用、保留差異和分階段處理的做法，說明短期與長期代價，協助負責人做出決定並確認誰接著做。", "多個產品的目標衝突或資訊很不明確時，能補上關鍵證據、調整問題範圍，讓原本難以決定的事情有可執行方案，並追蹤實際結果。", "其他團隊在後續不同情況下，能參考並調整你的判斷方法，自行處理新的共同問題，並說明因此避免了哪些錯誤投入，或改善了什麼體驗。"], "actions": ["選一個共同問題，比較各產品的使用情況、證據和限制。", "列出共用、保留差異和暫緩處理的做法，以及各自的成本與影響。", "找負責這項決策的人確認，記下選擇理由和後續分工。"], "example": "假設情境：兩款產品想共用會員流程，比較後發現權限不同，因此決定只共用身分辨識、保留各自的授權步驟，並追蹤實作和使用者是否看得懂。", "observations": []}], "clarifications": []}, {"id": "C2", "name": "UI 品質與資訊呈現", "source_ids": ["C2"], "definition": "依使用者的閱讀順序與任務重點，建立清楚的資訊層級，透過字級、排版、間距、色彩與對比，讓重要內容容易辨識。畫面也要維持產品內的視覺一致性，符合品牌風格與識別，並在不同內容、狀態和適用裝置下保持好讀。這項同時看設計稿與實作是否一致；跨產品採用共同原則時，保留各自需要的品牌特色與使用差異。", "evidence": "資訊層級與版面安排的理由、產品與品牌風格對照、設計稿與實作比較，以及不同內容和裝置的檢查紀錄、使用回饋。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依範例製作基本畫面；安排資訊層級、字級、間距與色彩，以及套用產品和品牌風格時，需要逐步引導。", "能完成基本版面並使用現有視覺規則；檢查資訊主次、對齊、對比，以及不同內容下的風格一致性時，部分細節仍需要提醒。", "能在明確任務內安排資訊層級，做好排版、間距、對齊與對比，沿用產品的視覺規則和品牌風格。以任務需要的內容、尺寸與狀態自行檢查，修正細節並記下實作差異。", "遇到長內容、資訊擁擠或既有版型限制時，能找出難讀的原因，調整資訊層級或呈現方式，同時維持產品與品牌的一致性，並用前後檢查或使用回饋確認改善。", "在不同的明確任務中，能多次改善標題不突出、資訊擠在一起或容易漏看的細節，讓畫面保有清楚的資訊層級與產品、品牌風格。能用前後畫面、實作檢查或使用回饋，說明哪些資訊更容易辨識、哪些同類問題已減少。"], "actions": ["依明確任務確認使用者先看什麼、再看什麼，沿用產品與品牌規則安排字級、間距、色彩和版面。", "用任務會出現的長短內容、狀態和裝置尺寸，檢查標題是否突出、資訊是否擠在一起或容易漏看。", "比對設計稿與實作，修正自己負責的細節；留下前後畫面與檢查結果，說明哪些地方更清楚。"], "example": "假設情境：文章卡片換成長標題後，標題與摘要擠在一起，日期也容易被漏看。你在既有版型內調整字級、間距和資訊分組，再用長短標題與沒有圖片的情況檢查設計及實作，確認資訊主次清楚，產品和品牌風格一致。", "observations": []}, {"scores": ["能依現有版型完成主要畫面；建立資訊層級、維持產品與品牌一致性，以及檢查不同內容的呈現時，需要同事帶著判斷和調整。", "能獨立完成主要畫面的資訊層級與基本風格；遇到長短內容、不同尺寸或狀態時，部分閱讀、視覺一致性與實作細節仍需要同事協助確認。", "能獨立建立清楚的資訊層級，完成好讀、符合產品一致性與品牌風格的畫面，涵蓋任務需要的內容、尺寸和狀態。能自行檢查層級、字級、間距、對比與風格，追蹤實作差異並說明修正或取捨。", "遇到高資訊量、特殊內容，或品牌與既有視覺規則互相衝突時，能比較做法，在可讀性、產品一致性與品牌特色間做出合理取捨，並用使用觀察或前後驗收確認改善。", "能重新整理資訊擁擠、重點不清或難以比較的畫面，讓同一任務的相關畫面維持一致的資訊層級與品牌風格。這類改善能在不同任務中持續做到，且有使用觀察或回饋顯示：使用者更容易找到重點、看懂差異，同類的誤讀或漏看問題也減少。"], "actions": ["根據任務重點安排資訊層級，再檢查畫面是否符合產品一致性與品牌風格。", "挑出任務涉及的長短內容、空值、尺寸和狀態，確認層級、對比與風格都能維持。", "比對實作，記下資訊與視覺呈現的差異、造成的影響，以及如何修正或取捨。"], "example": "假設情境：投資列表同時出現長公司名與大數值時不易閱讀。你重新安排資訊層級，保留產品的色彩、字體與品牌風格，並檢查不同內容及實作，留下前後對照和使用觀察。", "observations": []}, {"scores": ["能處理熟悉畫面的視覺調整；面對領域內複雜資訊、舊版限制與品牌規則時，需要同事帶著建立層級和檢查實作。", "能整理領域內主要資訊與呈現方向；處理複雜內容、既有畫面不一致或品牌與閱讀需求的取捨時，部分判斷仍需要同事協助。", "能獨立處理領域內的複雜資訊與舊版設計限制，建立清楚的資訊層級，維持產品內的視覺一致性與品牌風格。能針對需要的內容、狀態和裝置檢查設計及實作，說明重要呈現取捨。", "領域內的新舊畫面、資訊量與品牌規則互相衝突時，能找出跨畫面反覆出現的閱讀問題，決定哪些資訊層級與視覺做法需要調整。跟進相關功能的實作，並用檢查或使用回饋確認難找、難比較或容易看錯的情況改善。", "能持續改善同一產品或領域內多個功能的資訊呈現，讓使用者在切換畫面時，仍容易找到重點、辨識差異，產品與品牌風格也保持一致。後續功能能延續適合的呈現方式，並有實作檢查或使用回饋，說明原本跨畫面的閱讀問題持續減少。"], "actions": ["整理同一產品或領域中多個功能的資訊呈現，找出反覆出現的難找、難讀、難比較或風格不一致問題。", "比較使用者閱讀需求、既有設計限制與品牌規則，決定相關畫面要怎麼調整，並說明取捨。", "追蹤相關功能的實作與後續使用，確認同類閱讀問題是否減少，新功能也能維持適合的資訊層級與風格。"], "example": "假設情境：同一款看盤 App 的自選股清單、個股頁和價格提醒，對漲跌金額、漲跌幅的呈現不一致：有的只靠紅綠色，有的沒標單位，容易看錯。你把三處都改成「股價 → 漲跌金額 → 漲跌幅」的閱讀順序，補上正負號與單位，統一字級、間距及色彩用法，維持產品的品牌風格。再檢查長股名和大數值的實作，請使用者指出目前價格與漲跌，確認能分辨；後續新版也用相同方式驗收。", "observations": []}, {"scores": ["能提出熟悉產品的視覺方向；建立多個產品共用的資訊層級與品質原則，並保留各自品牌特色時，需要其他設計師帶著整理。", "能辨識多個產品的共同呈現問題，提出視覺原則或範例；把原則轉成各產品可實作的做法、釐清一致與差異時，仍需要合作團隊協助補齊。", "能針對跨產品的共同呈現問題，提出清楚的資訊層級與視覺品質原則，搭配可實作的範例；說明各產品需要一致的地方與各自品牌特色，並確認實作和使用者理解。", "多個產品的品牌、資訊量、裝置或舊版限制互相衝突時，能找出共同的閱讀問題，提出各產品做得到的調整方式並推動實作。用實作檢查或使用回饋確認資訊更容易辨識，同時保留各產品必要的品牌特色。", "多個團隊在後續新功能或版本中，能自行運用並調整你建立的資訊層級與視覺品質原則，處理各自的內容與品牌差異。從不同產品的實作與使用回饋，可以確認共同的難找、難讀或容易混淆的問題持續減少，各產品內也維持一致。"], "actions": ["比較多個產品的資訊層級與視覺呈現，找出共同閱讀問題，以及各自需要保留的品牌差異。", "用可實作的原則與範例，跟各團隊確認如何調整，再檢查實際畫面是否做到。", "查看後續版本是否能自行延續、調整這些做法，並用實作與使用回饋確認跨產品的共同問題持續改善。"], "example": "假設情境：兩款產品都讓使用者看不懂訂閱狀態，但品牌和版面不同。你提出共同的資訊優先順序與清楚的範例，各團隊保留自己的品牌特色並完成調整。後續新增權益時，團隊能自行延用或調整，並提供實作和使用回饋確認狀態仍容易辨識。", "observations": []}], "clarifications": [{"question": "這裡的 UI 品質具體看哪些地方？", "answer": "主要看資訊層級是否清楚、內容是否好讀、產品內的視覺是否一致、是否符合品牌風格，以及實作是否呈現這些設計。字級、間距、對齊、色彩和對比都是可以直接檢查的細節，不只用「看起來漂亮」判斷。"}, {"question": "產品沒有完整的視覺或品牌規範，怎麼做？", "answer": "可以先從現有畫面、品牌素材與使用情境整理需要一致的部分，再跟設計負責人確認。評分看你在這個職階如何運用、釐清或改善規則，不以公司是否已提供完整文件來判斷。"}, {"question": "各職等的 3、4、5 分，怎麼區分？", "answer": "先看目前職等負責的範圍：Jr. 是明確任務的畫面；Md. 是一個產品問題涉及的相關畫面；Sr. 是同一產品或領域的多個功能；Principal 是多個產品的共同呈現問題。3 分是能在這個範圍內做好資訊層級、產品與品牌一致性並檢查實作；4 分是解決限制或衝突造成的閱讀問題並確認改善；5 分是這類改善在後續任務或版本中持續發生。Principal 還要看到各團隊能自行運用與調整。只整理文件或例子，不足以單獨判斷為 5 分。"}]}, {"id": "C3", "name": "流程與互動設計", "source_ids": ["C3"], "definition": "從使用者實際要完成的任務出發，把整段流程想周全，讓每個會操作的地方都順暢，前後步驟能自然銜接。依任務會遇到的情境，考慮輸入、選擇、切換、返回、等待、修改與中斷後繼續等操作，提供清楚、及時的回饋，減少多餘步驟和重複輸入。遇到錯誤或特殊狀況時，使用者也知道發生什麼、如何修正並繼續完成任務；有 AI 功能時，同樣要考慮等待、結果修改、重試與替代操作。", "evidence": "完整任務流程、互動原型與狀態說明、實際操作檢查、使用者回饋或測試紀錄，以及修改前後如何減少卡關、重複輸入或操作錯誤。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依明確步驟畫出主要操作；檢查按鈕、輸入、返回和操作回饋，以及補齊等待或失敗時的處理，需要同事逐步引導。", "能完成主要操作和常見狀態；檢查前後步驟是否順暢、回饋是否清楚，以及返回修改或失敗後能否繼續時，部分細節仍需要提醒。", "依確認好的範圍設計主要流程，讓按鈕、輸入、返回與需要的狀態都有清楚回饋。能自己從頭操作到完成，檢查步驟是否順暢、失敗後能否繼續；遇到較複雜的例外或其他流程的配合需求，會提出並確認。", "在明確任務內，能找出不易注意到的重複操作、回饋不清或返回後無法繼續等問題，提出可行調整。實際操作檢查後，能說明使用者如何更順利完成，必要的錯誤處理也保留。", "在不同明確任務中，能多次改善按鈕回饋、輸入、返回或重試等細部互動，讓使用者少遇到重複操作、誤觸或卡住的情況。能用前後操作檢查、測試或使用回饋，說明修改後如何更順利完成任務。"], "actions": ["依明確任務畫出從入口到完成的步驟，標出按鈕、輸入、返回，以及每次操作後要出現的回饋。", "檢查這次需要的等待、空白、錯誤和重試情境，讓使用者知道目前狀態，也知道怎麼接著做。", "自己從頭操作到完成，修正重複操作或回饋不清的細節；較複雜的例外找相關同事一起確認。"], "example": "假設情境：使用者按下收藏後沒有回饋，常連按好幾次；未登入時還會跳走。你在確認好的範圍內補上處理中與成功回饋，讓登入後能接著收藏，失敗時也能重試，再自己走完這些步驟確認操作順暢。", "observations": []}, {"scores": ["能依既定方向設計主要流程；把整段任務的操作、回饋與前後銜接想完整，並處理角色差異或例外情境時，需要同事帶著完成。", "能獨立安排主要路徑與常見互動；遇到角色差異、返回修改、失敗重試或前後流程互相影響時，部分銜接與操作細節仍需要同事協助補齊。", "能針對自己負責的產品問題，獨立設計從開始到完成的流程，讓每一步的操作、回饋與前後銜接清楚順暢。會考慮任務需要的角色差異、返回修改、失敗重試與中斷後繼續，並跟工程確認做法可行。", "遇到多條路徑、不同角色或既有限制時，能找出讓使用者卡住、重複操作或來回跳轉的原因，簡化步驟與互動。修改後會檢查主要流程和必要例外，確認原本的問題改善，也沒有讓其他操作變困難。", "能在不同設計任務中，反覆改善使用者會卡住、重複輸入或不知道下一步的操作。修改後，主要流程更順暢，返回修改、失敗重試或中斷後繼續等必要情境也能接著完成；並有實際操作觀察或使用紀錄，說明這些問題在後續使用中持續減少。"], "actions": ["從使用者要完成的任務畫出整段流程，檢查每一步要看什麼、做什麼，接下來會發生什麼。", "逐一檢查輸入、切換、返回、修改和等待時的互動，補上任務需要的失敗重試與中斷後繼續方式。", "實際操作原型或產品，找出多餘步驟、重複輸入和回饋不清的地方，修改後再檢查整段流程。"], "example": "假設情境：使用者在訂閱頁改付款方式時，要重新填資料，付款失敗後也找不到下一步。你保留已填內容，讓使用者能返回修改、看到處理狀態並重試，再檢查取消與成功後的流程。透過實際操作觀察，確認使用者能順利完成，並記下還會卡住的地方。", "observations": []}, {"scores": ["能處理領域內個別功能的操作流程；整理功能切換、狀態回饋、舊版限制，以及失敗後如何接著完成時，需要同事帶著釐清。", "能整理領域內主要流程的關係並提出互動改善；處理跨功能切換、複雜例外或修改後的連帶影響時，部分判斷與檢查仍需要同事協助。", "能獨立整理領域內多個功能的操作流程，讓使用者在功能切換與前後步驟間順暢完成任務。能處理舊版限制、狀態變化與失敗後的操作，並透過檢查或測試確認：改善其中一段時，其他相關流程也能正常使用。", "領域內多個功能、角色或舊版限制互相影響時，能找出重複輸入、來回跳轉、等待回饋不清或操作卡關的原因。協調相關功能一起調整，保留必要控制與失敗處理，並確認整段任務更順暢。", "能在同一產品或領域的後續功能與版本中，持續改善跨功能的操作銜接，減少重複輸入、反覆切換或不知道下一步的問題。返回修改、失敗重試和中斷後繼續等必要情境也保持順暢，並有操作觀察或使用紀錄說明改善持續。"], "actions": ["走過領域內跨功能的完整任務，找出功能切換、資料帶入和狀態回饋之間容易卡住的地方。", "跟相關同事與工程確認限制，協調功能一起修改；AI 功能也要考慮等待、結果修改、重試與替代操作。", "檢查修改後的主要流程和必要例外，再追蹤後續版本，確認改善一個功能時，其他相關操作仍然順暢。"], "example": "假設情境：同一產品從訂閱到付款、再回到內容頁時，常出現重填資料和權益狀態未更新。你整理各功能的資料帶入與狀態回饋，協調修改返回、等待和重試的互動。上線後再觀察整段任務，確認不用在功能間反覆跳轉，也追蹤新版本是否維持順暢。", "observations": []}, {"scores": ["能提出單一產品的互動改善；整理跨產品接續或多個產品共同的操作問題，以及各自需要的回饋與例外處理時，需要合作團隊帶著完成。", "能找出跨產品接續或重複發生的互動問題，提出初步做法；釐清產品差異、過渡期間的操作，以及各種必要情境如何順暢完成時，仍需要合作團隊協助。", "能釐清跨產品流程，或多個產品共同的互動問題，讓相關操作前後銜接順暢，必要的狀態、返回與失敗處理都有考慮。說清楚哪些做法需要一致、哪些保留產品差異，並跟合作團隊完成驗證與實作。", "多個產品的版本、技術或使用情境互相限制時，能提出分階段的調整，推動各團隊改善共同的操作問題。能確認過渡期間與完成後的切換、修改、等待或重試等必要互動都順暢，不讓使用者因版本差異走不下去。", "多個團隊在後續新功能或版本中，能自行運用並調整共同的互動做法，保留各產品需要的差異。從各產品的操作觀察或使用紀錄，可以確認重複輸入、回饋不清或失敗後卡住等共同問題持續減少，必要的前後銜接也保持順暢。"], "actions": ["比較多個產品的完整任務，找出共同卡關或跨產品接續問題，分清需要一致與保留差異的操作。", "跟各團隊確認共同互動做法與分階段修改方式，檢查過渡期和完成後的操作、回饋與失敗處理。", "查看各團隊後續能否自行運用和調整，再用各產品的操作觀察或使用紀錄確認共同問題是否持續減少。"], "example": "假設情境：兩款沒有串接的產品，都讓付款失敗的使用者重填資料。你與兩個團隊整理保留輸入、清楚回饋和重試的共同做法，各產品依自己的付款流程實作。後續新增付款方式時，團隊能自行調整，並用操作觀察確認同類卡關持續減少。", "observations": []}], "clarifications": [{"question": "每個案子都要跨平台或有很多角色嗎？", "answer": "依實際任務判斷。狀態互相影響、舊版限制和失敗處理，都可能讓問題變複雜。跨產品也可以處理重複的互動問題；有 AI 功能時，結果怎麼修改、無法使用時怎麼繼續，都屬於基本要求。"}, {"question": "怎麼看出流程真的變順，而不只是少了幾個步驟？", "answer": "要看使用者是否更容易完成任務，例如不必重複填資料、返回修改後能接著做、操作後知道系統有沒有收到，或失敗後知道怎麼重試。有些確認步驟是必要的，不能只比點擊次數。Jr. 看明確任務的細部互動，Md. 看一個產品問題的完整流程，Sr. 看同一領域多個功能的銜接，Principal 看多產品的共同問題與後續採用。5 分要在各自範圍內看到持續改善，可以用操作檢查、使用觀察或既有紀錄，不限定大樣本數據。"}]}, {"id": "C4", "name": "質化或量化研究", "source_ids": ["C4", "C5"], "definition": "用有根據的資訊了解使用者，並說明設計判斷的依據。先查看既有的使用者回饋、客服紀錄、行為數據或研究結果，分清已知事實與待驗證的假設。當現有資料不足以回答問題、需要更了解使用者或確認設計是否有效，而且時間與資源允許時，應安排適合的質化或量化研究。這項看的是能否判斷證據是否適用、合理解讀並用在設計上；資料不足時，要說明限制，跟團隊確認下一步與驗證時機。", "evidence": "支持設計判斷的實際資料與工作紀錄，例如既有使用者回饋、客服紀錄、行為數據、報表或研究結果；需要時也可以提供新做的訪談、操作觀察、問卷或測試。說明來源、適用範圍、發現如何影響設計，以及哪些仍待驗證。不要求每案新增研究或提供所有種類的資料。", "facets": [{"name": "質化研究", "question": "透過訪談、操作觀察或開放式回饋，了解使用情境、想法與操作困難。"}, {"name": "量化研究", "question": "透過行為資料、結構式問卷、任務成功率或適合的實驗，了解問題規模與變化。"}], "scoring_note": "看證據如何支持設計判斷與改善，不按研究次數或方法種類評分；質化或量化可擇一或搭配。", "clarifications": [{"question": "一定要自己做一次新研究，才能評這項嗎？", "answer": "不用。既有使用者回饋、客服紀錄、數據或研究結果，只要來源可信、適用於目前問題，也能作為依據。評分看你如何判讀、用在設計上，以及辨識還有哪些未知。需要進一步了解或驗證、時間與資源也允許時，應安排適合的研究；沒有新研究本身不扣分，但也不能把尚未驗證的假設寫成已知結果。"}, {"question": "只有做質化，或只有用量化資料，也可以達標嗎？", "answer": "可以。評的是你能不能依問題選方法、合理解讀結果並用在設計上。質化或量化擇一適合就能提供證據，也可以搭配；不要求每個案子或整段評估期間都湊齊兩種方法，做的種類多也不會自動加分。"}, {"question": "沒時間訪談，或需要的數據查不出來，怎麼辦？", "answer": "先說明缺什麼、會影響哪些判斷，再跟 PM 或主管討論可行做法。例如參考適用的既有訪談、客服紀錄或報表，安排較小範圍的操作觀察，或調整這次能回答的問題。替代資料仍要確認來源與限制；若只能找到線索，就如實保留為待驗證，不能當成已證明有效。主管也要協助安排時間、權限或資源。"}, {"question": "沒做另一種研究，就要把整項標未觀察嗎？", "answer": "不用。只要目前採用的方法與結果，已足以判斷這個職階的表現，就可以評分。只有因為缺少合理機會，導致整項仍沒有足夠證據時，才先標未觀察並保留已完成部分；缺資源不直接等於低分。"}, {"question": "只有研究計畫，或結果不支持原本方案，怎麼評？", "answer": "只有計畫還不能當成完成驗證；可以用既有資料支持它實際能回答的判斷。評分時看整理、判讀與應用的實際表現，決定不做或維持原方案也可以是好的判斷。若聲稱設計已改善問題，就要有相應的結果。原型觀察能說明理解或操作情況，不能直接當成正式轉換、留存或營收成果；資料前後有變化，也要考慮其他原因。"}], "levels": [{"scores": ["能依安排整理使用者回饋或資料；記錄來源、分清事實與推測，以及整理設計修改方向時，需要逐步引導。", "能整理主要回饋與已有發現；確認資料是否適用、哪些仍是推測，以及如何用在設計上時，部分步驟仍需要提醒。", "能在協助下整理與任務有關的回饋、數據或研究結果，記錄來源，分清事實與推測。依討論把發現用在設計上；需要補充了解且條件允許時，能參與安排好的研究或測試，記錄結果。", "符合 3 分要求後，能從回饋、資料或操作觀察中，找出原先沒注意到的差異，提出可行的確認方式。經討論後補查或修改，具體改善對問題的理解或設計做法。", "在不同明確任務中，能多次從適用的回饋、數據或研究結果找出原先沒注意到的問題，依討論完成調整。能用資料來源、修改前後與後續紀錄，說明哪些錯誤理解已修正；需要補查時會提出，不以新增研究次數或方法種類判斷。"], "actions": ["先確認要了解什麼，整理目前已有的使用者回饋、客服紀錄、觀察或數據。", "跟負責人確認哪些是事實、哪些仍是推測，以及資料是否適用；需要補充了解且條件允許時，參與研究或測試。", "把確認過的發現用在設計修改上，留下資料來源和還不能判斷的部分。"], "observations": ["使用質化資料時：能在協助下整理既有回饋、訪談或操作觀察，記下來源，分清實際看到的事與推測；需要補查時，依安排參與。", "使用量化資料時：能在協助下整理既有數據或研究結果，確認對象、期間與數字意義，說明資料還不能回答什麼。"], "example": "假設情境：客服紀錄附有使用者找不到收藏入口的操作截圖。你整理出入口文字容易誤解的線索，跟負責人討論後調整文字，保留原始紀錄。這些資料能說明曾發生什麼問題，還不能證明修改已有效；後續有合適機會時，再觀察使用者是否找得到。"}, {"scores": ["能依指定問題收集回饋或查找資料；判斷資料能說明什麼、還需要了解什麼，以及如何影響設計，需要同事帶著完成。", "能整理問題與相關證據，提出初步發現；判斷資料是否適用、是否需要補充研究，以及如何形成下一步建議時，部分重要判斷仍需要同事協助。", "針對自己負責的產品問題，能獨立整理並判讀既有回饋、數據或研究結果，說明設計依據與仍待驗證的假設。需要更了解使用者或確認設計、時間與資源也允許時，能選擇並完成適合的質化或量化研究。把實際發現用在設計與下一步安排，追蹤後續結果。", "符合 3 分要求後，遇到資料矛盾或結果不明確時，能找出容易判斷錯誤的地方，選擇適合的查證或替代方法，協助決定怎麼改、是否繼續投入，並說明因此改善了什麼。", "在不同產品問題中，持續用適用的證據與合理查證改善設計判斷，減少不必要的投入或反覆誤判。能把發現連回具體決定與後續效果；既有資料或新增研究都可以，不要求同時展現質化與量化成果。"], "actions": ["先寫清楚要回答的問題，查看相關的既有回饋、客服紀錄、數據或研究，整理已知與未知。", "判斷現有證據是否足夠；需要更了解使用者或驗證設計、時間資源也允許時，選擇質化或量化方法並實際執行。", "說明證據支持哪些設計調整、還不能證明什麼，追蹤結果；暫時無法驗證的部分，跟團隊確認後續安排。"], "observations": ["使用質化資料時：能判斷既有回饋、訪談或操作觀察是否適用，整理使用情境與發現；需要補充了解且條件允許時，完成適合的研究。", "使用量化資料時：能選擇適用的既有指標、報表或研究結果，確認對象、期間、計算方式與限制；需要補充資料時，提出可行的取得方式。"], "example": "假設情境：團隊沒時間安排訪談，但有定義清楚的付款失敗紀錄。你比較版本、裝置與失敗步驟，發現特定版本的重試問題，建議先修正並追蹤後續紀錄。這次用量化資料就能支持這個決定；使用者為什麼放棄付款仍是未知，不能從紀錄直接下結論。"}, {"scores": ["能整理已指定問題的回饋或研究發現；找出領域內最影響方向的未知、判斷證據缺口並提出查證安排，需要同事帶著整理。", "能提出領域內需要釐清的問題，整理相關證據；處理矛盾資訊、判斷哪些要先驗證，以及如何支持投入決定時，部分判斷仍需要同事協助。", "能找出最影響領域方向的未知，判斷既有回饋、數據與研究結果是否足以支持決策。需要補充證據時，依風險和可用資源安排查證；條件允許時完成適合的研究或測試，條件不足時協調替代做法與後續時機。向有決定權的負責人提出有依據的選項，追蹤決定與效果。", "符合 3 分要求後，在證據互相矛盾、資料少或資源有限時，能判斷哪些資料仍可用、哪些問題要補查。透過合適的既有資料或條件允許的研究，讓關鍵決策有足夠依據，協助負責人決定維持或調整方向，並追蹤結果。", "在自己負責的領域中，持續用可信證據支持不同的重要決策，並依後續結果修正判斷。能說明如何減少試錯、避免無效投入，或持續改善使用者問題；不按研究次數或方法種類評分。"], "actions": ["整理影響領域方向的假設、既有證據和缺少的條件，依判斷錯誤的代價決定先釐清什麼。", "現有證據不足時，協調時間與資源，安排適合的研究或查證；暫時無法執行時，討論替代資料、縮小問題或分階段驗證。", "帶著實際發現、限制和選項討論決定，追蹤效果，確認仍待驗證的部分何時再看。"], "observations": ["使用質化資料時：能整合領域內的既有回饋與研究，處理矛盾線索，找出仍需了解的部分；需要且條件允許時安排補查，支持方向判斷。", "使用量化資料時：能判斷領域內的既有數據是否足以回答問題，處理定義、比較條件與資料限制；有缺口時安排可行查證，再提出投入建議。"], "example": "假設情境：團隊想重做訂閱流程，你先整理既有客服回饋與付款紀錄，發現失敗重試是可能的問題，但還不確定使用者卡在哪一步。你確認有時間與工程配合後，安排小範圍操作觀察，再測試局部修改。負責人據此先修這段流程；整體付款轉換是否提升，等資料齊全後再追蹤。"}, {"scores": ["能整理熟悉產品的回饋、數據或研究發現；比較多個產品的情境、資料限制和共同問題，需要合作團隊帶著釐清。", "能整理多產品的共同問題與相關證據；判斷哪些發現可以共用、哪些需要另外查證，以及如何支持共同決定時，仍需要合作團隊協助整合。", "能分清跨產品的共同問題與必要差異，判斷各產品既有證據的適用範圍。需要補充了解或驗證、條件也允許時，協調時間、資源與分工，完成適合的研究或查證；條件不足時確認替代做法與後續時機。用實際發現支持共同決定並持續追蹤，不要求各團隊採用同一方法。", "符合 3 分要求後，遇到產品情境不同、證據衝突或研究成本高時，能釐清哪些發現可以共用、哪些必須分開判斷。結合適用的既有證據與必要的查證安排，讓原本難以決定的跨產品選擇有足夠依據，並追蹤決定與效果。", "多個團隊在後續新問題中，能自行判斷既有證據是否適用、還有哪些未知，以及何時需要補充研究，並依實際條件安排。團隊持續用有依據的發現做選擇、依結果修正判斷，也有工作與使用紀錄說明跨產品決策或體驗的改善。"], "actions": ["比較各產品的問題與既有資料，分清共同發現、情境差異，以及還不能確定的部分。", "需要補充證據時，協調各產品可用的時間、資料和研究機會，完成適合的查證，不要求用同一方法。", "整理發現與適用範圍，協助共同決策並追蹤效果；未能回答的問題，確認後續時機和負責人。"], "observations": ["使用質化資料時：能比較各產品既有回饋與研究的適用範圍，分清共同發現與情境差異；需要補查時，協調各團隊的時間與資源。", "使用量化資料時：能確認各產品既有數據是否可比，處理指標、族群與產品階段差異；指出需要補足的部分，支持有依據的共同決定。"], "example": "假設情境：兩款產品都有導覽問題。一款已有近期任務觀察，足以支持調整分類；另一款只有點擊量，還不知道使用者為什麼找不到。你協助兩個團隊分清證據能回答什麼，後者在時間與資源允許下補做操作觀察，再各自決定怎麼改，留下結果、限制與後續安排。"}], "facet_mode": "method_options"}, {"id": "C5", "name": "溝通協作與設計交付", "source_ids": ["C6", "C7"], "definition": "清楚表達自己的設計決策，說明要解決什麼問題、為什麼選這個做法，以及考量了哪些依據、限制與取捨。能理解並回應 PM、工程師、業務或其他利害關係人的問題，釐清對方的顧慮；尚無法確認的部分，會說明並追蹤回覆。依專案需要確認分工，安排時程、規格、版本與驗收；有分歧或變動時，整理選項、確認決定並更新資訊。這項看的是設計理由是否講得清楚、疑問是否得到適當回應，以及各方能否順利接手完成工作。", "evidence": "設計決策與方案比較說明、利害關係人的提問與回應紀錄、待確認問題的後續回覆、規格與版本說明、時程和分工、驗收與交接紀錄，以及合作同事是否理解設計理由並能接手的回饋。", "facets": [{"name": "溝通與決策討論", "question": "能否說清楚自己的設計決策、依據與取捨，回應利害關係人的問題，並確認決定與分工？"}, {"name": "工作安排與設計交付", "question": "設計內容、版本、配合順序與驗收條件是否清楚，合作同事能否接著做？"}], "scoring_note": "溝通與交付分開記錄，最後給整項一個分數；3 分以上需要兩個面向都符合目前職等的期待。分別看設計決策的說明、提問的回應與後續確認，以及交接和執行安排，並記下所需協助及外部限制。", "clarifications": [{"question": "溝通與交付的熟練程度不同，怎麼評？", "answer": "分開記下兩邊已能獨立完成的部分，以及需要協助的步驟，再對照整項描述。3 分需要兩個面向都完成這個職階的責任；設計說明、回應提問、規格或交接安排中需要支持的部分，可以列為下一步練習。"}, {"question": "利害關係人的問題，一定要當場全部答出來嗎？", "answer": "先確認對方想了解什麼，用已知依據回應。需要查證時，說明待確認的部分、找誰協助與何時回覆，再完成後續確認。Jr. 遇到複雜取捨時可以請同事一起討論；評分看是否讓疑問獲得處理，不要求即席回答所有問題。"}, {"question": "PM 沒接受提案，或工程延誤，就不能達標嗎？", "answer": "看是否說清楚設計依據與取捨、理解並回應對方的顧慮，以及找對決策負責人確認。有變動時，更新範圍、時程與交接安排。不同意見和外部延誤不直接等於低分；要對照你實際負責的溝通與交付工作。"}], "levels": [{"scores": ["能依明確步驟完成部分設計工作，介紹畫面與操作；說明設計理由、回應任務相關提問，以及整理規格和交接內容時，需要逐步引導。", "能說明主要設計做法、回答熟悉的操作問題，並安排自己的任務；連結設計理由與目標、釐清對方顧慮，以及補齊規格和交接資訊時，部分步驟仍需要提醒。", "在明確任務內，能說清楚自己的設計決策與理由，回答相關同事對畫面和操作的問題；遇到複雜取捨或未知資訊，整理後請同事協助並追蹤回覆。能依範圍安排時間，交付清楚的畫面、狀態與版本，有變動時更新資訊並配合驗收修正。", "兩個面向都達標後，遇到設計說明容易誤解或交付順序改變時，能從對方的提問找出資訊落差，用畫面對照或操作示範講清楚理由，確認疑問已處理。同步調整規格與交接安排，減少來回補問或拿錯版本重做。", "在不同明確任務中，能預先說明容易被問到的設計選擇，持續把理由、操作和待確認事項交代清楚，並完成後續回覆。合作同事能理解設計、找到正確版本並完成驗收，也有紀錄顯示同類誤解或交接遺漏持續減少。"], "actions": ["挑出任務中的主要設計決策，用目標、畫面和操作說明為什麼這樣做；聽清楚相關同事的問題，再針對疑問回答。", "遇到不確定的資訊或複雜取捨，記下問題、找誰協助和何時回覆；確認後更新設計說明與決定。", "安排討論與修改時間，整理畫面、狀態和版本，與接手同事確認交付及驗收方式；有變動時同步更新。"], "observations": ["能說清楚明確任務中的設計決策與理由，回答畫面和操作相關問題；需要協助的部分會整理並追蹤回覆。", "能安排自己的交付，提供正確規格與版本，有變動會更新並配合驗收。"], "example": "假設情境：你設計註冊表單，PM 問「錯誤訊息為什麼放在欄位下方？」你用畫面示範，說明讓使用者直接找到要修改的位置。工程追問帳號已存在時怎麼處理，你記下尚待確認的流程，和同事討論後補回說明，再把各種錯誤狀態整理到同一份規格，確認版本與驗收方式。"}, {"scores": ["能介紹方案並完成指定交付；整理設計依據、說明選項取捨、回應利害關係人的疑問，以及安排整段交接與驗收，需要同事帶著進行。", "能獨立說明主要方案與理由，回答常見疑問並安排主要設計工作；遇到不同立場的追問、範圍變動或交付衝突時，部分說明、協調與驗收安排仍需要協助。", "針對自己負責的產品問題，能獨立說清楚設計決策、依據與取捨，回應利害關係人對需求、可行性和影響的問題；待確認的部分會追蹤回覆。能確認分工，安排交付、規格、版本與驗收，有變動時同步更新，讓合作同事理解並接著做。", "兩個面向都達標後，面對不同立場的追問或多項工作互相等待時，能釐清各方顧慮，用證據、方案比較或原型說明取捨，協助有決定權的人確認做法。同步調整交付與驗收，並有紀錄說明因誤解而反覆討論、等待或重做的減少。", "在不同產品問題中，持續把複雜的設計決策說得清楚，讓利害關係人理解選擇的理由與代價，重要疑問也都有回應或後續確認。需求變更後，各方仍能依清楚的規格、版本與驗收安排接續，並有紀錄顯示溝通誤解或交接遺漏持續減少。"], "actions": ["整理問題、設計決策、支持依據與替代方案，說明為什麼這樣選，以及對使用者、產品目標和實作的影響。", "聽清楚 PM、工程或其他利害關係人的顧慮，用證據或示範回答；記下待查問題與回覆時間，找決策負責人確認取捨和分工。", "安排交付順序，提供畫面、狀態、版本與驗收條件；變更時更新相關說明，和接手同事確認是否能繼續做。"], "observations": ["能獨立說明產品問題中的設計決策、依據與取捨，回應利害關係人的顧慮並完成後續確認。", "能安排完整產品問題的交付順序、規格與驗收，讓合作同事順利接手。"], "example": "假設情境：付款改版時，你建議把折扣碼收在可展開的區塊。業務擔心使用者找不到，工程則問是否每個入口都要顯示。你用既有操作觀察和兩版原型說明建議理由，回應各入口的差異；找不到折扣碼的風險仍待驗證，你和 PM 確認測試安排，再整理採用方案、各種狀態與驗收條件交給工程。"}, {"scores": ["能說明領域內單一功能的設計理由並完成交付；串起多個功能的設計決策、回應不同角色的顧慮，以及整合工作順序與驗收，需要其他負責人帶著完成。", "能整理領域內主要設計決策、分工和進度，回應熟悉的功能問題；面對跨功能影響、目標衝突或重要配合事項變動時，部分說明與協調仍需要其他負責人協助。", "能說清楚領域內的設計決策、依據與跨功能取捨，回應各方對產品目標、使用者體驗和實作限制的問題，並追蹤待確認事項。能釐清決定權，安排多個功能的階段交付、規格與驗收；需要調整資源或範圍時，帶著選項找有決定權的人確認。", "兩個面向都達標後，面對多方目標衝突、新舊版本並行或工作順序變動，能釐清爭議背後的顧慮，用整段流程和方案比較說明各選擇的影響，回應追問並協助確認做法。調整相關交付與驗收後，能用紀錄說明誤解、版本混淆或重做的改善。", "在領域內不同功能與後續版本中，持續讓複雜設計決策的理由、影響與限制被各方理解，關鍵疑問有清楚回覆或確認結果。相關同事在需求改變後仍能掌握取捨與接手條件，並有紀錄顯示反覆釐清同一決定、版本落差或交接遺漏持續減少。"], "actions": ["把領域內的重要設計決策串起來，說明各功能如何配合、為什麼這樣取捨，以及對各方目標和後續工作的影響。", "針對 PM、工程、業務等利害關係人的提問，先釐清顧慮，再用流程、證據或方案比較回應；待確認事項持續追蹤，需要拍板時帶選項找負責人。", "把確認好的決定排成階段交付、新舊規格與驗收順序；更新受影響的功能與版本，確認各方知道接下來怎麼做。"], "observations": ["能說明領域內設計決策與跨功能取捨，回應不同利害關係人的問題，確認待查事項和最後決定。", "能安排多功能的階段交付、新舊規格與驗收，處理版本和工作接續。"], "example": "假設情境：訂閱改版時，你建議把「已付款」和「服務已開通」分成兩個狀態。PM 問為什麼不能只顯示訂閱成功，客服擔心使用者會以為付款失敗。你用付款到開通的完整流程，說明等待期間要顯示什麼、如何查進度，以及兩種做法的影響；開通延遲多久需要提醒，則和工程確認後回覆，再更新會員與付款功能的規格和驗收順序。"}, {"scores": ["能介紹跨產品方案並完成自己負責的交付；說明共同設計決策、回應各產品對適用性的疑問，以及整合決定權和交付時程，需要其他負責人帶著整理。", "能說明初步的跨產品設計方向和合作安排，回答部分產品的問題；面對共同原則與個別需求衝突，或牽涉多產品取捨、版本和驗收接續時，仍需要其他負責人協助整合。", "在負責的跨產品範圍內，能說清楚設計決策的依據、共同原則與必要差異，回應各團隊對適用性、成本和體驗的問題，並完成待確認事項的後續回覆。能釐清決定權，協調版本順序、交付規格與驗收分工；有變動時更新安排，超出權限則找負責人協調。", "兩個面向都達標後，面對多產品目標、版本或時程衝突，能把各方爭議轉成可比較的選項，清楚說明共同做法與保留差異的理由，回應關鍵疑問並協助確認決定。同步協調過渡規格與驗收，並用紀錄確認理解落差、等待或重做獲得改善。", "在多產品的後續版本與新合作中，持續讓各團隊理解跨產品設計決策的依據和適用範圍，遇到新疑問時能依清楚的紀錄討論並確認調整。各團隊仍能順利完成交付與驗收，並有實際紀錄顯示因誤解共同要求或產品差異而產生的重做、交接遺漏持續減少。"], "actions": ["說明跨產品的重要設計決策與依據，整理共同原則、需要保留的差異，以及各做法對體驗和投入的影響。", "回應各產品負責人與合作團隊的問題，用具體情境說明原則如何適用；將分歧整理成可比較的選項，確認決定權並追蹤待查問題。", "把確認好的決定轉成交付規格、版本順序與驗收分工；有調整時說明理由和影響，確認各團隊能依更新內容接續。"], "observations": ["能清楚表達跨產品設計決策，說明共同原則與必要差異，回應各團隊的顧慮並確認後續決定。", "能協調跨產品版本、過渡規格與驗收安排，讓各團隊清楚接手條件。"], "example": "假設情境：兩個產品要接同一套登入服務，其中一個產品希望保留原本的登入畫面。你說明哪些操作需要共用，例如登入失敗後的處理；哪些品牌呈現可以不同，再回答產品負責人對辨識度和改版成本的問題。尚未確定的技術限制請工程確認，回覆後記下最後決定，安排各產品的過渡版本與驗收條件。"}], "show_facets_in_map": false}, {"id": "C6", "name": "AI 探索與應用", "source_ids": ["C8"], "definition": "持續探索 AI 在設計工作中的用法，從實際遇到的問題出發，嘗試用 AI 協助整理需求、發想方案、製作內容或原型、檢查設計與交付。這項看的是能否把嘗試用到工作上，自己判斷、檢查並修正產出，讓設計品質更好、工作更有效率。也要比較使用前後的成果與投入，持續調整做法，累積真正有幫助的應用。", "evidence": "原本想改善的工作問題、AI 使用與修改紀錄、前後成果及時間比較，以及後續實際使用情況。效率要包含檢查、修改與交接的時間；品質可看內容正確性、設計完整性或重做情況。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能跟著教學或同事示範，用 AI 做出初步文字、畫面或其他成果；選擇適合任務的用法、檢查與修正產出時，需要逐步引導。", "能用熟悉的 AI 做法完成部分任務，並修正明顯問題；嘗試新的用法、補充必要背景或確認產出是否適用時，部分步驟仍需要提醒。", "能在明確任務中主動嘗試適合的 AI 用法，提供背景與限制，檢查、修正後用到工作。能說明哪個步驟更省時或品質更好，並依結果調整做法。", "遇到 AI 產出不符需求或修改費時時，能找出原因，調整提供的背景、操作方式或工具，做出可用的成果。能用前後比較，說明原本耗時、遺漏或重做的問題如何改善。", "在不同明確任務中，持續探索並改進適合自己的 AI 用法，讓原本反覆耗時或容易遺漏的工作穩定改善。能用後續成果與工作紀錄，說明節省的整體時間或提升的品質，並把有效做法分享給同事。"], "actions": ["挑一個自己常花時間或容易遺漏的步驟，先記下原本怎麼做、成果需要符合什麼條件。", "嘗試讓 AI 協助，提供必要背景；對照需求檢查產出，調整用法並自己完成修正。", "比較前後成果及包含修改在內的時間，留下有效做法；下一次任務再看是否適用。"], "example": "假設情境：你負責表單的錯誤提示，過去常漏掉字數或特殊輸入的情況。你把已確認的欄位規則交給 AI，請它列出情境和文案，再逐項對照，刪掉不適用的建議、修正語氣。記下整理與修改的總時間，下次表單再調整用法，比較是否更快整理齊全、少了哪些遺漏。", "observations": []}, {"scores": ["能用 AI 完成指定的設計步驟；判斷產品問題中哪個環節適合使用、如何檢查成果及比較效果，需要同事帶著進行。", "能將 AI 用在部分設計工作並檢查主要產出；選擇更合適的應用、串接前後工作，以及比較整體時間與品質時，部分判斷仍需要協助。", "能針對自己負責的產品問題，找出適合 AI 協助的設計工作，主動嘗試並用到實際任務。能調整做法、檢查與修正產出，讓成果符合需求，並用前後比較說明品質或效率的改善。", "當既有 AI 用法無法處理產品限制，或省下製作時間卻增加修改、交接負擔時，能找出問題並調整工具搭配與工作方式。確認成果可用，也能具體改善整段工作的時間或品質。", "在不同產品問題中，持續探索並調整 AI 應用，讓有效做法能在後續工作中反覆發揮作用。能用實際紀錄說明整體時間、遺漏或重做持續減少，設計品質也維持穩定，並說清楚做法的適用條件。"], "actions": ["從這次產品問題的設計工作中，找出最值得改善的環節，訂出品質要求與比較方式。", "嘗試 AI 用法並完成實際任務，檢查內容、畫面或互動，找出還需要自己判斷與修改的部分。", "把製作、檢查、修改和交接一起比較，保留有效做法，依後續任務繼續調整。"], "example": "假設情境：你要比較兩種搜尋結果的呈現方式，手動做兩套可輸入關鍵字的原型很花時間。你讓 AI 依既有元件產生草稿，自己補上無結果、載入與返回的互動，再確認兩套都能完成同一個任務。你把產生、修改與交接時間一起比較，留下適用的做法，讓下次比較方案時更快準備好可用原型。", "observations": []}, {"scores": ["能在熟悉的設計工作中使用 AI；找出領域內值得改善的工作流程、安排嘗試及確認整體效益時，需要同事帶著釐清。", "能提出領域內的 AI 應用機會，完成部分嘗試；決定先改善哪裡、協調前後工作的配合，以及追蹤整體品質與效率時，部分安排仍需要協助。", "能從產品或領域的設計工作中找出 AI 應用機會，安排實際嘗試並調整工作流程。能跟相關同事確認檢查與交接方式，持續比較包含修改成本的效率與品質，讓有效做法用在後續工作。", "當 AI 應用牽涉多個功能、新舊設計規則或不同同事的工作方式時，能找出反覆出錯、檢查費時或交接卡住的原因，協調調整。把檢查、修改與交接一起改善，並確認整體時間減少或品質提升。", "在領域內不同功能與後續版本中，持續探索、調整並推進有效的 AI 應用，讓相關同事能實際採用。能用整段工作的紀錄，說明耗時或重做持續減少、品質維持或提升；效果不如預期時，也會調整或停用該做法。"], "actions": ["整理領域內反覆耗時、容易遺漏或重做的設計工作，選出值得先嘗試 AI 的環節。", "和相關同事用實際任務試做，確認輸入背景、檢查標準與交接方式，依問題調整流程。", "追蹤後續功能與版本的使用情況，比較整體時間和品質，繼續改進有效做法並停用效果差的用法。"], "example": "假設情境：同一產品每次新增方案，都要改方案頁、結帳頁和會員頁，設計審查常發現文案或狀態漏改。你試著讓 AI 依需求和既有規則整理受影響的畫面與檢查清單，找 PM、設計與工程用一個版本試做，人工確認清單並修正遺漏。後續版本再比較整理、審查與重做時間，以及漏改的情況，決定哪些步驟保留、哪些要調整。", "observations": []}, {"scores": ["能分享自己探索 AI 的經驗；判斷多個團隊的共同需要、安排適合各產品的嘗試，以及比較整體效益時，需要合作團隊帶著整理。", "能提出跨團隊的 AI 應用方向或初步做法；釐清產品差異、品質要求及後續採用方式時，部分整合與判斷仍需要協助。", "能持續探索 AI 如何改善跨產品的設計工作，找出共同問題，和各團隊完成實際嘗試。能依產品差異調整用法與檢查方式，推動有效做法被採用，並確認整體品質或效率的改善。", "當不同產品的設計規則、工作流程或工具限制互相衝突時，能判斷哪些 AI 做法可共用、哪些需各自調整，協助團隊解決採用障礙。把修改與維護成本也算入，確認多個團隊的品質或整體效率確實改善。", "多個團隊在後續新任務中，能自行探索、評估與調整你推動的 AI 應用做法，持續提升設計品質或效率。能從不同產品的使用紀錄看出成效持續，也能在工具或需求改變時，更新或停用不適用的做法。"], "actions": ["比較各產品的設計工作，找出共同瓶頸，選擇值得跨團隊嘗試的 AI 應用。", "讓各團隊用實際任務試做，釐清可共用的方法與需要保留的差異，確認成果及完整投入。", "追蹤採用後的品質與效率，讓團隊學會自行檢查、調整；遇到新工具或新需求時再評估。"], "example": "假設情境：兩個產品團隊都想用 AI 加快原型製作，但一個有完整元件庫，另一個還在探索版型。你和兩邊各選一個真實任務試做：前者讓 AI 沿用元件，後者用來比較版面方向。各自記下製作、修正和交接時間，確認成果可用後才延續做法；後續團隊也能依任務自行調整，回報哪些用法持續省時、哪些反而增加修改。", "observations": []}], "clarifications": [{"question": "每個任務都要用 AI，或學很多工具嗎？", "answer": "看整段期間是否持續探索、把適合的用法放進實際工作，再依結果改進。每個任務不必硬用 AI，也不按工具數量或使用次數評分；要說明自己嘗試了什麼、如何判斷，以及帶來的品質或效率變化。"}, {"question": "怎麼確認 AI 真的有幫助？", "answer": "用相近任務比較前後成果，時間要算進檢查、修改和交接，品質可看資訊是否正確、狀態是否完整、重做是否減少。能提升品質或效率都可以，但省時後仍要符合任務的品質要求；只有產出草稿更快，還不足以說明整體改善。"}, {"question": "一定要用 AI 做原型或寫程式嗎？", "answer": "應用可以是整理需求、探索方案、製作內容或原型、檢查設計與交付。依實際工作選擇有幫助的用途；如果做原型，要說清楚哪些是模擬，正式程式與上線則依專案分工。"}]}, {"id": "C7", "name": "設計系統與知識共用", "source_ids": ["C9"], "definition": "先判斷現有元件、規則、案例和方法能不能用，適用時正確沿用；遇到反覆出現的需求，再整理成後續工作能繼續使用的內容。這項看用途和限制是否清楚、設計規範是否跟實作一致，以及有人使用、更新後，是否真的減少重做。共用內容可以是元件、原則或案例，不要求每個任務都新增元件，也不要求所有事業單位使用同一套系統。", "evidence": "元件、規則或案例、實際使用紀錄、維護分工，以及重做或品質問題的改善。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依範例使用現有元件；選擇適合的變體、套用命名規則和整理交付說明時，需要逐步引導。", "能使用常見元件與命名規則；確認變體、狀態和不適用的情況時，部分細節仍需要同事協助整理。", "能正確使用適合任務的元件、規則和命名，檢查變體與狀態。不適用時會說清楚缺什麼，並留下合作同事看得懂的交付與例外說明。", "發現元件、命名或說明常讓人用錯時，能提出具體補充並找負責人確認。後續使用時也有檢查，能看出相同的誤解或重做減少。", "在不同任務中，多次改善細部元件用法或文件，讓同事少走彎路，也維持設計一致。"], "actions": ["先查現有元件和範例，確認版本與適用情況。", "依規則命名、使用變體，避免沒有必要就複製新元件。", "遇到現有元件無法處理的情況，附上使用情境和畫面，找負責人確認。"], "example": "假設情境：收藏狀態好像需要第三種按鈕樣式，你先確認現有變體能不能表達，再把不足的地方整理給元件負責人。", "observations": []}, {"scores": ["能使用熟悉的元件與規則；判斷新情境是否適用、需要補充什麼，以及如何留下可延用的說明，需要同事帶著完成。", "能判斷多數元件用法，完成主要狀態與交付；遇到規則不適用或需要擴充時，用途、限制和替代方案的說明仍需要同事協助確認。", "能先判斷現有元件與規則是否適用，適用就正確使用，不適用則說明不足和替代做法。交付時把狀態、用途和限制寫清楚，避免不必要的重複或不同做法。", "能從已經重複出現的需求，整理可共用的元件、規則或案例，說清楚適用與不適用的情況，跟使用者或工程確認。透過後續任務的實際使用修正內容，減少重複解釋或製作。", "持續把這個職階常遇到的問題，整理成實際好用的共用內容，能用不同任務的使用和更新紀錄，說明品質或維護的改善。不必建立全團隊的設計系統管理制度。"], "actions": ["交付前先查現有規則，判斷能不能直接使用。", "需要修改或新增時，寫清楚不足、用途、狀態和適用範圍，找負責人確認。", "看看後續任務怎麼用，修正難懂或不適用的內容。"], "example": "假設情境：不同表單都反覆遇到錯誤提示問題。你整理提示位置和文字原則，在下一個表單實際使用並依回饋修改，留下規則和兩次交付紀錄，不用先做出完整 Design System。", "observations": []}, {"scores": ["能整理個別元件或設計案例；找出領域內值得共用的內容、釐清工程對應與維護方式，需要其他負責人帶著完成。", "能從反覆需求整理共用元件、規則或案例；確認使用限制、工程差異與後續維護安排時，部分內容仍需要合作同事協助補齊。", "能針對領域內反覆出現的問題，選用或補強可共用的元件、規則與案例，說清楚用途、限制和維護方式，讓後續工作實際用得上。", "能處理現有共用內容跟實際需求、工程實作之間的差異，完成必要修改、安排使用和問題回報，讓後續工作少重做、少出現不一致。", "領域內的共用內容能在不同後續任務中持續使用、更新。其他人知道何時可以擴充、如何維持品質，也有實際案例說明重做或品質問題持續減少。"], "actions": ["從反覆發生的問題找共用機會，先檢查現有內容，再說明為什麼需要擴充。", "補齊使用情境、狀態、限制、工程對應和維護分工。", "追蹤後續任務的使用與問題，確認減少了哪些重做或不一致。"], "example": "假設情境：你補齊現有表單元件的錯誤狀態，跟工程確認一致，再追蹤後續功能怎麼使用。這項會看實際使用、回報和維護紀錄，不只看新增多少元件。", "observations": []}, {"scores": ["能提出跨產品共用的元件或規則；比較各產品差異、共用成本與維護分工，需要合作團隊帶著梳理。", "能找出值得共用的內容並提出初步做法；釐清例外、擴充方式、實作對應與更新責任時，仍需要合作團隊協助，才能讓各產品持續使用。", "能判斷哪些元件、規則或知識值得共用，說明例外和維護成本，跟合作團隊確認誰更新，讓內容在實際工作中用得上，也跟工程實作一致。", "多個產品的需求和技術不同時，能解決現有系統難用或難更新的問題，讓共用內容繼續調整，並用實際紀錄說明重做或品質問題的改善。", "後續團隊能自行擴充、修改共用內容，維持必要一致性並保留合理例外。長期重複製作的情況減少，維護工作也持續有人負責。"], "actions": ["比較共用元件、只共用原則和分開處理，各自需要多少成本。", "選擇確實有幫助的內容讓團隊使用，確認例外情況和維護負責人。", "追蹤後續使用、擴充，以及設計和實作是否保持一致。"], "example": "假設情境：多個產品反覆重做價格資訊。你整理共用的資訊規則、保留不同排版，確認誰負責更新，再觀察後續任務能不能自行延伸使用。", "observations": []}], "clarifications": [{"question": "一定要建 Design System，或做新元件嗎？", "answer": "先把適用的現有內容用對，也能提供評分證據。較高分會看後續是否真的有人使用、使用問題有沒有改善，以及是否持續更新。可以共用原則或案例，也可以保留產品差異；C8 再另外看同事的判斷能力是否進步。"}], "discussion_tag": "考慮與 C2 合併"}, {"id": "C8", "name": "主動當責與專業影響力", "source_ids": ["C10"], "definition": "在自己的責任範圍內，主動注意影響使用者體驗或工作品質的問題，提出可行做法，遇到阻礙時尋求必要協助並追蹤後續。能說明自己的判斷，發現不合適時願意調整，也把有效經驗用在之後的工作。隨著職階提高，進一步幫助同事與其他團隊改善做法、提升判斷能力。", "evidence": "何時發現並提出問題、自己承接了什麼、如何尋求協助與跟進、哪些判斷因回饋而調整，以及後續工作如何改善。資深職等也可以提供同事或其他團隊實際採用、能自行處理類似問題的紀錄。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依提醒說明遇到的問題，完成已確認的修改；判斷何時提出、需要找誰協助，以及如何把回饋用到後續工作，需要逐步引導。", "能提出自己任務中的明顯問題，完成主要修正；整理影響、確認後續處理，以及把學到的做法用到下一次任務時，部分步驟仍需要提醒。", "能主動提出自己任務中的問題，說明目前判斷與需要的協助，完成自己負責的修正並確認後續。發現原本做法不適合時，能依回饋調整，並把學到的做法用到下一次工作。", "遇到處理方式或分工不清楚的問題，能先整理影響和自己能做的部分，帶著建議找人確認並完成修正。也會回頭調整造成遺漏的工作習慣，確認後續任務少出現同類問題。", "在不同明確任務中，持續提早提出問題、完成自己能負責的改善，並依結果調整做法。能用後續工作紀錄，說明重複遺漏或需要提醒的情況減少，整理出的經驗也能讓同事參考。"], "actions": ["遇到問題先記下影響、自己的判斷，以及需要誰協助，及早拿出來討論。", "確認自己要處理的部分，完成修正；超出範圍的問題，確認交由誰接手及後續狀態。", "回頭看原本為什麼沒注意到，調整自己的做法，下一個任務再確認是否有改善。"], "example": "假設情境：你交完註冊表單後，自己發現錯誤提示會把原本輸入清空。你帶著操作紀錄告訴 PM 和工程，確認由自己補上保留輸入的設計，完成後再操作檢查。之後做其他表單時，你把「失敗後資料是否保留」加入自己的檢查習慣，記下哪些遺漏因此減少。", "observations": []}, {"scores": ["能處理已交辦的設計問題，依回饋修改；發現未被交辦的相關問題、確認自己能承接什麼，以及檢討原本判斷時，需要同事帶著進行。", "能提出產品問題中尚未處理的部分，也能完成明確的改善；遇到分工不清、需要持續跟進或依結果調整做法時，部分判斷仍需要協助。", "能主動承接自己負責的產品問題，發現遺漏或責任不清時，提出影響與可行做法，確認自己和相關同事各自處理的部分並跟進。會根據實際結果檢討與修正判斷，把有效經驗用到後續工作。", "遇到問題反覆被擱置、回饋與原先判斷不同，或處理到一半才發現限制時，能主動提出並調整自己的做法，找到可行的下一步。能說明問題如何獲得處理，以及哪些做法改變後減少了再次發生。", "在不同產品問題中，持續讓原本容易漏接或反覆發生的問題獲得處理，並依後續結果改進自己的判斷。能用工作紀錄說明同類問題減少，也讓合作同事實際參考這些經驗，改善之後的工作。"], "actions": ["主動查看自己負責問題的後續回饋，找出還沒處理或沒人接手的部分，說明影響與建議。", "確認自己可以承接什麼、哪些需要協助，跟進到問題已處理，或已有明確的後續決定。", "把結果和原先判斷對照，說清楚要修正什麼，將學到的做法用在下一次工作並分享。"], "example": "假設情境：你負責的取消訂閱流程已上線，但客服仍收到「取消後立刻不能用嗎」的疑問。你主動查看回饋，發現自己原先認為清楚的到期說明仍會被誤解，便提出並承接文案與資訊位置的調整。和 PM 確認安排後，你追蹤修改與後續回饋，再把這次判斷失準的原因用在其他權益說明。", "observations": []}, {"scores": ["能處理領域內已指定的改善，也能協助同事修改個別設計；主動承接反覆問題、檢討共同做法，以及引導同事理解判斷時，需要協助。", "能提出領域內需要改善的問題，承接部分工作並分享經驗；讓改善持續推進、依結果調整做法，以及引導同事自行判斷時，部分安排仍需要協助。", "能主動推動領域內反覆問題的改善，確認自己與相關同事的責任，遇到阻礙時尋求必要協助並跟進。會檢討自己的判斷，也透過審查、合作或指導，幫助同事理解原因並逐步自行處理類似問題。", "當問題反覆發生在不同功能、原有做法已不適用或同事難以判斷時，能主動找出原因，調整自己的處理與指導方式。後續工作可看到同類問題減少，同事也更能說明理由、自行完成改善。", "在領域內不同功能與後續版本中，持續讓反覆問題獲得改善，並把結果用來修正共同做法。相關同事能自行發現問題、比較選項並推進處理，也能把經驗傳給其他人，讓改善持續發生。"], "actions": ["留意領域內反覆出現或尚未有人承接的問題，提出影響、自己能做的事，以及需要的配合。", "和相關同事確認處理方向並跟進，檢討原先判斷，遇到限制時調整做法或尋求協助。", "在審查、合作或指導中說明判斷方式，讓同事自己嘗試；後續再看問題是否減少、對方能否自行運用。"], "example": "假設情境：你發現團隊多次只設計付款成功的畫面，付款失敗後如何繼續常到驗收才補。你主動提出這個反覆問題，也檢討自己之前的審查只看主要流程。你和同事用一個功能練習判斷失敗情境，承接現有問題的改善；下一個功能讓同事自行整理，再看是否提早補齊、驗收時的遺漏有沒有減少。", "observations": []}, {"scores": ["能參與跨團隊改善，分享熟悉的設計經驗；找出值得共同承接的問題、確認自己如何推動，以及協助團隊改變做法，需要其他負責人帶著整理。", "能提出跨團隊的共同問題與初步改善，協助部分團隊嘗試；處理責任缺口、依不同情境調整做法，以及確認後續能否自行延續時，部分推動仍需要協助。", "能主動推動跨產品的共同問題獲得處理，確認自己與各團隊的責任，協調必要支持並追蹤改善。會依實際結果修正主張，透過合作、審查或指導，讓各團隊理解做法與適用範圍，能在後續工作中自行運用。", "當共同問題長期沒人承接、各產品做法互相衝突或先前的改善無法延續時，能主動促成重新檢視，調整自己的主張與推動方式。各團隊實際完成改善，遇到新情境也更能自己判斷與處理。", "多個團隊在後續新問題與版本中，能持續自行發現責任缺口、承接改善並檢討結果，也能把經驗帶到其他團隊。從各產品的實際工作可確認共同問題持續減少，改善與專業判斷已能由團隊延續。"], "actions": ["從多個產品的工作與回饋找出共同問題，主動提出自己能如何推動，確認各團隊願意承接的部分。", "和有決定權的負責人確認支持與分工，跟進實際改善；依產品差異和結果修正原先主張。", "讓團隊理解判斷理由並自行調整，觀察後續是否能持續發現、承接和改善問題，再提供需要的協助。"], "example": "假設情境：兩款產品的會員權益說明，常因業務規則變更而過期，卻都以為另一個角色會檢查。你主動提出共同的責任缺口，和各產品負責人確認誰提出變更、誰檢查體驗，並一起處理既有問題。你依兩邊情況調整原先建議，讓團隊理解判斷方式；後續推出新方案時，團隊能自行提出檢查並修正，過期說明也持續減少。", "observations": []}], "clarifications": [{"question": "同一個案子，C5 和 C8 怎麼分別評？", "answer": "C5 看設計討論、分工、規格與驗收是否清楚，合作同事能否順利接手；C8 看是否主動承接問題、依結果修正自己的判斷，以及把改善用到後續工作。可以用同一案子的不同紀錄說明，但單純準時交件不會讓兩項一起拿高分。"}, {"question": "當責代表所有問題都要自己扛嗎？", "answer": "在自己的責任與決定權內承接；超出範圍時，提出影響和建議，找有權限的人確認分工與資源，並跟進後續決定。評分看實際採取的行動，不要求加班、越權，或保證自己無法控制的結果。合理提出停止或延後，也可以是負責的判斷。"}, {"question": "只有自己一位設計師，怎麼展現專業影響力？", "answer": "Jr.、Md. 可以從自己的任務、修正判斷和後續改善累積，不必另外找人指導。Sr.、Principal 可以在正常工作中與 PM、工程或其他事業單位的設計師合作、審查或分享，讓對方實際運用。主管應協助安排相應機會與支持，x-lab 也一樣。"}, {"question": "和公司價值觀有重複嗎？", "answer": "公司價值觀沿用既有名稱與評估規則。C8 依目前職等，看具體工作中的承接、判斷修正與專業影響；要有行動和後續紀錄，不另外用「態度積極」或「很有責任感」直接給分。"}]}], "common_rules": [{"title": "這份職能地圖怎麼用", "text": "這份討論稿分成 8 項共同職能，每項都有四個職階的定義、做法和 1–5 分標準。先選目前職階，再對照實際工作紀錄討論表現和下一步。正式考核制度還需要主管確認。先前的四角色 AI 模擬討論針對原 10 項版本，沒有重新審閱這次的 8 項文字。"}, {"title": "用完成方式和需要的協助，區分 1、2、3 分", "text": "1 分表示主要步驟與判斷需要逐步引導；2 分表示已有部分能獨立完成，其他部分還需要協助；3 分表示能持續完成這個職階的責任，也知道何時找人討論。評分要對照各項的具體行為，記下已能做到的部分和下一步。向 PM 確認目標、向工程師確認可行性，以及正常設計審查，都屬於工作合作，不會因為有請教就評低分。Jr. 的問題定義與複雜取捨，本來就可以由他人協助。"}, {"title": "3、4、5 分差在哪裡？", "text": "3 分是持續完成這個職階的責任；4 分是在較難的情況下，做出比一般任務更多的判斷，帶來具體改善；5 分則是在後續不同情況下，仍持續有明顯成果或影響。要說清楚實際差別，不能只用「主動、完整」或文件數量區分。4、5 分不要求先做到下一階的所有責任，也不要求每項都建立制度。"}, {"title": "C4 看證據與研究判斷；C5 看溝通與交付", "text": "C4 先看設計判斷是否有適用的證據。既有回饋、數據或研究結果已足夠時，可以直接使用；需要更了解使用者或驗證設計，且時間與資源允許時，應安排質化或量化研究，可擇一或搭配。4–5 分也不要求每案新增研究或湊齊兩種方法。C5 的溝通與決策討論、工作安排與設計交付，則是兩個都要負責的面向，3 分以上需要兩邊達標。兩項都各給一個分數。缺少合理機會而無法判斷整項時，保留已有紀錄，標未觀察並安排補足。"}, {"title": "先確認評估期間與工作條件，再看整段表現", "text": "評估前，主管和設計師一起確認這段時間負責哪些工作、完成標準，以及可以取得的時間、資料和協助。評分時看整段期間的實際完成方式與需要的支持，不以單次失誤或一次需要提醒就決定分數。缺少資源或工作機會的部分，要分開記錄並安排補足。"}, {"title": "先說清楚這次要做到哪裡", "text": "任務開始時，先確認使用對象、流程起點與終點、負責範圍、相關平台和品質要求。完整是把這次需要的情況處理好，不是每個案子都要有跨平台、多角色或所有狀態。發現範圍外的風險時，仍要說明，並確認由誰接著處理。"}, {"title": "負責推動工作，和最後拍板是不同責任", "text": "設計師主導專業工作，包括提出問題和選項、找相關同事討論，以及追蹤決定和實作。資源、優先順序、上線和是否停止投入，要由專案中有這項決定權的負責人確認。提案沒被接受或遲遲沒回覆時，看你是否有合理判斷、及時找人協調並跟進；不要求越權，也不能把還沒採用的提案算成已完成的改善。"}, {"title": "證據能說明到哪裡，就評到哪裡", "text": "上線前測試、可操作原型和上線後資料都可以當證據，但要說清楚能回答的問題。原型能看出使用者懂不懂、能不能操作，還不能直接證明正式轉換、留存或營收。推翻假設、停止無效方案也可以是好的判斷。數字變好不會自動高分；前後有變化，也不一定就是這次設計造成的。"}, {"title": "缺少機會時，要一起安排怎麼補足", "text": "缺任務、時間、資料權限、工程協助或交流機會時，記下缺什麼、已經做了什麼、有哪些替代方式、誰會協助，以及何時再看。已有足夠證據就依實際表現評分；無法判斷整項才標未觀察，已有證據仍保留。C4 沒做另一種研究方法不會直接變成未觀察，替代資料也只能支持它實際能回答的問題。主管應在正常工作內安排機會，避免一直等不到，或到期末才突然增加要求。"}, {"title": "同一個案子可以用在多項，但要說明不同能力", "text": "每項要說清楚自己的責任、行動與結果。同一案子可以提供不同能力的紀錄：C1 看問題與取捨判斷，C4 看證據解讀與應用，C5 看溝通、規格與交接安排，C8 看主動承接、修正判斷及後續影響。不能只因準時交件或案子上線，就讓多項一起拿高分；團隊與他人的貢獻也要分開說明。"}, {"title": "不同事業單位，用同一套共同標準", "text": "各事業單位和 x-lab 的產品、階段與任務可以不同，評分仍對照相同的職階責任與共同職能。探索中的產品可以用查明了什麼、因此決定做或不做什麼來說明成果；成熟產品則可以用實際改善與後續使用情況說明。"}, {"title": "持續探索 AI，確認實際幫助", "text": "C6 看整段期間如何探索並善用 AI，提升設計品質或工作效率。要有實際嘗試、產出檢查與後續調整，不按工具數量或使用次數評分，也不要求每個任務都使用。比較效率要包含檢查、修改與交接成本，成果仍須符合任務要求。原型要說明模擬限制；正式程式與上線依專案分工。"}, {"title": "從主動承接，到帶動後續改善", "text": "C8 看如何在目前職等的責任內主動提出與承接問題、依結果修正判斷，並讓改善延續。Jr.、Md. 從自己的任務與產品問題累積；Sr.、Principal 也要透過合作、審查或指導，幫助同事及團隊自行判斷。不要求有部屬或開課；事業單位只有一位設計師或在 x-lab，主管仍應協助安排正常工作內的合作機會、相應決定權與資源。"}, {"title": "八項先用相同權重試算，晉升另外討論", "text": "這版試算共 8 項，每項占 12.5%，滿分 40 分。達成比例＝總分 ÷（計入項目數 × 5），沿用 80%、60%、40% 門檻。項目調整後，各能力占比也不同，所以不能直接平均舊分數轉入，或比較新舊總分、比例，要用原工作紀錄重新對照。正式權重、評估期間，以及未觀察項目如何計入，還需要確認。"}], "pending_decisions": ["正式考核時，八項各占多少比例、看多長的期間、「持續／多次」怎麼判斷，以及由誰一起評。", "C4 採用的方法、結果與限制，以及 C5 的溝通和交付分別怎麼記錄；證據仍不足或缺少合理機會時，正式評分與晉升怎麼處理。", "各專案的優先順序、MVP、成功指標、資源、上線和停止投入，由誰決定；卡住時找誰協調。", "事業單位只有一位設計師、x-lab 或跨團隊工作時，由哪些主管提供時間、任務、資料和工程協助。", "Product Builder 若需要提交正式程式、整合或上線，先寫清楚適用職務、提供的協助，以及驗收條件。", "管理職的招募、人力安排、績效和培育制度另行定義；專業職四階不會默認包含這些責任。"], "mapping_v3": [["舊版 v3 項目", "這版對應項目", "調整方式"], ["工作大小", "C1、C5", "看責任、複雜度、取捨與設計交付；工時用來排程。"], ["元件使用", "C7 設計系統與知識共用", "保留正確使用、判斷是否適用，以及後續是否繼續使用。"], ["設計品質與一致性", "C2 UI 品質與資訊呈現", "看資訊呈現與實作品質；後續共用另看 C7。"], ["流程與資訊架構", "C3 流程與互動設計", "看操作路徑、狀態、例外，以及失敗後怎麼繼續。"], ["使用者體驗與互動設計", "C2、C3", "分開看資訊是否清楚、操作是否完整。"], ["用戶研究", "C4 質化或量化研究", "研究與驗證整理在同一項；依問題選質化或量化，記錄方法、實際結果與應用，不要求兩種都做。"], ["數據", "C4 質化或量化研究", "研究與驗證整理在同一項；依問題選質化或量化，記錄方法、實際結果與應用，不要求兩種都做。"], ["需求分析與產品策略", "C1 問題釐清與設計取捨", "看如何判斷問題、方向、範圍和代價。"], ["跨部門溝通與協作", "C5 溝通協作與設計交付", "看設計決策能否說清楚、利害關係人的問題是否獲得回應，以及交付能否順利接續。"], ["簡報會議", "C5 溝通協作與設計交付", "看能否說明設計決策、依據與取捨，回應提問並確認後續；不按聽眾職稱決定職階。"], ["領導", "C8 主動當責與專業影響力", "以主動承接與持續改善為基礎，資深職等也看同事和團隊能否運用；保留專業指導，正式人員管理另外定義。"], ["當責", "C8 主動當責與專業影響力", "看主動承接問題、依結果修正判斷，以及後續改善；C5 另看協作與交付安排，公司價值觀沿用既有規則。"], ["新增能力", "C6 AI 探索與應用", "聚焦持續探索並善用 AI，將嘗試用在實際工作，檢查產出並確認設計品質或整體效率的改善。"]], "mapping_v4": [["前一版 10 項（舊編號）", "本版對應（新編號）", "調整"], ["C1 問題理解與取捨", "C1 問題釐清與設計取捨", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C2 UI 品質與資訊呈現", "C2 UI 品質與資訊呈現", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C3 流程與互動完整性", "C3 流程與互動設計", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C4 用戶理解與證據判讀＋C5 驗證與持續迭代", "C4 質化或量化研究", "研究與驗證整理在同一項；依問題選質化或量化，記錄方法、實際結果與應用，不要求兩種都做。"], ["C6 協作與決策溝通＋C7 交付與工作管理", "C5 溝通協作與設計交付", "聚焦設計決策的說明、利害關係人提問的回應，以及分工、規格與交付安排。兩個面向各自觀察，整項給一個分數；主動承接與後續影響另看 C8。"], ["C8 AI、原型與工具應用", "C6 AI 探索與應用", "聚焦持續探索並善用 AI，將嘗試用在實際工作，檢查產出並確認設計品質或整體效率的改善。"], ["C9 設計系統與知識重用", "C7 設計系統與知識共用", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C10 專業指導與影響", "C8 主動當責與專業影響力", "擴大為主動承接、修正判斷與持續改善；資深職等保留透過合作、審查或指導帶動團隊的要求。"]], "context": {"roles": [["項目", "職能 1｜Jr. Designer", "職能 2｜Md. Designer／Product Designer", "職能 3｜Sr. Designer／Product Builder", "職能 4｜ function mapUI(){
 const roles=DATA.context.roles;
 $('#map').innerHTML=`<div class="panel summary">${[1,3,5].map(i=>`<div><label>${esc(roles[i][0])}</label>${esc(roles[i][level+1])}</div>`).join('')}</div>
 <div class="notice"><b>先看這個職階要做到什麼，再對照工作表現</b><br>每項都有定義、做法、例子和 1–5 分標準。1 分是主要步驟需要引導，2 分是部分能獨立完成，3 分是能持續完成這個職階的責任。正常找同事討論，不會因此被評低分。<br>C4 先看設計判斷的證據，需要進一步了解或驗證、時間資源也允許時，再安排質化或量化研究；C5 則要同時看溝通與交付。缺少時間、資源或資料時，保留已有紀錄，再確認怎麼補足、由誰協助。</div>
 <details><summary>評分前，一起確認的原則</summary>${commonRules()}</details>
 <div class="toolbar"><div><h2>共同職能 · ${titles[level]}</h2><span class="label">${N} 項職能，完整保留 1–5 分標準；3 分代表符合期待</span></div><input id="search" aria-label="搜尋職能" placeholder="搜尋職能或關鍵字" value="${esc(query)}"></div>
 <div class="cards" id="cards"></div>`;
 $('#search').oninput=e=>{query=e.target.value;cardsUI()};cardsUI();
}
function facetsUI(item,compact=false){
 if(!item.facets.length||(!compact&&item.show_facets_in_map===false))return '';
 const guide=item.levels[level];
 const methodOptions=item.facet_mode==='method_options';
 const heading=methodOptions?'依問題選用資料或研究方法':'評分時，兩個面向都要看';
 return `<div class="facet-guide"><b>${heading}</b>${methodOptions?'<p>質化或量化可擇一或搭配，既有資料足夠時可直接使用。</p>':''}${item.facets.map((f,i)=>`<div><strong>${esc(f.name)}</strong><p>${esc(guide.observations[i])}</p></div>`).join('')}</div>`;
}
function cardsUI(){
 const q=query.trim().toLowerCase();
 const rows=ITEMS.filter(i=>/^c\d+$/.test(q)?i.id.toLowerCase()===q:(i.id+i.name+i.definition+i.levels[level].scores.join('')+i.levels[level].actions.join('')+i.facets.map(f=>f.name).join('')).toLowerCase().includes(q));
 $('#cards').innerHTML=rows.length?rows.map(item=>{
  const guide=item.levels[level];
  return `<article class="card"><div class="code">${item.id} / 共同職能${item.discussion_tag?` <span class="badge discussion-tag">${esc(item.discussion_tag)}</span>`:''}</div><h3>${esc(item.name)}</h3>
  <div class="definition"><b>這項職能在看什麼？</b><p>${esc(item.definition)}</p></div>
  ${facetsUI(item)}
  <div class="action-guide"><b>這一階，我可以怎麼做？</b><ol>${guide.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ol><small>可以從這些做法開始；評分時仍要看實際表現和工作紀錄。</small></div>
  <details class="example"><summary>看一個工作例子</summary><p>${esc(guide.example)}</p><small>這是用來解釋做法的假設情境，實際分數仍要對照整段期間的表現。</small></details>
  <h4 class="rubric-heading">${titles[level]} · 完整 1–5 分標準</h4>
  <div class="rubric">${guide.scores.map((v,i)=>`<div class="rubric-row ${i===2?'baseline':''}"><b>${i+1} 分 · ${scoreNames[i]}</b><div>${esc(v)}</div></div>`).join('')}</div>
  <div class="evidence"><b>可以用哪些工作紀錄說明？</b><br>${esc(item.evidence)}</div>
  <details><summary>評分時可能會想問</summary>${item.clarifications.map(c=>`<p><b>${esc(c.question)}</b></p><p>${esc(c.answer)}</p>`).join('')}</details>
  </article>`;
 }).join(''):'<div class="empty">沒有符合的職能，試試其他關鍵字。</div>';
}
function reviewUI(){
 $('#review').innerHTML=`<div class="panel"><h2>先看目前表現，再看下一階需要什麼。</h2><p>這裡可以試算 ${titles[level]} 的分數。${N} 項占比相同，滿分 ${N*5} 分；四個職階分開暫存，重新整理後會清除。</p>
 <div class="notice"><b>C4、C5 怎麼給分？</b><br>C4：看設計判斷的依據、證據是否適用，以及如何解讀和應用。既有資料已足夠就能使用；需要補充了解或驗證、時間資源也允許時，應安排質化或量化研究。<br>C5：溝通和交付是兩個都要負責的面向，3 分以上需要兩邊達標。<br>兩項都各給一個分數。缺少合理機會、工作紀錄仍不足以判斷整項時，才先標「未觀察」；沒有新增研究或沒做另一種方法，本身不會扣分。</div>
 <div class="calc"><div>${ITEMS.map((item,i)=>`<div class="score-block"><div class="score"><label for="s${i}">${item.id} ${esc(item.name)}</label><select id="s${i}" data-score="${i}"><option value="">未觀察</option>${[1,2,3,4,5].map(v=>`<option ${scores[level][i]==v?'selected':''} value="${v}">${v} 分</option>`).join('')}</select></div>${facetsUI(item,true)}</div>`).join('')}</div><div class="result" id="result" aria-live="polite"></div></div>
 <div class="notice warning">這版每項占 ${(100/N).toFixed(1)}%，跟舊版各能力的占比不同。請用原工作紀錄重新對照，不能直接換算舊分數，或比較新舊總分、比例。</div></div>
 <details><summary>評分前，要一起確認什麼？</summary>${commonRules()}</details>
 <details><summary>1–5 分的共同定義</summary>${table(DATA.context.scale)}</details>
 <div class="panel"><h2>要晉升，需要累積哪些成果？</h2>${table(DATA.context.promotion)}<div class="notice">目前職階拿高分，不會自動晉升。各項正式占比、評估期間、未觀察項目怎麼處理，以及晉升怎麼決定，還需要主管確認。</div></div>`;
 document.querySelectorAll('[data-score]').forEach(s=>s.onchange=()=>{scores[level][+s.dataset.score]=s.value;resultUI()});resultUI();
}
function resultUI(){
 const a=scores[level].filter(x=>x!=='').map(Number),sum=a.reduce((x,y)=>x+y,0),ratio=a.length?sum/(a.length*5):0;
 const tier=!a.length?'尚未評分':ratio>=.8?'高階':ratio>=.6?'中階':ratio>=.4?'初階':'不符合';
 $('#result').innerHTML=`<span>${a.length<N?'尚未評完 · 暫時計算結果':'目前職階的表現結果'}</span><strong>${tier}</strong><div>已評 ${a.length} / ${N} 項</div><p>${a.length?`${sum} ÷ (${a.length} × 5) = ${(ratio*100).toFixed(1)}%`:'選擇分數後，這裡會顯示比例。'}</p><p>≥80% 高階<br>≥60% 中階<br>≥40% 初階<br>&lt;40% 不符合</p><p>「高階／中階／初階」是目前職階內的表現分級。未觀察不等於 0 分，還沒評完也不能當成全部達標。這裡只試算分數，正式評估仍要看工作紀錄，另外討論是否符合晉升要求。</p>`;
}
function rulesUI(){
 $('#rules').innerHTML=`<div class="panel"><h2>公司價值觀 · Company Values</h2><p>沿用公司的 Inconsistent（不一致）、Successful（成功）、Exceptional（卓越），跟專業能力分開評估。</p>${table(DATA.context.values)}<div class="notice">要看整段期間的表現。Successful 需要絕大多數時間都符合；Exceptional 則要在這個基礎上，經常帶來額外的正面影響。依公司規則，只要任一情境被判為 Inconsistent，該價值觀就判為 Inconsistent；有 NoShow（沒有觀察到相關行為）的情境，通常不應給 Exceptional。資料不足時先記下待補內容。</div></div>
 <details open><summary>Sr.、PM 和工程，分別負責什麼？</summary><p>以下是分工建議。專案開始時，要確認實際由誰負責、誰做最後決定，以及卡住時找誰協調。</p>${table(DATA.context.responsibilities)}</details>
 <details><summary>任務大小怎麼看？</summary>${table(DATA.context.complexity)}<p>看問題的複雜度和負責範圍，工時用來排程。AI 讓製作變快，不代表問題就變簡單。正式人員管理會另外訂管理職標準。</p></details>
 <details><summary>還需要一起確認的事</summary><ul>${DATA.pending_decisions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>`;
}
function changesUI(){
 $('#changes').innerHTML=`<div class="panel"><span class="badge">10 項 → ${N} 項</span><h2>把重複的項目放在一起，說清楚各自看什麼。</h2><p>依 Monica 確認的方向，研究與驗證、協作與交付各整合成一項，重新整理四個職階的標準。全表保留 ${ITEMS.length*4*5} 條評分描述。對照表左欄保留舊版名稱，方便查找。</p>${table(DATA.mapping_v4)}</div>
 <div class="panel"><h2>C4 看證據與研究判斷，C5 看兩個責任面向。</h2><p>C4 先看既有證據能否支持設計判斷；需要更了解使用者或驗證設計、時間與資源也允許時，應安排質化或量化研究，可擇一或搭配。C5 的溝通與決策討論、工作安排與設計交付，則仍是兩個都需要完成的責任面向。</p><div class="notice">例如既有客服紀錄或行為資料已足以支持這次的設計判斷，就可以依實際表現評 C4。沒有新研究本身不扣分；只有計畫或推測，仍不能當成已完成驗證。缺少資源時，記下限制、已有成果和後續安排；只有無法判斷整項時才標未觀察。</div>
 <h3>各能力的占比怎麼變？</h3>${table([['能力範圍','原本 10 項，各項占比相同','這版 8 項，各項占比相同'],['研究＋驗證','兩項合計 20%','C4 一項 12.5%'],['協作＋交付','兩項合計 20%','C5 一項 12.5%'],['其餘六項','每項 10%','每項 12.5%']])}<p>計算公式和門檻沿用，正式占比還要確認。新舊分數不能直接比較，請拿原工作案例重新評分。</p></div>
 <div class="panel"><h2>原本的 v3 職能地圖，對應到哪裡？</h2>${table(DATA.mapping_v3)}</div>`;
}
function researchUI(){
 $('#research').innerHTML=`<div class="panel"><h2>2026 大廠公開資料</h2><p>查閱日期：2026-09-10。下方分別標明職階責任、官方職缺和設計案例，也說明可以確認的日期。</p><div class="notice">這次沒有取得各大廠完整的 2026 版 1–5 分考核表。以下資料可以參考能力方向，這份 ${N*4*5} 條評分描述則是為 CMoney 撰寫的討論稿。整理成八項，是這份草稿的設計選擇。</div></div>${DATA.research.map(r=>`<article class="panel"><span class="badge">${esc(r.kind)}</span><h2>${esc(r.company)}</h2><span class="label">${esc(r.date)}</span><p>${esc(r.finding)}</p><div class="notice"><b>這份職能地圖可以參考什麼？</b><br>${esc(r.implication)}</div><p><b>這份資料的限制：</b>${esc(r.limit)}</p><a href="${esc(r.url)}" target="_blank" rel="noopener">查看官方來源 ↗</a>${r.extra?` · <a href="${esc(r.extra)}" target="_blank" rel="noopener">查看補充職缺 ↗</a>`:''}</article>`).join('')}
 <div class="panel"><h3>較早的參考資料</h3><p>Intercom 的職階文章發布於 2021 年，因此沒有列為 2026 年更新的依據。參考 AI 相關要求時，也會一起保留設計基本功。</p></div>`;
}
function discussionUI(){
 $('#discussion').innerHTML=`<div class="panel"><span class="badge">版本與討論紀錄</span><h2>這份草稿怎麼整理出來的？</h2><p>先前由 UIUX 主管、Md.、Sr.、Principal 四個 AI 角色，針對當時的十項職能提問、討論並確認修改。歷史紀錄保留原編號、名稱和當時的意見。</p><p>之後依 Monica 確認的方向整理成八項，重寫相關評分、做法與觀察重點，再逐條調整成較自然的台灣職場用語。先前的角色沒有重新審閱這版文字。</p><div class="notice"><b>保留的討論共識</b><br>正常找同事討論不算能力不足；推動工作與最後拍板分清楚；評分要看證據實際能說明什麼；高分需要具體改善與持續效果。事業單位只有一位設計師，或在 x-lab，也要由主管安排正常工作內的交流機會。</div>
 <p><a href="archive/v4_10_items/UIUX角色討論與修訂紀錄.md" target="_blank">閱讀原十項角色討論</a> · <a href="archive/v4_10_items/uiux-career-map.html" target="_blank">查看原十項網頁</a></p><p><a href="UIUX職能合併修訂紀錄.md" target="_blank">查看項目與計分調整</a> · <a href="用語調整紀錄.md" target="_blank">查看用語調整與 Threads 參考</a></p></div>
 <div class="panel"><h2>還需要確認的制度內容</h2><ul>${DATA.pending_decisions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
}
function render(){
 levelUI();mapUI();reviewUI();rulesUI();changesUI();researchUI();discussionUI();
 document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!==page));
 document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-pressed',b.dataset.page===page)});
}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
render();

</script>
</body>
</html>
