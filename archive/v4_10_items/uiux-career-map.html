<main><div class="eyebrow">DESIGN CAREER FRAMEWORK</div><h1>看清現在，走向下一階。</h1><p class="intro">以共同職能標準，定義每一階的責任與成長方向。從完成設計任務，到解決產品問題，再到跨產品的持續影響。</p><span class="badge">討論稿 · 尚未定案</span>

<script>const GUIDANCE={"C1": [{"actions": ["先寫出誰在什麼情境要完成什麼任務，以及這次改動的目標。", "列出已知限制與未確認處，向對應負責人確認後再比較設計選項。", "留下採用方案的理由，以及哪些問題需由資深者或 PM 決定。"], "example": "虛構示例：調整收藏按鈕前，先確認任務是讓用戶找回收藏，發現按鈕文案與入口位置都會影響，再向 PM 確認本次可調整範圍。"}, {"question": "PM 已決定需求時，我要做到哪裡？3 分的釐清與 4 分的補資訊差在哪裡？合理提案未被採用怎麼評？", "actions": ["開始前寫清使用者任務、現有阻礙、目標、限制與假設。", "比較必要選項，說明推薦方案、放棄什麼及原因。", "記錄決策與未解風險；範圍變更交由約定決策者確認。"], "example": "虛構示例：PM 希望新增篩選器；你從客服與操作紀錄發現主要問題是排序難懂，比較兩種做法後建議先調整排序。決策者採納後，記錄因此未製作的篩選流程，以及仍需驗證的找尋成功率。"}, {"question": "我提出優先序及 MVP，但 PM 不接受，怎麼區分我的判斷能力與正式拍板權？", "actions": ["寫清楚使用者問題、產品目標、已知證據與未知事項。", "比較維持現況、最小改動及較完整方案，提出推薦範圍與不做項目。", "與有權決策者確認選擇，記錄未採用理由、下一步及重新檢視條件。"], "example": "虛構示例：原需求要重做訂閱頁，你查明主要阻礙是權益理解，提議先驗證權益說明。留下前後範圍、取捨理由、決策紀錄及驗證結果；提案未採用時，不宣稱已產生產品改善。"}, {"question": "辨識跨產品問題是合理的責任，但「建立決策原則」是每次必須嗎？如果我比較後發現不該共用，成功阻止錯誤整合，算不算達標？目前 3 分「協調長短期取捨」與 4 分「處理利益衝突」有什麼差別？", "actions": ["挑一個共同問題，比較各產品證據與限制。", "列出共用、保留差異或暫緩的選項與代價。", "與約定決策者確認選項、理由及後續責任。"], "example": "虛構示例：兩款產品想共用會員流程；比較後發現權限差異，決定只共用身份辨識，保留授權步驟，並記錄後續實作及用戶理解結果。"}], "C2": [{"actions": ["依產品既有規範處理字級、間距、色彩與資訊層級。", "用任務涉及的長短內容與裝置尺寸自查可讀性。", "交付前比對稿面，驗收時標出實作差異與修正優先序。"], "example": "虛構示例：文章卡片以短標題、兩行長標題及無圖片狀態檢查，修正文字截斷與對齊問題。"}, {"question": "跨頁面與不同內容的品質自查不是 3 分就該做嗎？只負責 App 是否必須做 Web 才能達標？", "actions": ["選取任務真正涉及的長短內容、空值、尺寸與狀態作檢查。", "確認主要資訊能被辨識，再檢查對比、層級與一致性。", "對照實作記錄差異、影響與後續處理。"], "example": "虛構示例：投資列表在長公司名與大數值同時出現時難以判讀。你調整欄位層級並用代表性內容走查，確認使用者能辨識股票與報酬；證據是前後畫面、觀察結果及實作驗收。"}, {"question": "3 分建立品質標準和 4 分建立準則差在哪裡？使用成熟設計系統，沒有必要新建規範，能否拿高分？", "actions": ["確認重要資訊及真實內容情境，檢查長內容、小螢幕與易誤讀狀態。", "依可讀性、資訊優先序及適用的無障礙要求比較方案，說明呈現取捨。", "比對設計與實作，修正影響理解的問題並保留品質檢查結果。"], "example": "虛構示例：你改善高密度資訊畫面，提供真實內容及不同尺寸的前後對照、理解測試與實作檢查。C2 評呈現品質；若產生共用元件，C9 另看採用與維護。"}, {"question": "跨產品品質原則是否意味每個產品都要長一樣？3 分已經要推動並追蹤，4 分又要推動多產品品質改善，怎麼區分？是不是不碰 Design System 的 Principal 就很難拿高分？", "actions": ["抽查多產品的相同資訊情境，定位閱讀或辨識問題。", "製作改善示例，說明需要一致及保留差異之處。", "檢查實作並以使用觀察確認重要資訊是否易於理解。"], "example": "虛構示例：兩款產品的訂閱狀態不易辨識；設計師統一資訊優先順序，保留各自品牌，驗收並觀察使用者是否看懂剩餘權益。"}], "C3": [{"actions": ["畫出任務的入口、操作、完成與返回路徑。", "列出適用的載入、空白、錯誤及重試狀態；不適用者註明原因。", "用原型或逐步走查檢查是否存在卡關，複雜例外請相關角色一起確認。"], "example": "虛構示例：新增收藏時補上成功回饋、未登入提示與網路失敗後的重試操作。"}, {"question": "完整旅程的邊界到哪裡？每案都要包含跨平台、權限等所有情境嗎？C3 與 C5 如何區分？", "actions": ["先約定旅程起點、終點與不在本次處理的範圍。", "列出前置條件、成功、失敗及離開後返回的相關情境。", "走查高風險路徑，確認改動對其他路徑的影響。"], "example": "虛構示例：訂閱付款失敗後只能重新開始。你設計保留填寫內容的重試路徑，同時檢查重複付款與取消狀態；流程圖與走查記錄證明改善了回復操作。"}, {"question": "我的產品沒有跨平台或多角色，如何展現 Sr. 複雜度？AI 失敗回復是否應屬基本完整性，而非高分加分項？", "actions": ["畫出任務起訖、狀態、依賴及失敗回復，辨識容易卡住或誤操作之處。", "與工程確認限制，設計可行流程；AI 功能另涵蓋不確定輸出、修正及替代路徑。", "測試高風險路徑並修正，確認簡化後仍可完成任務及恢復操作。"], "example": "虛構示例：你梳理訂閱到期、付款失敗與權益恢復，交付狀態圖及前後流程，測試使用者能否理解目前狀態與恢復操作。複雜度來自狀態依賴，不必同時有跨平台。"}, {"question": "有些產品根本沒有跨產品旅程。我必須發明跨產品流程才能達標嗎？同一個登入或付款問題在不同產品出現，算不算共同問題？", "actions": ["畫出共同問題的角色、狀態、交接及回復路徑。", "補齊分階段改動期間與最終流程的例外。", "用原型及實作驗收確認使用者能完成任務。"], "example": "虛構示例：兩款互不串接的產品都有付款失敗問題；設計師釐清狀態和重試方式，保留各自支付差異，測試並改善卡關。"}], "C4": [{"actions": ["實際操作相關功能，讀取可取得的用戶回饋。", "標出資料來源、觀察事實與自己的推測。", "把仍無法回答的疑問帶給 PM、研究或數據夥伴確認。"], "example": "虛構示例：看到三則找不到收藏的客服紀錄，註明它們支持入口可能難找，但不能代表所有用戶都遇到問題。"}, {"question": "拿不到數據或無法訪談時如何達標？一定要多種研究方法才有 4 分，還是看證據判斷？", "actions": ["為重要判斷附來源、日期與適用使用情境。", "分列觀察到什麼、推測什麼、仍不知道什麼。", "依決策風險選擇補證據方式；權限不足時提出資料需求與替代方法。"], "example": "虛構示例：客服抱怨功能難找，但整體點擊量沒有下降。你比對新舊使用者情境，發現資料可能掩蓋新手問題；記錄分群限制並安排任務觀察，修正『所有人都找不到』的原假設。"}, {"question": "沒有研究員、資料權限或訪談預算怎麼評？這項和 C5、C9 的分界是什麼？", "actions": ["先寫需要知道什麼及它會影響哪個決策，再選可取得且適合的研究或資料。", "檢查來源包含誰、遺漏誰，對矛盾線索做適當比對或補充。", "分開事實與推論，說明資料限制、判斷改變及必要的補足計畫。"], "example": "虛構示例：客服認為用戶看不懂文案，行為資料卻顯示特定裝置特別容易中斷。你以操作觀察找到裝置限制，修正問題理解；附資料口徑及不能推論的範圍。"}, {"question": "不同 BU 使用者不同，整合洞察很容易錯把差異當共通。我建立研究流程還是提出可信的洞察，哪個才是本項？沒有研究員／數據權限時，我要自己補到什麼程度？", "actions": ["列各產品證據、情境與限制，區分共通及差異。", "針對最影響決策的矛盾安排可行查證。", "記錄因此修正的假設與方向。"], "example": "虛構示例：兩款產品都有低回訪，但訪談顯示原因不同；設計師補充查證後，促成兩種改善方向並註明證據限制。"}], "C5": [{"actions": ["向負責人確認這次設計要驗證什麼，以及成功時會看到什麼行為。", "依約定參與走查、測試或上線觀察，記錄實際結果。", "修正自己負責的問題；未能完成驗證時留下原因及下一步。"], "example": "虛構示例：觀察受測者能否找到收藏入口，發現文案誤解後修正；不把小樣本測試寫成全體用戶改善。"}, {"question": "沒有上線或量測權限時如何評？測試沒有正向結果會扣分嗎？4 分是否要求我證明因果？", "actions": ["先寫假設、支持或否定它的訊號，以及能回答問題的方法。", "確認誰提供測試或資料、誰何時回顧；不能上線時先驗證原型能回答的部分。", "記錄結果、限制與下一步，不把前後變化直接說成因果。"], "example": "虛構示例：產品本期無法排入開發。你以原型檢查使用者能否完成關鍵設定，發現術語造成誤解並修改；可支持流程可理解性的部分評估，但尚不能聲稱上線轉換率改善。"}, {"question": "沒有足夠流量做 A/B Test、方案未上線或驗證結果不支持原假設，是否會低分？誰能拍板停止投入？", "actions": ["依失敗代價排假設順序，選擇足以支持當前決策的驗證方法。", "事前約定如何判斷支持、不支持或待補，結果出來後說明歸因及方法限制。", "與有權者確認擴大、調整或停止的選擇，記錄責任人及追蹤時間。"], "example": "虛構示例：原型測試不支持核心需求假設，決策者停止原方案並轉測另一方向。提供假設、判讀、下一步及已規劃工作調整；原型結果不寫成已證明正式營收效果。"}, {"question": "每個 BU 的成功指標不一樣，為什麼都要共同口徑？3 分「讓結論持續影響決策」已很像 5 分。要求影響資源配置是否超出設計的權力？", "actions": ["找出若判錯代價最高的共同假設。", "與各產品約定成功條件、觀察方式及決策時點。", "判讀結果及限制，提出下一步並追蹤決策。"], "example": "虛構示例：共用導覽原型在兩產品的測試結果不同；設計師判讀差異，建議一款繼續、一款調整，請決策者確認投入。"}], "C6": [{"actions": ["用目標、結論、理由與待確認事項說明設計。", "回述收到的意見，確認自己是否理解對方限制。", "記錄決定、未決問題與下一位負責人。"], "example": "虛構示例：工程指出元件限制時，先確認限制影響，再帶兩個局部做法討論，留下選定版本。"}, {"question": "促成共識是否要求人人同意？合理提案未被 PM 採納會扣分嗎？高分需要特別外向或擅長演講嗎？", "actions": ["討論前說清要決定什麼、可選方案與決策者。", "先理解各方限制，再針對真正爭點提出證據或選項。", "留下決策、理由、負責人與待追蹤風險。"], "example": "虛構示例：工程認為完整重做成本太高，PM 要求如期發布。你區分必要的卡關修正與可延後美化，提出分段方案，由 PM 確認範圍；紀錄剩餘風險與負責人，而非宣稱所有人都同意原設計。"}, {"question": "對方不接受方案或不提供資源就算溝通差嗎？依約升級拍板是否算完成責任？", "actions": ["確認各方目標與限制，分開事實分歧、價值取捨及資源衝突。", "提出可比較的選擇，確認有權拍板者並依需要升級處理。", "留下決策理由、責任與下一步，追蹤各方是否能依約執行。"], "example": "虛構示例：工程無法一次改完整流程，你提出分期方案及必要體驗底線，由 PM 確認範圍、工程承接，再追蹤執行。共識是理解並履行決策，不要求所有人最喜歡同一方案。"}, {"question": "最後主管不採納我的專業建議，算我無法協調嗎？「形成共識」會不會被評成不能有異議？遇到 BU 利益衝突，我有沒有升級協助的管道？", "actions": ["釐清各方目標、限制與未被說明的分歧。", "比較可行選項，確認決策者及保留異議。", "記錄責任與後續動作，超出權責時升級處理。"], "example": "虛構示例：兩個 BU 對共同登入改動順序有異議；設計師整理限制和選項，經指定決策者拍板分階段做，保留異議並跟進責任。"}], "C7": [{"actions": ["拆出設計、討論、修改與驗收所需時間，確認交付日。", "發現需求或進度變動時提前通知，說明可調整的範圍。", "交付必要稿件與狀態說明，追蹤驗收中自己負責的修正。"], "example": "虛構示例：預計週五交付，週三發現需補錯誤狀態，當天同步影響並約定延後次要動效。"}, {"question": "管理排程是否包含工程工時與發布日期？插單或工程延期如何分責任？3 分重排和 4 分協調期限差在哪裡？", "actions": ["列出設計交付、估時前提、外部依賴與驗收時點。", "變動時明確說明對原工作影響，提出可行選項交由權責人確認。", "交付後追蹤驗收問題，區分本人可控與外部限制。"], "example": "虛構示例：臨時插單會擠壓原定測試。你提出先交高風險流程、延後次要頁面的方案，說明品質代價並取得決策；保留調整紀錄，而不靠加班隱藏資源衝突。"}, {"question": "Sr. 沒有人力配置權，為何要管理領域資源？工程改排程造成延期怎麼評？", "actions": ["安排探索、討論、修正及驗收時間，列出工作需要誰提供哪些條件。", "風險確立後同步影響與可選調整，取得有權者的範圍或資源決策。", "追蹤交付、實作差異及驗收處理，保留原安排與必要變更的理由。"], "example": "虛構示例：工程插單影響原排程，你提出影響評估及改排選擇，由決策者確認新里程碑，持續驗收。用調整與處理紀錄評估責任，不只用最初日期是否達成判分。"}, {"question": "我沒有管理權，怎麼排除人力不足的跨團隊瓶頸？所有產品都準時上線才算達標嗎？3 分就必須改善機制，會不會逼我先建立流程而不是解決問題？", "actions": ["列跨團隊的設計依賴、交付及驗收責任。", "遇變動提出順序或範圍調整，及早升級無權處理的阻礙。", "追蹤落地及重工變化，整理有效交接做法。"], "example": "虛構示例：兩款產品的設計規格反覆等待確認；設計師釐清交接及驗收窗口，試改順序，追蹤等待和規格遺漏是否減少。"}], "C8": [{"actions": ["選一段適合工具協助的工作，說明要協助產出、檢查或驗證什麼。", "提供產品情境與限制，逐項檢查文字、畫面與互動結果。", "修正後再交付，說明原型能做什麼、哪些仍是模擬。"], "example": "虛構示例：用 AI 產生互動草稿，發現失敗狀態被省略，補齊後才拿去討論，並標示資料是假資料。"}, {"question": "必須用 AI 或寫程式才算達標嗎？完整原型做到什麼深度？工具不適合任務時如何評？", "actions": ["先寫原型要回答的問題，再選工具與擬真程度。", "標示模擬資料、模擬邏輯及可運作部分，檢查關鍵狀態與輸出。", "走完測試任務，確認後續協作者如何使用與驗收。"], "example": "虛構示例：固定點擊原型無法觀察搜尋無結果時的行為。你用適當工具做可輸入的原型並明標模擬資料，修正 AI 生成的錯誤狀態後完成測試；不用因此承諾它可直接上線。"}, {"question": "可運作原型一定要自己寫程式嗎？非 AI 產品能否高分？原型變正式產品時誰驗收？", "actions": ["定義待驗證的關鍵操作及保真程度，分清可模擬部分與必要的真實限制。", "選工具完成可測試體驗，實際檢查並修正輸出，留下限制與測試結果。", "與工程交接已完成、未實作及需驗收的部分；程式提交或正式部署只依事前約定責任執行。"], "example": "虛構示例：你用互動工具與模擬資料完成方案選擇原型，使用者可實際完成待驗證任務；附真實／模擬清單、輸出修正及工程承接說明。工具選擇合理即可，不要求每件任務自行寫正式程式。"}, {"question": "我要公司统一用一個 AI 工具才算跨團隊影響嗎？有些問題用低保真原型就夠，是否一定要寫程式才能拿高分？「效率與品質改善」每次一定同時上升嗎？", "actions": ["挑一個反覆耗時或容易誤判的步驟，比較工具和原做法。", "選足以回答問題的原型深度，檢查錯誤並約定承接。", "讓合作團隊試用，記錄投入、品質及維護成本。"], "example": "虛構示例：合作團隊改用 AI 製作互動原型；設計師比較修正與承接成本，發現部分情境用既有元件更快，調整選用方式並追蹤品質。"}], "C9": [{"actions": ["先查既有元件與使用範例，確認版本及適用條件。", "依規則命名與使用變體，避免無理由複製新元件。", "遇到缺口時附情境與畫面回報，等待負責人確認。"], "example": "虛構示例：收藏狀態需要第三種按鈕樣式時，先確認現有變體能否表達，再將缺口整理給元件負責人。"}, {"question": "沒有正式設計系統要從哪裡做？元件夠用不必擴充，是否仍可達標？未獲准合併或他人沒採用怎麼評？", "actions": ["交付前查既有規則，先判斷可否直接使用。", "需要變動時寫出缺口、用途、狀態與適用邊界，找相關負責人確認。", "觀察後續任務使用情況，修正不易理解或不適用內容。"], "example": "虛構示例：不同表單重複出現錯誤提示。你整理提示位置與文字原則，在下一個表單任務使用並依回饋修正；規則與兩次交付可當證據，不必先建立完整 Design System。"}, {"question": "需要自己維護整套 Design System 才符合期待嗎？沿用並修好現有資產算不算貢獻？", "actions": ["從反覆問題找重用機會，優先檢查現有資產並說明必要擴充理由。", "補齊情境、狀態、使用限制、工程對應及維護責任。", "在後續任務追蹤採用與缺口，確認能減少哪些重工或不一致。"], "example": "虛構示例：你補足既有表單元件的錯誤狀態，與工程對齊並追蹤後續功能採用。C9 用實際重用、回報與維護紀錄評估，不只看新增多少元件。"}, {"question": "是不是所有產品都要共用一套 Design System？「治理」會不會要求我變成專職系統管理員？我證明不值得共用、保留產品差異，也算專業判斷嗎？", "actions": ["比較共用元件、共用原則和保持分開的成本。", "選有實際收益的內容投入使用，約定例外與維護人。", "觀察後續重用、擴充及設計與實作是否同步。"], "example": "虛構示例：多產品反覆重做價格資訊；設計師共用資訊規則、保留不同排版，約定更新者，確認後續任務可自行延伸。"}], "C10": [{"actions": ["在討論中說明自己為何這樣設計，以及仍不確定的地方。", "把收到的具體回饋應用到目前或下一件工作。", "用簡短前後對照分享學到的判斷與限制。"], "example": "虛構示例：修正按鈕層級後分享前後差異，說明如何分辨主要與次要操作，讓同儕能參考。"}, {"question": "事業單位只有我一位設計師，專業指導如何評？3 分和 4 分建議有何差別？對方沒採用建議是否等於我表現差？", "actions": ["參與正常工作內的審查或跨事業交流，先了解對方問題與限制。", "提供具體觀察、理由及可執行方向，邀請對方比較取捨。", "跟進對方如何應用，留下改變或仍需支持的部分。"], "example": "虛構示例：跨事業同儕詢問表單錯誤提示。你解釋提示時機與回復方式，讓對方比較兩種方案並自行修改；後續設計及對方說明的理由可當證據，不要求正式帶人。"}, {"question": "我是事業群唯一設計師，沒有新人或部屬，怎麼展現專業指導？為何 5 分限定多位同儕？", "actions": ["了解對方原本如何判斷，指出關鍵依據及可比較選擇。", "讓對方自行修改並說明理由，依其卡住之處調整回饋方式。", "追蹤新情境能否獨立應用；沒有機會時由主管安排同儕審查或跨群合作並先標未觀察。"], "example": "虛構示例：跨群審查時，你協助同儕辨識流程例外並說明判斷方法；後續同儕自行補齊另一功能。留下討論與後續應用，註明同儕自己的貢獻，不以帶人數或授課數代替成長證據。"}, {"question": "我在 BU 沒有其他設計師，誰安排跨團隊指導時間？一定要辦課程嗎？他人成長受多方影響，怎麼確認是我的貢獻？3 分已是持續更好決策，4 分只是追蹤改變，看起來更低。", "actions": ["與主管安排真實的跨團隊審查或共作機會。", "請對方先說明判斷，再回饋理由、選項和適用邊界。", "在下一個不同任務觀察對方如何獨立應用及需要多少協助。"], "example": "虛構示例：跨團隊審查中，同儕只按個人偏好選方案；設計師示範依任務及限制比較，下個新案例由對方獨立說明取捨。"}]};const DISCUSSION={"common_rules": [{"title": "這是一份角色討論後的修訂建議", "text": "UIUX 主管、Md.、Sr.、Principal 均為模擬角色，沒有訪談真實同仁，也不代表公司已通過制度。逐項評分已整合設計師提案、主管回應與第二輪複核，供 Monica 和主管討論。"}, {"title": "自主包括知道何時協作", "text": "3 分包含主動釐清、自查、正常審查，以及向 PM 確認目標、向工程確認可行性。1／2 分以前期已約定責任、合理機會與必要支持為前提；2 分要指出哪個本階應承擔的判斷反覆由他人代做，不能把正常諮詢算成能力不足。Jr. 的問題定義與複雜取捨本來就可由他人協助。"}, {"title": "3／4／5 分如何區分", "text": "3 分是持續完成本階責任；4 分是在本階較難的情境中，以可辨識的額外判斷改善原有問題；5 分是在不同後續情境持續顯著有效，影響能延續。主動、完整、文件較多不能單獨區分分數。4／5 分不要求先完成下一職階全部責任，也不要求每項另外建立制度。"}, {"title": "先約定觀察期間，避免以單次事件定級", "text": "評估前約定觀察期間、本期責任與支持條件，綜合期間內可觀察的判斷、行動和結果判分。一次正常修正或偶發失誤不直接判為 1／2 分；持續、反覆或重大責任落差須以具體證據及已提供支持說明，不可只憑印象。"}, {"title": "以實際任務限定完整的範圍", "text": "任務開始約定使用者、起點與終點、責任邊界、相關平台及必要品質。完整是涵蓋適用情境，不要求每案都有跨平台、多角色或所有狀態。跨範圍風險仍須辨識、說明並找到後續負責人。"}, {"title": "主導與拍板分開", "text": "設計師主導專業工作，是提出問題與選項、邀集相關角色、追蹤決策與落地；資源、優先序、發布與停止投入由約定有權者確認。提案不被採納或決策遲未回覆時，評本人判斷、及時升級及跟進，不要求越權；尚未發生的採用或效果不能列成已完成。"}, {"title": "依證據能回答的問題評量", "text": "上線前測試、可運作原型及上線後資料都可作證據，但只能支持各自能回答的問題。原型可證明流程理解或操作行為，不能直接證明正式轉換、留存或營收。推翻假設、停止無效方案也可呈現有效判斷；正向數字不自動高分，前後變化不直接當作因果。"}, {"title": "缺少機會要有補足安排", "text": "缺少任務、資料權限、工程支援或合理交流機會時，記錄缺哪段證據、已完成的行動、替代方式、支持者與檢視時間。若不足以判定整項則標未觀察；已有部分證據應保留，不能把模擬成果當真實成果補分。主管要在正常工作內安排可觀察的機會，避免長期等待或期末突然加要求。"}, {"title": "同案可支持多項，但要說清各項貢獻", "text": "每項分別寫出情境與本人責任、判斷與行動、結果及限制。同一份原型或測試可被多項引用，必須指出不同的能力證據；不能因單案上線就讓十項一起高分。團隊成果、他人成長及外部因素都要與本人的貢獻分開說明。"}, {"title": "跨事業群使用相同共同標準", "text": "各事業單位與 x-lab 可用不同產品、階段與任務提供證據，評分仍用同一套職階責任與共同職能。探索任務可用可靠的學習及投入決策呈現成果，成熟產品可用改善與採用呈現成果；不恢復事業深化模組。"}, {"title": "工具選擇看目的與品質", "text": "C8 可以選擇 AI 或非 AI 工具，原型深度由問題與風險決定。必須能判斷適用性、檢查輸出並說明模擬限制；不以使用量、工具數或程式碼行數評分。效率比較包含修正、交接與維護成本；必要品質不能因速度而省略。正式程式提交與部署只依事前授權。"}, {"title": "專業指導由真實工作觀察", "text": "C10 不要求部屬、正式課程或固定人數。單人 BU 與 x-lab 由主管安排正常工作內的跨群審查、共作或有設計判斷需求的合作。Md. 看有依據的可行回饋；Sr. 看引導與追蹤；Principal 看跨團隊的判斷改善及延續。不能把對方沒採納建議直接當成指導失敗。"}, {"title": "保留現行計算，晉升另評", "text": "分數仍依總分 ÷（認列項目數 × 5）計算，80%／60%／40% 是同職階內的表現落點。共同職能共 10 項，未完整時顯示已評覆蓋與暫計狀態。晉升另看是否持續展現下一階責任；觀察期間、未觀察的正式認列與校準流程仍待公司定案。"}], "items": {"C1": {"md_reply": "不必重做已充分說明的 PM 問題定義。你要確認現有依據、任務與未知，再處理必要的方案取捨。3 分含一般釐清；4 分要指出原需求遺漏的衝突或錯誤假設，以及因此改善的決策。合理提案未採用仍可評判斷，但不能宣稱避免的投入已實現。", "sr_reply": "同意把優先序與 MVP 改成提出比較與建議、由指定決策者確認。你要辨識機會並承擔專業判斷，PM 是否接受不是單一評分標準；未接受時留下理由、風險及重新檢視條件。4 分須有處理競爭機會或矛盾證據的額外判斷，不能只因案子大。", "principal_reply": "同意。保留差異、分階段處理或停止整合，都可以是有根據的專業成果。3 分是界定實際共同問題與比較可行選項；4 分是在重要目標衝突或高度不確定時，補足關鍵依據而讓決策可執行；不要求每案產出新制度。", "decision": "採用三位角色的改稿；補修 Jr. 2／3／4 分，避免把主管應提供的問題背景當成 Jr. 的能力缺陷，也把正常確認矛盾留在 3 分。Principal 1 分補明反覆忽略已知影響的前提。 第二輪追加：『不同領域決策』易被誤讀為必須跨多個領域，需保留 Sr. 的責任範圍。", "boundary": "C1 看選擇解決什麼、為何採用某個方向；C4 看問題證據是否可信，C5 看方案如何驗證，C6 看分歧與決策責任如何收斂。用決策紀錄時，這項標出你改變的問題理解與取捨理由。", "score_changes": [{"role": "jr", "score": 2, "text": "在目標、範圍與必要背景已說明後，仍常漏看任務限制或無法說明自己方案的基本理由，需他人反覆代為整理；不包含正常的背景確認與複雜取捨協助。", "reason": "Jr. 不負責獨立建立完整問題定義。"}, {"role": "jr", "score": 3, "text": "在明確目標與範圍下，說明使用對象、任務目標與限制，自行選擇局部設計並說明理由；遇矛盾、不明處或複雜取捨時，主動提出並與負責人確認。", "reason": "把正常主動確認列為達標，並交代局部判斷責任。"}, {"role": "jr", "score": 4, "text": "在任務內辨識原說明未涵蓋的衝突，提出有理由的局部替代方案，經確認後修正設計，能指出因此避免的遺漏或不必要工作。", "reason": "以額外發現、可行選擇及實際改變區分 3 分。"}, {"role": "principal", "score": 1, "text": "在跨產品影響與必要背景已說明後，仍反覆僅以單一產品目標提案，忽略已知關鍵限制與其他產品代價，導致問題與取捨需他人重新建立。", "reason": "避免一次正常補充釐清便被視為不符期待。"}]}, "C2": {"md_reply": "是，正常自查就是 3 分。只負責 App 時，以任務所需尺寸與內容評，不必另做 Web。4 分看高密度資訊、特殊內容或規則衝突下，你如何找到核心呈現問題，並用觀察或驗收說明改善；單純修齊常見錯誤不足以支持超標。", "sr_reply": "使用成熟系統也能達標或高分。3 分改為處理複雜資訊並依適用品質要求審查；4 分看相互衝突的限制如何被解開，以及反覆理解問題是否改善。沒有必要時不新增規範，裝置也只看任務適用範圍。", "principal_reply": "共同品質不等於畫面一致。你可以統一重要資訊的辨識底線，同時保留各產品的品牌、密度與情境差異。3 分有可操作示例與檢查；4 分需解決限制衝突且呈現改善；元件庫與正式審查制度都不是本項門票。", "decision": "採納以呈現品質與使用者理解區分分數；將 Jr. 自查實際內容與尺寸納入 3 分，4 分改看任務中較難呈現衝突的處理與結果。", "boundary": "C2 看資訊是否看得清楚、主次能否辨識、實作是否達到必要品質；C3 看動作及狀態如何轉換，C9 看做法是否被後續重用。前後畫面在本項須指出閱讀或辨識的具體差異。", "score_changes": [{"role": "jr", "score": 3, "text": "在明確任務內維持排版、層級、對比、對齊與一致性；用實際需要的內容、尺寸與狀態自查，修正基本品質問題並記錄實作差異。", "reason": "例行自查不應只在 4 分出現。"}, {"role": "jr", "score": 4, "text": "在長內容、資訊擁擠或既有版型限制等任務情境中，辨識難讀的原因並提出可行調整，以前後檢查或使用回饋確認關鍵內容更易辨識。", "reason": "4 分應包含較難情境、判斷與可辨識改善。"}, {"role": "sr", "score": 3, "text": "自主處理領域內複雜資訊與歷史呈現限制，依明確品質依據完成設計及實作審查，確認重要資訊在任務適用的內容量、狀態與裝置下清楚一致。", "reason": "不要求未涉及的平台或裝置。"}]}, "C3": {"md_reply": "完整旅程以事前約定問題的起訖為界，涵蓋實際相關的成功、失敗、離開與回復情境；不必一次改全產品。跨平台、權限與多角色是適用時要檢查的條件。C3 評操作方案是否完整；C5 另看驗證方法與結果怎麼支持下一步。", "sr_reply": "複雜度可以來自狀態依賴、歷史限制或跨功能影響，不必湊跨平台與多角色。若任務本身包含 AI 功能，不確定輸出、錯誤修正與可行回復屬基本互動完整性，應依該任務放進 3 分要求；不是用了 AI 才有高分。", "principal_reply": "同意，多產品反覆出現的共同互動問題可以成立，即使它們沒有串接旅程。你要交代共通與差異、適用狀態及改善方式，不需要發明使用者沒有需要的跨產品流程。4 分看版本與技術相依下，過渡和最終解法是否仍完整可用。", "decision": "採納三角色改稿。Jr. 3 分涵蓋任務適用的狀態及相鄰步驟檢查，4 分改為發現並解開較不明顯的局部互動衝突；C8 定義中的 AI 產品失敗體驗移到本項適用範圍說明。", "boundary": "C3 看路徑、狀態、必要控制與失敗回復；C2 看呈現是否易懂，C5 看測試設計及判讀，C8 看如何選工具製作可信原型。相同測試在本項用來說明哪段互動被修好。", "score_changes": [{"role": "jr", "score": 3, "text": "依已確認的任務範圍設計主要流程，補齊適用的空白、載入、錯誤、完成及回復狀態；走查前後步驟，遇跨範圍依賴時提出並確認處理方式。", "reason": "適用情境完整與基本走查是達標責任。"}, {"role": "jr", "score": 4, "text": "發現任務內較不明顯的狀態衝突或卡關原因，提出較簡潔且可回復的局部互動，經走查或測試確認改善，並檢查未造成相鄰步驟的新問題。", "reason": "以額外互動判斷及改善區分例行補狀態。"}]}, "C4": {"md_reply": "不以研究方法數或是否會 SQL 評分。你先用可取得且與問題相稱的證據，說清來源、情境、限制與推論；權限不足時提出缺口及替代方式。4 分看矛盾證據如何被查證並改變理解，不能只因多一個來源。", "sr_reply": "研究員、預算與權限由主管協助確認，你負責提出最影響領域方向的問題、可行方法及證據限制。有資料卻忽略關鍵反例要評能力；沒有合理查證機會則保留已做工作並補觀察，不能把未知硬寫成結論。C9 不以研究文件數量認列本項。", "principal_reply": "你要判斷哪些洞察能共用、哪些必須保留差異；跨 BU 整理的結論更要寫明適用範圍。3 分是可靠判讀與必要查證；4 分是處理矛盾或稀少資料並修正重要假設。建立研究流程不是必要交付，也不能代替實際洞察。", "decision": "採用證據適配與推論品質的評分。補修 Sr. 2 分的代為判斷用語；Jr. 3／4 分分清基本事實整理與發現矛盾後的具體查核。", "boundary": "C4 回答使用者遇到什麼問題、根據可信到哪裡；C1 用這些理解選擇方向，C5 檢查方案假設，C9 評後續能否重用洞察。這項證據要展示來源、限制及理解如何改變。", "score_changes": [{"role": "jr", "score": 3, "text": "實際使用負責的產品與流程，理解所需領域基礎；整理取得的回饋或資料，說明來源與情境，分清觀察事實、個人推測及待確認處。", "reason": "讓基本證據整理與不確定性說明具體可做。"}, {"role": "jr", "score": 4, "text": "發現回饋與實際操作不一致或被忽略的線索，進行任務範圍內可行的比對，說明仍未知的部分，讓原先問題描述獲得具體修正。", "reason": "4 分須有額外發現和理解變更，不只是主動整理。"}, {"role": "sr", "score": 2, "text": "能收集回饋或提出研究題目，但關鍵問題優先序、方法適配及證據限制經常需他人代為判斷，結論尚不足以支持領域方向。", "reason": "正常諮詢研究或數據夥伴不等於低於期待。"}]}, "C5": {"md_reply": "未上線或沒有量測權限不直接低分。原型可以支持理解與操作等它能回答的部分，正式產品效果則繼續標待觀察。推翻原假設是可用成果。4 分要求檢查合理替代解釋及補驗證，不要求每案證明完整因果，也不能把前後變化當成設計造成。", "sr_reply": "不強制 A/B Test；依風險、可得流量與階段選足以支持當前決策的方法。你排假設、解讀限制並提出下一步，停止投入由有權者確認。4 分的資源限制情境還要呈現方法如何有效降低不確定性或避免無效工作，不能僅因流量小就算超標。", "principal_reply": "各產品可有不同成功條件，共同的是對要驗證什麼、如何判讀和何時決策有清楚約定。接受 3 分為本次驗證與決策、5 分為後續團隊能處理新未知。修改 4 分避免直接要求你自行改資源，仍要有可追溯的決策或投入變更。", "decision": "採用三位角色主張；3 分保留結果判讀與下一步，不因完成計畫就視為驗證完成。Jr. 2 分不再把逐步方法指導本身當落差，3／4 分區分依約參與與主動查明結果落差。 第二輪追加：與主管『不因完成計畫就視為驗證完成』的原則一致；保留合理替代驗證，同時要求實際結果，不把無法量測的成效冒充已驗證。 第二輪追加：原『及時修正投入』仍可能被解讀成自行決定資源，需與主導和拍板分開的規則一致。 第二輪追加：有效驗證可能需增加合理成本，也可能支持維持原方向。移除必須降成本或改變原投入的隱含要求，保留較難情境、有效釐清未知與實際決策證據，並維持有權者拍板的界線。 最後對齊：主管最後回應指出，Sr. 也應允許困難驗證後支持維持原方向，與 Principal 的共同原則一致。", "boundary": "C5 看假設、判斷條件、方法適配、結果限制及下一步；C4 看用戶問題證據，C3 看被改善的互動，C7 看後續如何排入工作。沒有正式結果時清楚列出已驗證與尚不能判定的部分。", "score_changes": [{"role": "jr", " 不能直接扣分。", "sr_reply": "沿用並完善現有資產是有效貢獻，不需要自己管理整套 Design System。3 分要讓領域後續工作可承接，4 分處理採用或工程落差並有改善，5 分看後續任務能持續使用與演進。維護責任由相關人約定，不全落在設計師一人身上。", "principal_reply": "同意不強制單一 Design System。可以共用資訊原則、模式或案例，保留不同元件實作。判斷不值得共用也是專業證據；本項仍要交代可重用的內容或避免重複錯誤的邊界如何被實際使用，不能只靠否決提案宣稱已減少長期重工。", "decision": "採用實際重用與維護的評分，明確接受保持差異。Jr. 3 分加入適用性及缺口回報，4 分區分對反覆誤用的局部改善；不要求各階為了職能分數新建系統。", "boundary": "C9 看後續任務能否找到、理解、正確重用與更新資產；C2／C3 看當次畫面及互動品質，C10 看他人判斷能力提升。文件存在、瀏覽次數及發布公告不等同真正採用。", "score_changes": [{"role": "jr", "score": 3, "text": "正確使用任務適用的既有元件、規則與命名，檢查變體及狀態；不適用時清楚回報缺口，留下其他協作者能理解的交付與例外說明。", "reason": "適用性檢查和基本可理解交付是正常責任。"}, {"role": "jr", "score": 4, "text": "發現局部元件、命名或說明容易被反覆誤用，提出具體補充並與負責人確認，經後續使用檢查能減少同類理解落差或重做。", "reason": "4 分以額外重用改善區分例行使用與回報。"}]}, "C10": {"md_reply": "沒有部屬也能評，對象可為同儕、跨 BU 設計師或需要設計判斷的合作夥伴。3 分是貼合對方情境、說清理由的可行回饋；4 分多了協助理解選項與跟進嘗試。對方未採用時先理解原因，不直接算失敗；沒有合理機會由主管補安排。", "sr_reply": "刪除固定帶人數。你需要在已安排的審查或合作中引導判斷，觀察後續應用；4 分看調整回饋後具體減少對方的重複困難，5 分看新情境中的持續自主與方法延續。單人 BU 與 x-lab 的跨群機會應排入正常工作，不要求下班另找人練習。", "principal_reply": "不一定辦課程。3 分可用真實跨團隊審查、共作或案例引導；4 分要看到反覆能力缺口因適切指導而改善；5 分才看其他資深者也能調整方法、把判斷能力傳下去。記錄本人回饋、對方實際應用與其他影響，不把他人全部成長歸給你。", "decision": "採用三角色提出的分層。主管責任是安排可觀察的合作範圍、工作時間與支持；設計師責任是理解問題、提供專業回饋並追蹤適當成果。Jr. 不要求指導責任，其 3 分看分享與應用回饋，4 分看將學習轉成更可理解的案例並經討論修正。", "boundary": "C10 看專業說明或引導如何幫助自己及他人的判斷進步；C6 看共同決策能否執行，C9 看重用資產的品質。會議、課程、人數與受歡迎程度都不能單獨代表指導效果。", "score_changes": [{"role": "jr", "score": 3, "text": "在工作討論中分享自己的設計理由，確認回饋所指的問題與適用情境，將約定改善用在後續設計，並說明調整前後的差異。", "reason": "具體分享與確認修正屬基本學習責任。"}, {"role": "jr", "score": 4, "text": "將自己遇到的設計難點與修正整理成具體案例，說明判斷理由及適用邊界；依同儕疑問補充或修正說法，讓對方能理解並試用相關經驗。", "reason": "讓 4 分超出單純分享一次學習，仍不要求正式指導。"}]}}, "pending_decisions": ["10 項共同職能與舊版 12 項的整併是否正式採用，以及需不需要保留原項名稱或映射。", "評估期間、持續／多次的校準方式、評審角色及分歧處理；不於期末臨時設定案例數。", "未觀察、只有部分證據、因機會不足而無法完成全部評估時的正式計分與晉升認列。", "各專案優先序、MVP、成功指標、資源、發布與停止投入的決策者及升級窗口。", "單人 BU、x-lab 及跨團隊工作的可用時間、任務安排、資料與工程支持，由哪些主管負責提供。", "Product Builder 是否另有正式程式提交、整合或部署責任；若需要，應寫明適用職務、培訓支持及驗收條件。", "管理職的招募、人員配置、績效與培育制度另行定義，不作 IC 四階隱含要求。"], "manager_closing": "主管角色接受三位設計師第二輪提出的五條追修，並把「經驗證後維持原方向也可成立」同步寫入 Sr. C5 的 4 分。上述文字已整合進評分表；觀察期間、正式認列、實際授權與任務支持仍需 Monica 和主管定案。"};const RECHECK={"md": {"summary": "第二輪逐項複核後，主管已回答 Md. 對 3／4 分、正常協作、任務邊界、資源限制及跨事業機會的主要疑問，接受作為可試評的討論稿。唯一必要文字修訂是 C5 的 3 分：明確要求實際完成可行驗證與結果判讀，避免把只記錄替代計畫誤讀為已達標。正式計分、觀察期間及機會安排仍需人類主管定案。", "items": {"C1": "接受。已明確不用重做 PM 充分建立的問題定義，3 分包括正常釐清，4 分須指出額外發現與實際改善。未採納仍可評判斷品質，但不能宣稱避免投入已實現，也不因提案被否決就自動扣分。", "C2": "接受。普通自查列入 3 分，4 分改看較難資訊呈現的判斷與可觀察改善；任務只涉及 App 時不需要補 Web 案例。與 C3／C9 的證據界線已清楚。", "C3": "接受。完整以約定起訖與適用情境為界；跨平台與多角色不再是每案必備清單。C3 評互動方案，C5 評驗證與判讀，同一測試需分別指出能力。", "C4": "接受。評證據是否適配與推論是否合理，不以來源數、SQL 或正式研究為門檻。缺資料時提出缺口與替代方式，4 分仍須有矛盾證據查證與理解改變。", "C5": "接受主管的原則，但原 Md. 3 分最後一句『記錄替代驗證及後續責任』可能讓只有計畫的人誤認已完成。建議直接改為執行可行的替代驗證、判讀取得結果，並將無法判定部分保留待觀察。負向結果、原型與因果限制的回答已足夠。", "C6": "接受。共識不等於人人同意，正常提請有權者確認不算依賴，外向與簡報風格不納入判分。3 分是理解與責任清楚，4 分是使較難分歧形成可執行安排。", "C7": "接受。已把自己的設計安排與工程人力、發布權分開；正常重排為 3 分，處理較複雜依賴並減少實際等待或重工為 4 分。保留外部因素紀錄，不以加班或準時單一結果評人。", "C8": "接受，包括主管修改的 Md. 1 分。新文字適用 AI 及其他工具，將『隱瞞』改為可觀察的『未揭露』，避免推測動機。原型深度、工具選擇、完整成本與正式上線權責均已回答。", "C9": "接受。沿用適用元件即可達標，不必為分數擴充系統；4 分須有後續使用與修正，可由自己的下一個真實任務提供證據。未獲系統負責人核准不能直接扣分，也不能把未發生的採用視為成果。", "C10": "接受。3 分的可行回饋、4 分的理解取捨與跟進、5 分的持續自主應用可區分。對象不限定部屬；單人 BU 的正常工作內交流由主管安排，未採用建議需了解原因而非直接判失敗。"}, "score_changes": [{"item": "C5", "score": 3, "text": "投入主要設計或實作前，確認關鍵假設、成敗訊號與可行驗證方式；完成可執行的驗證，依結果說明假設被支持到何種程度並提出下一步。上線或資料不可得時，以合適替代方式驗證可回答的部分，明列仍待觀察的部分及後續責任。", "reason": "與主管『不因完成計畫就視為驗證完成』的原則一致；保留合理替代驗證，同時要求實際結果，不把無法量測的成效冒充已驗證。"}], "action_changes": [], "unresolved": ["觀察期間、何謂持續表現，以及不同事業單位評分校準與分歧處理，須事前由實際主管定案。", "只有部分證據或長期未觀察時，正式認列項目數、整項分數與晉升如何處理，仍需制度決策；不能用暫時計分冒充完整達標。", "單人 BU、x-lab 或缺資料與工程支援的任務，須由實際主管指定支持者、正常工作內的機會與回顧時間。", "各專案對範圍、資源、優先序、發布與停止投入的決策者及升級窗口，須在真實工作啟動時具體約定。"]}, "sr": {"summary": "逐項複核後，主管已回答 Sr. 的主要疑問：正常協作不扣分、主導與拍板分開、證據依可支持範圍認列、單人事業群由主管安排機會，3／4／5 分也不再要求項項建立制度。接受主管對 C2 3 分、C4 2 分、C7 4 分的修訂。仍有三處文字需對齊共同規則：C1 5 分避免被讀成跨領域門檻，C5 4 分明示投入調整由有權者確認，C8 5 分應容許改善驗證品質而非必須縮短時間。其餘不再改寫；正式人事與授權細節仍需真人主管定案。", "items": {"C1": "接受問題判斷與正式拍板分開，也接受未採用提案需保留理由而不能宣稱成效。5 分『不同領域決策』仍可能被解讀為要跨多個領域，改成『同一責任領域內的不同決策』，保留 Sr. 與 Principal 的範圍界線。", "C2": "接受。主管新增『任務適用』，不再要求未涉及的平台；3 分是完整呈現與審查，4 分處理相互衝突的限制並改善理解，5 分看後續品質延續。使用成熟系統也能提供證據，無需新增規範。", "C3": "接受。複雜度可來自狀態依賴與歷史限制；適用的 AI 不確定輸出及失敗恢復已列為基本互動完整性。3 分完成相關流程，4 分解開交互衝突，5 分持續改善相關體驗，可操作且未強制跨平台。", "C4": "接受。主管將 2 分改成應負責的判斷『經常需他人代為判斷』，正常研究協作不再被誤判。無資料時需說明缺口及取得支持，不強迫產生結論；C4 判證據可靠度、C5 判驗證與下一步、C9 判重用，界線清楚。", "C5": "大致接受。A/B Test、上線及正向數字不是必選證據，結果限制與停止決策已有交代。但原 4 分仍寫『及時修正投入』，與有權者拍板的共同規則不夠一致，需直接在評分格補上決策確認與追蹤。", "C6": "接受。依約升級與追蹤是正常責任，無需保證對方給資源或接受方案。3 分釐清選擇及責任，4 分促成原本受阻的工作，5 分相關角色能延續釐清方法；不以外向、衝突強度或會議數評分。", "C7": "接受主管新 4 分。新文字同時要求有權者確認及實際減少等待、返工或品質遺漏，已比 3 分的正常安排和同步更清楚。工程延期與本人設計責任分開記錄，沒有暗示人力配置權。", "C8": "接受非 AI 工具及不同原型深度，正式程式責任需另行授權。仍需調整 5 分：原文強制『持續縮短時間』，但主管已認可高風險情境可以多花時間取得更可信結果；Sr. 也應能因驗證品質持續改善拿高分，且維持必要品質與完整成本證據。", "C9": "接受。沿用、修正及合理保留差異均可評，3 分看可承接，4 分看採用落差改善，5 分看後續持續演進。維護責任需共同約定，不要求 Sr. 一人管理整套系統。", "C10": "接受。已取消部屬與固定人數要求，並把單人 BU、x-lab 的機會排入正常工作。3 分引導並追蹤，4 分改善對方反覆卡住的判斷，5 分看新情境的自主與延續；他人成果仍需分清本人貢獻。"}, "score_changes": [{"item": "C1", "score": 5, "text": "在同一責任領域內的不同決策中，持續辨識被忽略的機會或風險，取捨有可追溯的成效，並讓其他相關工作改善問題或範圍判斷。", "reason": "『不同領域決策』易被誤讀為必須跨多個領域，需保留 Sr. 的責任範圍。"}, {"item": "C5", "score": 4, "text": "在時間、流量或資源限制下，設計足以支持當前決策的驗證並辨識競爭解釋；依結果促成有權者確認投入或方案的調整，追蹤變更，避免可確認的無效工作或重大風險。", "reason": "原『及時修正投入』仍可能被解讀成自行決定資源，需與主導和拍板分開的規則一致。"}, {"item": "C8", "score": 5, "text": "在不同問題中持續以合理成本取得可信驗證，改善驗證效率或品質並維持必要品質；相關團隊能採用其方法並確認收益，成本包含修正與承接，不以工具數量或程式行數判定。", "reason": "主管已認可效率或品質改善皆可成立；原文強制縮短時間，會排除投入更多時間取得更可信驗證的高品質工作。"}], "action_changes": [], "unresolved": ["真人主管需定案觀察期間、持續表現如何校準、部分證據與未觀察的正式計分及晉升認列；不可期末才追加要求。", "各專案需填明優先序、MVP、指標、資源、發布與停止投入的決策者及升級窗口。", "單人 BU、x-lab 的跨群審查及必要資料、工程支持，需由具名主管安排工作時間、支持者與檢視日期。", "若特定 Product Builder 職務要求正式程式提交或部署，需事前寫明適用範圍、授權、培訓與工程驗收；本次共同職能不自動新增該門檻。"]}, "principal": {"summary": "逐項複核後，主管已回答 Principal 的主要疑問：跨產品機會與授權由主管支持、正常協作不算能力不足、每項不必另建制度、3／4／5 分按當次責任、較難判斷及後續延續區分。C1 的低分前提及 C8 的效率／品質取捨修訂均接受。僅 C5 4 分仍隱含每次必須降成本且改變原投入，建議一處替換；其餘保留。共通規則須與評分表一起顯示，不能只放討論附錄。", "items": {"C1": "接受。保留差異或停止整合可作有效判斷；1 分新增已提供背景且反覆忽略的前提，避免把正常釐清算低分。3 分的共同問題決策與4分的衝突／未知處理已可區分。", "C2": "接受。不強制畫面統一、元件庫或新制度；3 分看可操作的品質示例與檢查，4 分看限制衝突如何解開及實際改善，5 分看後續自主判斷。", "C3": "接受。已回答互不串接產品如何提供證據，允許多產品共同互動問題。4 分以版本和技術相依下過渡、最終流程的完整性區分，不需發明跨產品旅程。", "C4": "接受。共用洞察需限定適用範圍，資料不足可記錄並補觀察；沒有強制研究流程、規模或方法數。3 分判讀與4分處理矛盾並改變假設可區分。", "C5": "仍需微調 4 分。授權界線已解決，但較低成本及調整不適當投入不應是唯一合格結果；高風險問題可能需增加合理驗證成本，也可能驗證後支持維持原方向。建議替換一條，仍要求較難情境、關鍵未知被釐清及可追溯決策。", "C6": "接受。有依據的異議、依约升級及提案未獲採納均可依行為評量；3 分的責任清楚與4分的困難分歧改善可區分，不再把全員同意當成果。", "C7": "接受。3 分限本人承擔的設計依賴及交付，不要求保證所有團隊準時；4 分看依賴衝突改善，5 分看後續方法延續，已分清 IC 與人力管理。", "C8": "接受主管對 5 分的替換。工具深度按目的，合理不用 AI 或多花時間提高可信度可成立；效率或品質改善須連同必要品質及完整成本判斷。", "C9": "接受。不要求單一 Design System 或本人維護全部資產；保留差異仍須有實際應用證據，避免只是否決共用方案便宣稱減少重工。與 C2／C3 的區界清楚。", "C10": "接受。不以課程、部屬或固定人數認列；主管提供正常工時內的合作機會。3 分引導與觀察、4 分新情境自主改善、5 分他人接續指導的證據已具體，且需區分本人貢獻與其他影響。"}, "score_changes": [{"item": "C5", "score": 4, "text": "在驗證成本高、產品互相影響或結果矛盾時，設計與風險相稱的驗證順序，取得足以釐清關鍵未知的結果；據此促成有權者確認擴大、維持、調整或停止的選擇，並追蹤決策與後續結果。", "reason": "有效驗證可能需增加合理成本，也可能支持維持原方向。移除必須降成本或改變原投入的隱含要求，保留較難情境、有效釐清未知與實際決策證據，並維持有權者拍板的界線。"}], "action_changes": [], "unresolved": ["由實際主管指定跨 BU 工作的協作範圍、正常工時、資料／工程支援、拍板與升級窗口；模擬主管回應不能當作已提供授權。", "評估觀察期間、持續／多次的校準、只有部分證據或缺任務機會時的正式認列與晉升處理，仍需公司定案。", "10 項共同職能及四個專業職階是否正式採用，以及 Product Builder 是否另有程式與發布責任，仍由 Monica 與實際主管確認。"]}};const DEFINITIONS={"C1": "理解使用者要完成的任務、產品希望達成的目標，以及業務與技術限制，據此釐清值得解決的問題、比較方案並做出取捨。這項職能看的是設計師能否說清楚為什麼做、優先做什麼，以及選擇或捨棄某個方向的理由；責任範圍隨職階從明確任務擴大到跨產品決策。", "C2": "運用視覺層級、排版、色彩、對比與版面配置，讓資訊清楚、易讀且符合產品風格，並在任務實際涉及的內容量、狀態與裝置下維持品質。這項職能評估資訊是否容易辨識，以及設計到實作的細節完成度；共用的呈現原則也應保留符合使用情境的產品差異。", "C3": "規劃使用者從開始到完成任務的操作路徑、資訊結構與互動回饋，涵蓋任務適用的主要流程、例外狀態及失敗回復方式。這項職能看流程是否合理、使用者是否理解目前狀態並能繼續操作。涉及 AI 功能時，不確定輸出、修正及替代路徑也屬完整性；跨產品可處理共同互動問題，不必強行串接彼此無關的產品。", "C4": "透過產品使用、領域知識、訪談、客服回饋、可用性觀察與數據，理解使用者的情境、需求與行為。這項職能評估如何選擇及判讀證據、辨識資料限制，並區分事實、假設與推論，讓團隊對問題有可靠的理解。", "C5": "將設計想解決的問題轉成可驗證的假設與判斷條件，選擇合適的測試或量測方式，根據結果提出維持、調整、擴大或停止的建議，並依授權取得決策。這項職能評估是否以證據確認方案支持到什麼程度，並把學習帶入下一步。驗證可在上線前或後進行；否定方案也是有效學習，原型結果則只能支持它確實驗證到的部分。", "C6": "讓不同角色理解設計目的、判斷依據、方案差異與取捨，透過傾聽、提問、簡報或書面討論，處理分歧並形成可執行的決策。這項職能看資訊與限制是否被理解、決策權及後續責任是否清楚；可以保留異議，也可以在超出權責時請有權者協助決定，不以人人同意或個人提案被採納作為達標條件。", "C7": "在約定責任內安排設計範圍、時程、優先順序與外部依賴，及早同步進度及風險，提供可供開發使用的交付內容，並參與驗收及追蹤。這項職能評估設計師能否在變動中提出可行調整、取得必要承諾並推進落地；人力配置與發布拍板依專案授權處理，評估時應區分本人行動與外部限制。", "C8": "依問題與驗證目的選擇 AI、原型及其他工具，提供情境與限制，檢查及修正輸出，將想法做成能回答問題的可討論、可測試或可承接成果。這項職能評估工具選擇、原型深度、品質及整體效率，也看是否說清模擬與可運作部分。可以依理由選用非 AI 工具；程式與上線責任另行約定，產品流程完整性仍由 C3 評量。", "C9": "判斷既有設計元件、規則、案例與方法是否適用，正確重用，並在反覆需求中整理或改善可持續使用的共同資產。這項職能看用途與限制是否清楚、規範與實作能否同步，以及後續使用和維護是否降低重工。資產可以是元件、原則或案例，不要求每件任務都新增元件，也不預設不同事業群必須共用同一套系統。", "C10": "透過分享、設計回饋、審查與指導，協助他人理解設計判斷、比較解法並逐步提升獨立解題能力。這項職能從 Jr. 的說明思路與應用回饋，擴大到資深職階讓同儕及跨團隊持續受益；評量具體應用與能力改變，不以直屬部屬、開課次數或建立培訓制度為必要條件。交流機會可在正常工作內跨事業群安排。"};const R={"C1": [["無法說明任務對象與目標，未確認矛盾便開始設計。", "在目標、範圍與必要背景已說明後，仍常漏看任務限制或無法說明自己方案的基本理由，需他人反覆代為整理；不包含正常的背景確認與複雜取捨協助。", "在明確目標與範圍下，說明使用對象、任務目標與限制，自行選擇局部設計並說明理由；遇矛盾、不明處或複雜取捨時，主動提出並與負責人確認。", "在任務內辨識原說明未涵蓋的衝突，提出有理由的局部替代方案，經確認後修正設計，能指出因此避免的遺漏或不必要工作。", "多次辨識交辦中未被注意的需求，提出可驗證方案，協助團隊修正任務方向。"], ["在已說明目標與限制並提供必要支持後，仍反覆直接將需求轉成畫面，無法說明方案要解決的問題或重要代價。", "能整理需求與提出方案，但關鍵假設、選項比較或取捨理由經常需他人代為判斷，尚無法完整承接本階問題。", "在已約定的產品問題內，獨立確認使用者任務、目標、限制與未知，比較必要的可行選項並說明推薦理由；超出範圍或授權時，帶著建議交由約定決策者確認。", "辨識原需求忽略的衝突或錯誤假設，以證據修正問題或範圍建議，避免可辨識的無效設計或重大重工，並交代最終選擇與剩餘風險。", "在不同產品問題中持續做出有效取捨，讓原本難以界定的需求形成可處理範圍；以實際案例說明避免的投入或改善，判斷做法可供同儕參考。"], ["在已提供必要背景與協助後，仍未辨識領域問題與關鍵限制，直接承接方案，取捨缺少依據而造成可避免的遺漏或重工。", "能提出領域機會，但問題證據、替代選擇或最小驗證範圍不完整，需他人主導收斂與取捨。", "主動辨識領域機會，說明問題、目標、證據與限制；提出有比較依據的優先順序及最小驗證範圍，與指定決策者確認取捨及下一步。", "面對資訊矛盾或多項機會競爭，能找出最影響決策的未知，提出替代選擇並推動取捨，避免可辨識的不必要投入或重大遺漏。", "在同一責任領域內的不同決策中，持續辨識被忽略的機會或風險，取捨有可追溯的成效，並讓其他相關工作改善問題或範圍判斷。"], ["在跨產品影響與必要背景已說明後，仍反覆僅以單一產品目標提案，忽略已知關鍵限制與其他產品代價，導致問題與取捨需他人重新建立。", "能指出共同問題，但共用或分開處理的理由、影響與可行選項不完整，需他人主導取捨。", "以各產品證據界定共同問題，比較共用、保留差異及分階段處理的選項，說明長短期代價，促成有責任人的決策。", "在多產品目標衝突或高度不確定時，補足關鍵證據並調整問題範圍，讓原本難以決定的共同問題形成可執行方案，結果可追溯。", "在後續不同情境中，其他團隊能使用並調整其判斷方法，自主處理新的共同取捨，且能指出避免錯誤投入或改善體驗的結果。"]], "C2": [["交付反覆出現層級、對齊、對比或可讀性錯誤，需他人重整。", "能完成基本版面，但細節不穩定，仍依賴他人指出常見問題。", "在明確任務內維持排版、層級、對比、對齊與一致性；用實際需要的內容、尺寸與狀態自查，修正基本品質問題並記錄實作差異。", "在長內容、資訊擁擠或既有版型限制等任務情境中，辨識難讀的原因並提出可行調整，以前後檢查或使用回饋確認關鍵內容更易辨識。", "多次在明確任務中提出細緻且合理的呈現改善，做法可供同儕參考。"], ["在適用品質要求已清楚且提供必要支持後，重要資訊仍反覆難以辨識或出現明顯呈現錯誤，影響所負責任務的使用。", "主要畫面可用，但任務涉及的內容長度、尺寸或狀態常需他人指出並重整，品質尚不穩定。", "在負責範圍內，獨立完成一致、易讀且主次明確的畫面，涵蓋實際需要的內容、尺寸與狀態；依品質要求自查，追蹤實作偏差的修正或取捨。", "在高資訊密度、特殊內容或既有規則衝突等情境，找出影響辨識的核心問題，提出可行呈現方式，並以使用觀察或前後驗收確認改善。", "持續解決本階較難的資訊呈現問題，讓使用者更容易辨識關鍵內容且實作品質穩定；整理可供相似任務使用的呈現理由與例子。"], ["在必要背景與協助下，仍未處理關鍵資訊層級或可讀性問題，設計與實作反覆出現影響理解的缺漏。", "能修正個別畫面，但複雜內容、歷史限制或實作品質仍需他人主導判斷與補齊。", "自主處理領域內複雜資訊與歷史呈現限制，依明確品質依據完成設計及實作審查，確認重要資訊在任務適用的內容量、狀態與裝置下清楚一致。", "在資訊密度、平台或既有風格等限制相互衝突時，找出可驗證的呈現解法，推進實作並改善原本反覆出現的理解或品質問題。", "在不同複雜情境持續完成高品質呈現，其判斷與成果讓領域其他交付也提升可讀性及實作品質，且有採用或檢查結果可確認。"], ["提出的共同視覺方向忽略實際內容、裝置或產品差異，已造成可讀性或重要資訊辨識問題仍未修正。", "能發現多產品共同的呈現問題，但改善例子或適用邊界不清，需他人轉成可落地設計。", "針對共同呈現問題給出可操作的品質原則與設計示例，說明各產品必要差異，協調實作檢查並確認使用者能理解重要資訊。", "處理品牌、密集資訊、裝置或歷史限制之間的衝突，推動多產品改善，能以實作及用戶證據說明品質提升。", "後續不同產品或內容情境中，團隊能自主套用或調整品質判斷，反覆呈現問題減少，且仍保留合理差異。"]], "C3": [["只交付順利操作的主流程，關鍵狀態缺漏造成開發或使用阻礙。", "能補出常見狀態，但例外、返回或失敗回復仍需提醒。", "依已確認的任務範圍設計主要流程，補齊適用的空白、載入、錯誤、完成及回復狀態；走查前後步驟，遇跨範圍依賴時提出並確認處理方式。", "發現任務內較不明顯的狀態衝突或卡關原因，提出較簡潔且可回復的局部互動，經走查或測試確認改善，並檢查未造成相鄰步驟的新問題。", "能多次把局部互動做得完整且簡潔，提早避免使用者卡關或誤操作。"], ["在任務情境與必要支持已明確後，仍反覆漏掉關鍵路徑或回復方式，造成使用者卡關或規格無法執行。", "能設計主要路徑，但任務相關的例外、回復或角色差異經常需他人補齊，尚無法獨立掌握完整流程。", "獨立規劃約定問題從起點到終點的流程，涵蓋適用的主要路徑、例外、回復與角色差異，並與工程確認可行性；使用者能理解目前狀態及下一步。", "在多條路徑、角色或既有限制互相影響時，找出卡關或多餘步驟並簡化操作；保留必要控制與回復方式，確認沒有把問題轉移到其他相關路徑。", "在不同完整問題中持續簡化原本難以完成的操作，兼顧例外與依賴，留下可供類似問題採用的互動判斷與驗證結果。"], ["在必要協助下仍未掌握關鍵流程依賴，主要狀態或失敗回復缺漏，局部改動反覆造成相鄰流程問題。", "能整理主流程，但相互影響的狀態、歷史限制或簡化方案仍需他人主導補齊，驗證及修正不完整。", "自主梳理領域內相互影響的流程及限制，設計完整且可理解的關鍵路徑、狀態與失敗回復；確認局部改動不破壞相鄰流程，並完成驗證及必要修正。", "面對多角色、跨功能或歷史限制造成的交互衝突，提出比既有方案更簡潔且完整的流程，推進關鍵改動並確認原本阻礙獲得改善。", "在不同複雜情境持續解決難以處理的流程問題，相關任務的完成與錯誤回復有持續改善，其他交付也能運用其互動判斷避免相同問題。"], ["在已承擔的共同互動問題中，未確認角色、資料或狀態如何銜接，所提方案造成使用斷點或無法回復。", "能盤點斷點或重複問題，但缺少關鍵狀態與適用邊界，需他人完成解法。", "釐清跨產品旅程或多產品共同互動問題，完整設計銜接、例外與失敗回復，說明需一致及可不同之處，與合作方驗證並推進落地。", "在多產品版本、技術及角色限制互相牽動時，提出可分階段完成的互動解法，驗證過渡與最終流程均可使用，改善原有斷點。", "團隊在後續新的旅程或例外情境中能自主調整共同互動解法，仍維持完整回復路徑，持續減少跨產品或重複使用障礙。"]], "C4": [["未理解產品或用戶情境，把個人猜測當成用戶事實。", "會整理回饋，但難區分事實、推論與代表性，需他人校正。", "實際使用負責的產品與流程，理解所需領域基礎；整理取得的回饋或資料，說明來源與情境，分清觀察事實、個人推測及待確認處。", "發現回饋與實際操作不一致或被忽略的線索，進行任務範圍內可行的比對，說明仍未知的部分，讓原先問題描述獲得具體修正。", "在多次任務中辨識被忽略的用戶線索，協助團隊修正對問題的理解。"], ["在可取得相關資料並有必要支持的情況下，仍反覆把猜測當成事實，或用與問題無關的資料支持設計，未說明限制。", "能收集並整理資料，但來源適用性、觀察與推論的區分或設計結論經常需他人校正。", "依問題選擇足夠的證據，獨立整理使用情境與需求；區分觀察、推論與未知，交代來源、適用範圍及限制，讓證據支持相應設計判斷。", "面對矛盾或容易誤判的證據，提出可能原因、確認最影響決策的缺口，安排可行補充查證，據此修正對使用者問題的理解。", "持續在不同問題中處理不完整或相互衝突的線索，以適切查證修正錯誤假設，讓團隊有更可靠的問題理解；留下可供後續查核的證據與限制。"], ["忽略已知證據限制或關鍵反例，將個人推測當成用戶事實，使領域方向建立在無法支持的結論上。", "能收集回饋或提出研究題目，但關鍵問題優先序、方法適配及證據限制經常需他人代為判斷，結論尚不足以支持領域方向。", "找出最影響領域方向的研究問題，選擇可支持判斷的方法及資料，交叉檢查來源、代表性與限制，區分事實與推論並修正問題理解。", "面對互相矛盾或難以取得的證據，找出關鍵差異與缺口，以可行補充方法降低不確定性，促成領域判斷的具體調整。", "持續揭露原有觀點未能解釋的用戶問題，洞察經後續驗證、應用或修正，使多項領域決策更可靠。"], ["將單一產品或不適用樣本的結論直接推廣到其他產品，忽略已知矛盾或限制，造成共同判斷失真。", "能整理共通線索，但無法判斷差異、可信程度或下一個需補的證據，需他人主導研究判斷。", "交叉判讀不同產品的用戶證據，區分可共用洞察與必要差異，針對最影響決策的缺口安排可行查證，讓團隊理解結論及限制。", "面對來源矛盾或少量資料，找出可能解釋並安排相稱的查證，修正重要跨產品假設，能追溯對方向或範圍的影響。", "後續團隊能自主判斷既有洞察何時可用、何時需補新證據，避免重複查證或不當推論，相關決策持續受益。"]], "C5": [["無法說明如何知道設計有用，也未依測試回饋修正。", "在測試目的與記錄方式已示範後，仍常漏記關鍵觀察或無法把已確認的回饋轉成修正，需反覆提醒才能完成；不包含本階正常需要的方法與結果解讀指導。", "理解任務的成功條件，在方法與判讀協助下參與驗證，按約定記錄觀察、分清結果與猜測，完成確認過的設計修正並追蹤待補部分。", "在參與驗證時辨識預期與實際操作的落差，提出有依據的原因或後續檢查建議，與負責人確認後完成修正或補查，讓原本未釐清的問題更明確。", "多次發現預期與使用結果的差距，提出可執行的後續驗證建議。"], ["在可安排驗證且提供必要支持後，仍反覆無法說明要確認什麼，或忽略可取得的相反結果便宣稱方案有效。", "有測試或指標，但與關鍵假設的關聯、方法限制或下一步判斷經常需他人代為建立。", "投入主要設計或實作前，確認關鍵假設、成敗訊號與可行驗證方式；完成可執行的驗證，依結果說明假設被支持到何種程度並提出下一步。上線或資料不可得時，以合適替代方式驗證可回答的部分，明列仍待觀察的部分及後續責任。", "面對結果不符預期或訊號不明確時，檢查方法限制與合理的其他解釋，提出能降低關鍵不確定性的下一步，促成有依據的迭代、暫緩或停止建議。", "在不同產品問題中持續以適當驗證減少無效投入，包含及早否定不成立的方案；能清楚交代每次如何從證據走到下一步，形成可靠的問題改善節奏。"], ["在有合理驗證機會及必要支持時，仍未建立可判讀的假設或條件，忽略結果限制而繼續推進，無法說明下一步依據。", "能辨識假設並安排測試，但風險順序、判斷條件或結果解讀不完整，需他人主導投入建議與後續追蹤。", "排定領域高風險假設的驗證順序，事前約定判斷條件、方法與結果責任人；解讀結果及限制，提出擴大、調整或停止建議，取得決策並追蹤下一步。", "在時間、流量或資源限制下，設計足以支持當前決策的驗證並辨識競爭解釋；依結果促成有權者確認擴大、維持、調整或停止的選擇，追蹤決策與後續結果，釐清關鍵未知並避免可確認的無效工作或重大風險。", "在不同重要決策中持續以有效驗證改變行動，後續追蹤支持其判斷，領域因而減少反覆試錯、避免無效投入或持續改善用戶結果。"], ["推動跨產品方案卻未確認關鍵假設與觀察方式，結果出現後仍無法說明學到什麼或下一步。", "有驗證安排，但各產品條件、判讀限制或後續決策人不清，需他人補齊才能使用結果。", "與合作產品約定最需驗證的假設、各自成功條件、觀察方式與決策時點；判讀結果並提出擴大、調整或停止的建議，追蹤決策。", "在驗證成本高、產品互相影響或結果矛盾時，設計與風險相稱的驗證順序，取得足以釐清關鍵未知的結果；據此促成有權者確認擴大、維持、調整或停止的選擇，並追蹤決策與後續結果。", "後續團隊能針對新的共同未知問題自行選擇驗證方式、判讀限制並調整投入，持續利用先前學習，且有實際決策與效果可追溯。"]], "C6": [["無法說明設計目的，資訊落差或未回應意見反覆造成重工。", "能說明畫面，但理由與待確認事項不清，討論需他人收斂。", "說清任務目標、設計理由與待確認處，依合作對象補足脈絡；確認自己理解回饋，記錄已決定事項、責任與下一步，遇超出範圍的爭議時提出協助需求。", "在任務討論中發現彼此未察覺的理解落差，透過具體例子、追問或選項比較釐清，經確認後減少可避免的往返或錯誤執行。", "多次透過清楚表達與追問，協助夥伴釐清需求並減少來回。"], ["在角色與必要資訊明確後，仍反覆未說明重要疑慮或誤解他人限制，造成決策與執行上的可避免落差。", "能說明設計，但理由、分歧或後續責任常不清楚，需他人代為整理本階問題的討論與決策。", "獨立說明問題、方案與取捨，理解相關角色需求與限制；釐清分歧並確認決策者，留下選擇、保留意見及後續責任，讓夥伴知道如何執行。", "在目標或限制衝突使討論反覆時，找出真正爭點，提供證據或可執行選項促成明確決策；原提案未被採納時，也能承接結果並追蹤風險。", "持續處理本階較複雜的跨角色分歧，讓夥伴清楚理解取捨、責任與後續行動，減少可避免的決策反覆；有效討論方式可供同儕使用。"], ["已知重要分歧卻未釐清或同步，無法說明選擇及責任，反覆造成決策誤解或可避免的停滯。", "能表達立場，但各方限制、替代選擇或拍板責任未收斂，需他人主導才能形成可執行的結論。", "釐清領域內不同角色的目標、限制與分歧，提出可比較選項；確認決策者、取捨、責任與下一步，無法在權責內解決時及時升級並追蹤。", "面對多方目標或相互依賴不一致，找出真正衝突並促成可履行的選擇，避免決策反覆或下游誤解，推進原本受阻的工作。", "在不同複雜協作中持續形成清楚且被履行的決策，相關角色也能沿用其釐清方法處理新分歧，減少對本人介入的依賴。"], ["重要跨團隊分歧未被說清或記錄，相關人不知道誰決定、誰執行，反覆造成可避免的誤解。", "能說明立場並找到部分支持，但未整合關鍵限制、決策權或下一步，需他人主導收斂。", "釐清各團隊目標、證據、限制與分歧，提供可比較選項，確認有權決策者、責任與後續動作，讓相關人理解最後取捨。", "在高張力或反覆卡關的跨產品議題中，使原本未被表達的限制可被討論，適時升級決策並形成能執行的安排，減少同類誤解或反覆。", "後續團隊能沿用並調整其分歧處理方法，即使本人未主持仍能揭露風險、找到決策者並履行約定，有多次實際案例。"]], "C7": [["未同步延誤或交付缺漏，影響他人排程與驗收。", "能完成部分交付，但估時、進度回報或規格仍需頻繁提醒。", "依明確範圍合理估時，預留必要討論與修正，主動同步進度及可知風險；交付可理解的規格、參與驗收，遇變動時提出影響與調整需求。", "在任務出現非例行變動或前後依賴時，提早辨識會卡住的部分，提出可行的拆分或順序調整，經確認後維持必要品質並減少可避免的等待或重工。", "多次穩定完成不同任務，主動改善交付方式以減少協作重工。"], ["在交付條件與支持已明確後，仍反覆未同步本人可知的延誤或重要缺漏，造成可避免的等待、重工或驗收問題。", "能完成個別交付，但設計範圍、依賴與風險處理不穩定；變動時經常需他人代為拆解並安排自己的工作。", "獨立安排所負責問題的設計、必要討論與驗收，確認依賴及交付條件；變動時及早說明範圍、品質與時程影響，提出可行重排並與相關負責人對齊。", "在多項依賴或反覆變動時，提早辨識關鍵阻礙，提出分段交付、調整順序或縮小範圍等方案；經相關負責人確認後維持必要品質，減少可避免的等待或重工。", "持續在本階較複雜變動中可靠交付，能以記錄說明如何處理關鍵依賴與風險；整理可供相似任務採用的估時前提、交接或驗收做法。"], ["對所承擔工作缺少必要排程、依賴或驗收追蹤，未同步已知風險與缺漏，反覆造成可避免的延誤或重工。", "能安排個別任務，但工作間依賴、重大變動或驗收風險仍需他人主導整合，相關角色難以掌握可靠安排。", "整合所承擔領域工作的優先順序、里程碑及依賴，對齊相關人員承諾；主動揭露風險與調整選擇，完成可承接交付、體驗驗收及後續追蹤。", "在多項依賴或重大變動下提前辨識瓶頸，提出範圍、次序或資源選項並取得有權者確認；調整交付與驗收安排，維持關鍵品質，實際減少可避免的等待、重工或品質遺漏。", "在不同複雜交付中持續降低可避免的重工、臨時阻塞或品質遺漏，領域相關工作因其做法獲得更穩定的交付與驗收結果。"], ["在已知跨團隊依賴或交付風險下未及時說明、追蹤或升級，導致可避免的規格落差或重工。", "能找出瓶頸，但改動順序、交接內容與責任不完整，需他人整合才能推進。", "釐清本人負責的跨團隊設計依賴、交付與驗收責任，協調可行順序；遇變動提出調整、及早升級並追蹤落地。", "在多產品時程、版本或技術依賴衝突下，調整交付與驗收安排，減少原有的等待、規格落差或重工，改善結果可追溯。", "後續團隊能自主使用並修正有效的交接做法，遇到新變動仍能及時處理依賴，品質與可預期性持續改善。"]], "C8": [["在工具用途與檢查要求已說明後，仍反覆直接交付未檢查的 AI 或其他工具產出，未處理明顯錯誤或揭露模擬限制，造成可避免的誤解。", "能操作已提供的工具，但對任務所需的基本輸出檢查、錯誤修正或限制說明仍常需他人代做；學習新工具時的正常指導不單獨視為能力落差。", "依明確任務選用合適工具，提供必要情境與限制；檢查並修正產出，完成可檢視或可操作的任務成果，說明模擬內容與尚未完成部分。", "在任務中發現工具的輸出或操作限制，試用可行替代做法並比較結果，讓原本難以檢查的部分可被觀察，或在維持必要品質下減少實際修正與交付重工。", "多次運用合適工具改善任務產出、檢查或探索，在合理成本下提升效率或品質並維持必要品質；留下同儕可理解的使用情境、限制與檢查方法。"], ["在工具用途與必要支持已明確後，仍反覆將未檢查的 AI 或其他工具產出當作可用成果，或未揭露模擬限制，使測試或承接產生重大誤解。", "能操作工具與製作部分原型，但所選方式未能回答關鍵問題，輸出檢查、情境完整性或限制說明經常需他人補足。", "依要比較或驗證的問題選擇工具與原型深度，完成足以觀察關鍵操作的成果；檢查及修正輸出，說明模擬部分、資料與功能限制，讓測試或協作者正確使用。", "在既有工具或流程難以回答問題時，合理組合 AI、原型或其他工具，讓原本難測的關鍵行為能被觀察，或具體減少驗證與交付重工，同時確認品質與承接方式。", "持續以適合問題的工具做法改善本階探索、驗證或交付，具體說明品質與效率的前後差異，並留下他人可重用的使用條件與檢查方法。"], ["無法說明工具與驗證目的的關係，未檢查明顯輸出問題或未揭露模擬限制，使原型被錯誤解讀為可用的正式成果。", "能製作原型，但驗證所需操作、保真程度、輸出檢查或工程承接安排不完整，需他人主導補齊。", "依待驗證假設選擇足夠的原型或實驗方式，做出可測試的關鍵操作；檢查工具輸出、說明模擬與限制，與工程確認承接、驗收及上線責任。", "在接近真實操作或技術限制的情境中整合工具與工程協作，使原本難以驗證的假設能被檢查；以同等驗證目的比較投入、品質及承接成本並呈現改善。", "在不同問題中持續以合理成本取得可信驗證，改善驗證效率或品質並維持必要品質；相關團隊能採用其方法並確認收益，成本包含修正與承接，不以工具數量或程式行數判定。"], ["推動工具或原型方案時未確認用途、輸出品質或後續承接，已知錯誤仍進入交付，造成可避免的錯誤判斷或重工。", "有共用工具做法，但適用情境、檢查方式或維護負擔不清，需他人補齊才能供其他團隊使用。", "針對共同的探索或交付問題選擇適当工具與原型深度，說明適用邊界、檢查及工程承接方式；以實際案例比較投入、速度與品質取捨。", "在真實資料、產品或工程限制下改善工具到驗證的流程，協助不同團隊調整使用方式，證明主要問題獲改善且必要品質要求未被犧牲。", "後續團隊能自主選擇、修改或停用不合適的工具方法，發現並處理輸出限制；持續以合理成本取得可信驗證，能呈現效率或品質的改善並維持必要品質。"]], "C9": [["忽略既有元件與命名規則，造成重複或不一致的交付。", "會使用元件，但變體、命名或不適用處仍需他人整理。", "正確使用任務適用的既有元件、規則與命名，檢查變體及狀態；不適用時清楚回報缺口，留下其他協作者能理解的交付與例外說明。", "發現局部元件、命名或說明容易被反覆誤用，提出具體補充並與負責人確認，經後續使用檢查能減少同類理解落差或重做。", "多次改善局部元件使用或文件，使同儕能少走彎路並維持一致。"], ["在規則與必要支持已清楚後，仍反覆無理由新增或複製內容，造成可避免的不一致，且未能交代用途或限制。", "會使用既有資產，但適用性、狀態、命名或必要擴充的說明常需他人補齊，後續難以理解與使用。", "先判斷既有元件與規則是否適用，適用時正確使用，不適用時說明缺口與替代方案；留下狀態、用途及限制清楚的交付，避免無理由的重複與分歧。", "從已出現的重複需求整理可重用元件、規則或案例，確認適用與不適用情境，與使用者或工程對齊，並透過後續任務的使用修正內容，減少重複解釋或製作。", "持續將本階反覆問題整理成實際好用的共同資產，以不同任務的重用與更新證據說明品質或維護改善；不必建立全團隊的系統治理。"], ["忽略領域內可用資產或已知不一致，重複建立不相容做法，未留下必要使用與維護資訊，造成可避免的重工。", "能整理元件或案例，但用途、限制、工程對應或維護方式不完整，後續工作仍需逐案重新解釋與修正。", "針對領域反覆問題，選用或完善可重用的元件、規則及案例，說明用途、限制與維護方式，讓後續相關工作可實際承接使用。", "處理既有資產與真實需求或工程實作的落差，推進必要調整、採用及回報方式，在後續工作降低重複處理或不一致。", "領域資產能在不同後續任務持續使用與演進，他人可依清楚邊界擴充並維持品質，且有持續減少重工或品質問題的實際案例。"], ["未確認產品差異及維護責任即要求共用，造成不適用元件、設計與實作落差或無人處理的問題。", "能整理共用內容，但適用邊界、擴充或維護責任不清，合作團隊難以實際採用。", "判斷哪些元件、規則或知識值得共用，說明例外與維護成本；與合作方約定更新責任，讓內容在實際工作中可採用並對齊實作。", "在多產品需求與技術差異下，處理既有系統的採用或更新障礙，讓共用內容能演進，並證明重工或品質問題改善。", "後續團隊能自主擴充或修正共同資產，維持必要一致性並保留合理例外，長期重複投入減少且維護責任持續有效。"]], "C10": [["不說明設計思路或未落實回饋，相同問題反覆發生。", "願意分享與聆聽，但說明模糊，回饋需反覆提醒才落實。", "在工作討論中分享自己的設計理由，確認回饋所指的問題與適用情境，將約定改善用在後續設計，並說明調整前後的差異。", "將自己遇到的設計難點與修正整理成具體案例，說明判斷理由及適用邊界；依同儕疑問補充或修正說法，讓對方能理解並試用相關經驗。", "多次提供可供同儕採用的實作經驗，幫助他人避免相同問題。"], ["在有合理交流機會且提供必要支持後，仍反覆以個人偏好給出無法理解或執行的結論，未回應對方情境，妨礙專業討論。", "能指出問題，但原因與改善方向常過於模糊，需他人補充後對方才知道如何行動。", "在日常審查、討論或分享中，依對方目標與限制指出具體問題，說明理由並提供可執行改善方向；接受不同判斷，必要時補充脈絡。", "在他人難以判斷的設計問題上，以提問、案例與方案比較協助理解取捨，並跟進嘗試；能指出對方如何應用建議或需要哪些支持，而非只代做答案。", "持續讓同儕或合作夥伴理解並應用本階設計判斷，以後續行動或獨立處理相似問題的例子呈現影響；有效說明方式可供他人參考。"], ["在已有合理指導或審查機會時，回饋主要是個人偏好或直接給答案，未說明依據與可行選擇，反覆增加對方理解或執行困難。", "能協助修正個案，但判斷依據、引導方式或後續追蹤不足，對方仍需依賴本人處理相似問題。", "在已安排的審查、協作或指導機會中，說明判斷依據、引導對方比較方案並給出可行回饋；追蹤後續應用，協助對方逐步自行處理相似問題。", "能辨識對方反覆卡住的判斷環節並調整指導方式，使對方在後續工作減少相同依賴或錯誤，並有具體應用可確認。", "對方在不同後續情境能持續獨立應用判斷，相關同儕也能採用或傳遞其指導方法，專業影響能延續而不依賴本人逐案給答案。"], ["在已約定的指導或跨團隊審查中只給答案或個人偏好，未說明理由與適用條件，造成他人持續依賴或誤用。", "有分享與回饋，但未針對真實能力差距說明判斷，對方難以轉用到自己的問題，需他人補充指導。", "針對合作團隊的實際判斷難題，以審查、共作或案例說明依據與適用邊界，觀察對方在後續工作中如何使用並提供必要回饋。", "面對跨團隊反覆出現的能力缺口，調整指導方式，讓原本需介入的設計師能在新的情境中自主比較方案，實際改善可追溯。", "其他資深設計師能運用並調整其指導方式協助更多同儕；多團隊後續能持續培養自主判斷，減少對本人或少數專家的依賴。"]]};const RESEARCH=[{"company": "GitLab", "kind": "公開職級責任框架", "date": "頁面最後更新 2026-07-19；更新註記為組織頁面遷移，不能據此認定所有條文均於當日新增。", "finding": "公開 Product Designer、Senior、Staff、Principal、Distinguished 的責任；基礎要求包括 AI 適用性判斷、HTML/CSS、JavaScript 與 Git 協作知識。資深層級更重視上游問題與跨團隊方向。", "implication": "支持保留專業基本功，並把 AI 判斷及工程協作寫成具體能力；各公司的職稱不宜直接等同 CMoney 職等。", "limit": "正式職責分級頁，並非公開逐項 1–5 分考核表；本次未做版本差異比對。", "url": "https://handbook.gitlab.com/job-description-library/product/product-designer/"}, {"company": "Amazon / AWS", "kind": "具 2026 時間線的官方職缺", "date": "2026-09-10 查閱；Principal 職缺內明列 H1 2026 團隊成果，非用頁尾年份判定。", "finding": "OpenSearch Principal 職缺定位為高影響 IC，描述設計師與工程共同做原型、提交正式程式及實驗。另有 Bedrock UX Designer II 職缺要求完整研究到交付，鼓勵 AI 工具與技術熟悉度。", "implication": "Builder 可以包含實作，但需按團隊與責任定義；不能推論所有 Amazon 設計師都必須獨立部署。", "limit": "特定 AWS 團隊招募要求，未取得全公司 2026 晉升框架。", "url": "https://amazon.jobs/en-gb/jobs/10474505/principal-ux-designer-aws-search-security-observability-governance", "extra": "https://www.amazon.jobs/en/jobs/10493207/ux-designer-ai-services"}, {"company": "Google", "kind": "具 2026 日期的官方職缺", "date": "職缺明列申請窗口至少至 2026-07-31；本次於 2026-09-10 查閱，不代表仍可申請。", "finding": "gUP 的 Mid UX Designer 要求互動設計、跨職能合作、系統思考、用戶回饋與產品迭代；AI workflows／tools 經驗列為優先條件，工作包含生成式 AI 支援旅程。", "implication": "AI 情境增加，但研究、流程、品質與協作仍有明確要求；不能把做 AI 產品與用 AI 加速工作混為一談。", "limit": "特定中階職缺，不是 Google 完整職級地圖，也不能證明所有職位要求已改動。", "url": "https://www.google.com/about/careers/applications/jobs/results/92781864636293830-ux-designer/?page=2"}, {"company": "Atlassian", "kind": "2026 官方設計實務文章", "date": "發布於 2026-02-20；文章回顧先前的演講與設計案例。", "finding": "Rovo 設計案例聚焦用戶心智模型、認知負擔與信任，將繁多 agents 改成容易使用的能力入口，並用評估工具與共用模式支持擴展。", "implication": "AI 設計仍要判斷用戶是否理解及能否完成任務；建議評核結果品質、失敗情境與驗證能力。", "limit": "設計實務案例，不是職能或晉升框架。", "url": "https://www.atlassian.com/blog/design/ai-adoption-through-trust-rachel-shepard"}, {"company": "Atlassian / Loom", "kind": "2026 查閱的官方職缺（發布年未確認）", "date": "2026-09-10 查閱；頁面未提供可確認的發布日期，僅列補充資料。", "finding": "Lead Product Designer 職缺提到設計師貢獻程式、技術原型、AI 工具與跨產品體驗，同時強調視覺、互動和動態品質。", "implication": "支持將實作與設計品質一起觀察；是否要求改碼仍應明定職責與工程驗收。", "limit": "不能標成確定在 2026 新增的職能要求，更不能視為全公司規則。", "url": "https://www.atlassian.com/company/careers/details/25349"}];const MAPPING=[["舊版項目", "本版對應", "調整說明（提案）"], ["工作大小", "C1 問題判斷、C7 交付管理", "拆分：任務工時改為責任、複雜度與推進能力。"], ["元件使用", "C9 設計系統與知識重用", "延伸：保留元件能力，加入採用與維護。"], ["設計品質與一致性", "C2 UI 品質與資訊呈現", "保留並聚焦視覺品質；流程完整性移至 C3。"], ["流程與資訊架構", "C3 流程與互動完整性", "整併流程、例外、平台與跨產品旅程。"], ["使用者體驗與互動設計", "C2、C3", "依視覺呈現與互動完整性拆開評量。"], ["用戶研究", "C4 用戶理解、C5 驗證迭代", "拆分理解問題與驗證方案；移除固定研究次數。"], ["數據", "C4、C5", "整併證據判讀與結果驗證，數據能力仍保留。"], ["需求分析與產品策略", "C1 問題理解與取捨", "保留，依四階新定位明確責任。"], ["跨部門溝通與協作", "C6 協作、C7 交付", "把溝通決策與執行管理分開。"], ["簡報會議", "C6 協作與決策溝通", "整併；以清楚表達與促成決策評量，不以聽眾頭銜定級。"], ["領導", "C10 專業指導與影響", "保留專業影響，正式人員管理另定。"], ["當責", "C1、C5、C7 與公司價值觀", "拆分問題、迭代與交付責任；價值觀另按公司規則判斷。"], ["新增", "C8 AI、原型與工具應用", "新增 AI 品質判斷、可測試原型、工程協作；未一律要求自行部署。"]];const T=[[["項目", "職能 1｜Jr. Designer", "職能 2｜Md. Designer／Product Designer", "職能 3｜Sr. Designer／Product Builder", "職能 4｜Principal Designer"], ["核心角色", "在明確目標下獨立完成設計任務", "獨立解決範圍明確的產品問題", "主導一個產品或領域的機會探索與成果推進", "主導跨產品體驗方向及共同問題"], ["承擔範圍", "單一任務、功能或明確子流程", "完整使用流程或產品問題，從釐清到驗證", "產品或領域內相互關聯的問題、優先序及迭代", "多產品共同體驗、系統與關鍵取捨"], ["自主性", "自行完成設計；問題定義與複雜取捨需協助", "自行釐清問題與比較方案；重大範圍變更共同決策", "主動提出做什麼、為何做及如何驗證；依約定權責推進", "提出跨產品方向，協調多方形成決策並推進採用"], ["品質責任", "自己交付的流程、畫面、狀態與規格", "所承接問題的完整體驗與上線品質", "領域品質、關鍵決策及持續改善", "跨產品品質原則與共同體驗問題"], ["成果期待", "任務符合目標，交付可靠，能依回饋修正", "能確認問題是否改善，據結果迭代", "能推動領域成果，並形成下一步決策", "改善跨產品問題，讓多團隊持續受益"], ["專業影響", "分享理由、吸收回饋", "提供有依據的同儕建議", "指導與審查，提升同儕判斷", "建立多團隊採用的原則、方法與專業能力"], ["管理責任", "無正式人員管理要求", "無正式人員管理要求", "專業指導；不以直屬部屬或績效管理為必要條件", "專業影響；不以直屬部屬或績效管理為必要條件"]], [["編號／職能", "Jr.｜符合期待", "Md.｜符合期待", "Sr.｜符合期待", "Principal｜符合期待", "評量證據"], ["C1 問題理解與取捨", "在明確目標與範圍下，說明使用對象、任務目標與限制，自行選擇局部設計並說明理由；遇矛盾、不明處或複雜取捨時，主動提出並與負責人確認。", "在已約定的產品問題內，獨立確認使用者任務、目標、限制與未知，比較必要的可行選項並說明推薦理由；超出範圍或授權時，帶著建議交由約定決策者確認。", "主動辨識領域機會，說明問題、目標、證據與限制；提出有比較依據的優先順序及最小驗證範圍，與指定決策者確認取捨及下一步。", "以各產品證據界定共同問題，比較共用、保留差異及分階段處理的選項，說明長短期代價，促成有責任人的決策。", "問題定義、方案比較、決策紀錄、被調整或停止的需求"], ["C2 UI 品質與資訊呈現", "在明確任務內維持排版、層級、對比、對齊與一致性；用實際需要的內容、尺寸與狀態自查，修正基本品質問題並記錄實作差異。", "在負責範圍內，獨立完成一致、易讀且主次明確的畫面，涵蓋實際需要的內容、尺寸與狀態；依品質要求自查，追蹤實作偏差的修正或取捨。", "自主處理領域內複雜資訊與歷史呈現限制，依明確品質依據完成設計及實作審查，確認重要資訊在任務適用的內容量、狀態與裝置下清楚一致。", "針對共同呈現問題給出可操作的品質原則與設計示例，說明各產品必要差異，協調實作檢查並確認使用者能理解重要資訊。", "設計與實作對照、品質檢查、缺陷修正、使用回饋"], ["C3 流程與互動完整性", "依已確認的任務範圍設計主要流程，補齊適用的空白、載入、錯誤、完成及回復狀態；走查前後步驟，遇跨範圍依賴時提出並確認處理方式。", "獨立規劃約定問題從起點到終點的流程，涵蓋適用的主要路徑、例外、回復與角色差異，並與工程確認可行性；使用者能理解目前狀態及下一步。", "自主梳理領域內相互影響的流程及限制，設計完整且可理解的關鍵路徑、狀態與失敗回復；確認局部改動不破壞相鄰流程，並完成驗證及必要修正。", "釐清跨產品旅程或多產品共同互動問題，完整設計銜接、例外與失敗回復，說明需一致及可不同之處，與合作方驗證並推進落地。", "流程圖、情境表、可用性測試、上線驗收與問題改善"], ["C4 用戶理解與證據判讀", "實際使用負責的產品與流程，理解所需領域基礎；整理取得的回饋或資料，說明來源與情境，分清觀察事實、個人推測及待確認處。", "依問題選擇足夠的證據，獨立整理使用情境與需求；區分觀察、推論與未知，交代來源、適用範圍及限制，讓證據支持相應設計判斷。", "找出最影響領域方向的研究問題，選擇可支持判斷的方法及資料，交叉檢查來源、代表性與限制，區分事實與推論並修正問題理解。", "交叉判讀不同產品的用戶證據，區分可共用洞察與必要差異，針對最影響決策的缺口安排可行查證，讓團隊理解結論及限制。", "訪談、客服或評論整理、分析、研究結論與設計決策關聯"], ["C5 驗證與持續迭代", "理解任務的成功條件，在方法與判讀協助下參與驗證，按約定記錄觀察、分清結果與猜測，完成確認過的設計修正並追蹤待補部分。", "投入主要設計或實作前，確認關鍵假設、成敗訊號與可行驗證方式；完成可執行的驗證，依結果說明假設被支持到何種程度並提出下一步。上線或資料不可得時，以合適替代方式驗證可回答的部分，明列仍待觀察的部分及後續責任。", "排定領域高風險假設的驗證順序，事前約定判斷條件、方法與結果責任人；解讀結果及限制，提出擴大、調整或停止建議，取得決策並追蹤下一步。", "與合作產品約定最需驗證的假設、各自成功條件、觀察方式與決策時點；判讀結果並提出擴大、調整或停止的建議，追蹤決策。", "假設、測試計畫、上線前後的適用結果、方法與因果限制、迭代或停止決策"], ["C6 協作與決策溝通", "說清任務目標、設計理由與待確認處，依合作對象補足脈絡；確認自己理解回饋，記錄已決定事項、責任與下一步，遇超出範圍的爭議時提出協助需求。", "獨立說明問題、方案與取捨，理解相關角色需求與限制；釐清分歧並確認決策者，留下選擇、保留意見及後續責任，讓夥伴知道如何執行。", "釐清領域內不同角色的目標、限制與分歧，提出可比較選項；確認決策者、取捨、責任與下一步，無法在權責內解決時及時升級並追蹤。", "釐清各團隊目標、證據、限制與分歧，提供可比較選項，確認有權決策者、責任與後續動作，讓相關人理解最後取捨。", "設計提案、分歧處理、協作方回饋、決策與後續執行"], ["C7 交付與工作管理", "依明確範圍合理估時，預留必要討論與修正，主動同步進度及可知風險；交付可理解的規格、參與驗收，遇變動時提出影響與調整需求。", "獨立安排所負責問題的設計、必要討論與驗收，確認依賴及交付條件；變動時及早說明範圍、品質與時程影響，提出可行重排並與相關負責人對齊。", "整合所承擔領域工作的優先順序、里程碑及依賴，對齊相關人員承諾；主動揭露風險與調整選擇，完成可承接交付、體驗驗收及後續追蹤。", "釐清本人負責的跨團隊設計依賴、交付與驗收責任，協調可行順序；遇變動提出調整、及早升級並追蹤落地。", "估時與調整、風險預告、規格、驗收、上線紀錄"], ["C8 AI、原型與工具應用", "依明確任務選用合適工具，提供必要情境與限制；檢查並修正產出，完成可檢視或可操作的任務成果，說明模擬內容與尚未完成部分。", "依要比較或驗證的問題選擇工具與原型深度，完成足以觀察關鍵操作的成果；檢查及修正輸出，說明模擬部分、資料與功能限制，讓測試或協作者正確使用。", "依待驗證假設選擇足夠的原型或實驗方式，做出可測試的關鍵操作；檢查工具輸出、說明模擬與限制，與工程確認承接、驗收及上線責任。", "針對共同的探索或交付問題選擇適当工具與原型深度，說明適用邊界、檢查及工程承接方式；以實際案例比較投入、速度與品質取捨。", "原型、工具前後的流程與成果比較、驗收紀錄；不按工具數量計分"], ["C9 設計系統與知識重用", "正確使用任務適用的既有元件、規則與命名，檢查變體及狀態；不適用時清楚回報缺口，留下其他協作者能理解的交付與例外說明。", "先判斷既有元件與規則是否適用，適用時正確使用，不適用時說明缺口與替代方案；留下狀態、用途及限制清楚的交    <div class="evidence"><b>可以看哪些證據</b><br>${esc(r[5])}</div>
   <div class="scope-note"><b>評量範圍與相近項目怎麼分</b><p>${esc(discussion.boundary)}</p></div>
   ${level>0?`<details><summary>這一階對本項提出的疑問</summary><p><b>${esc(titles[level])}：</b>${esc(guide.question)}</p><p><b>主管角色回應：</b>${esc(discussion[['','md_reply','sr_reply','principal_reply'][level]])}</p><small>來自四角色模擬討論；完整複核結果見「角色討論」。</small></details>`:''}
  </article>`;
 }).join(''):'<div class="empty">沒有符合的職能，試試其他關鍵字。</div>';
}
function discussionUI(){
 $('#discussion').innerHTML=`<div class="panel"><span class="badge">四角色模擬討論</span><h2>把疑問變成可以採取的行動</h2><p>由 Md.、Sr.、Principal 三位設計師角色逐項提問，UIUX 主管角色回應，再交回三位設計師複核。這是 AI 模擬討論與修訂建議，尚未經 Monica 或公司主管核定。</p><p>本版保留 10 項職能定義、四階 200 條評分描述，新增 40 組行動步驟及虛構工作示例。Jr. 的補充內容由整合編輯撰寫，並由主管角色檢查評分。</p></div>
 <div class="panel"><h2>討論後採用的評量原則</h2><div class="principles">${DISCUSSION.common_rules.map(r=>`<div><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p></div>`).join('')}</div></div>
 <div class="panel"><h2>三位設計師的第二輪複核</h2>${['md','sr','principal'].map((role,i)=>`<div class="recheck"><h3>${titles[i+1]}</h3><p>${esc(RECHECK[role].summary)}</p></div>`).join('')}<div class="notice"><b>主管角色的最後回應</b><br>${esc(DISCUSSION.manager_closing)}</div></div>
 <h2>逐項問題、主管回應與修訂</h2><p>展開任一項，可以看到三個職階的疑問與回應。</p>
 ${T[1].slice(1).map(r=>{const id=r[0].split(' ')[0],d=DISCUSSION.items[id];return `<details><summary>${esc(r[0])}</summary>${['md','sr','principal'].map((role,i)=>`<div class="dialogue"><b>${titles[i+1]} 提問</b><p>${esc(GUIDANCE[id][i+1].question)}</p><b>UIUX 主管回應</b><p>${esc(d[role+'_reply'])}</p><small>第二輪：${esc(RECHECK[role].items[id])}</small></div>`).join('')}<div class="notice"><b>修進職能地圖的內容</b><br>${esc(d.decision)}</div></details>`}).join('')}
 <div class="panel"><h2>仍需 Monica 與主管定案</h2><ul>${DISCUSSION.pending_decisions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>上述制度選擇保留為待定事項；本頁可先用於工作對話與試評。</p><a href="UIUX角色討論與修訂紀錄.md" target="_blank">閱讀完整討論紀錄</a></div>`;
}

function reviewUI(){$('#review').innerHTML=`<div class="panel"><h2>先看本階表現，再看下一階責任。</h2><p>以下為 ${titles[level]} 的計分示意。各職階輸入分開暫存，重新整理即清除。</p><div class="calc"><div>${T[1].slice(1).map((r,i)=>`<div class="score"><label for="s${i}">${esc(r[0])}</label><select id="s${i}" data-score="${i}"><option value="">未觀察</option>${[1,2,3,4,5].map(v=>`<option ${scores[level][i]==v?'selected':''} value="${v}">${v} 分</option>`).join('')}</select></div>`).join('')}</div><div class="result" id="result" aria-live="polite"></div></div></div><details><summary>評分前，共同約定什麼？</summary>${DISCUSSION.common_rules.map(r=>`<h3>${esc(r.title)}</h3><p>${esc(r.text)}</p>`).join('')}</details><details><summary>1–5 分的共同定義</summary>${table(T[2])}</details><div class="panel"><h2>晉升需要哪些證據？</h2>${table(T[4])}<div class="notice">目前職階高分不等於自動晉升。觀察期間、必要項目與正式決策流程，仍需主管定案。</div></div>`;document.querySelectorAll('[data-score]').forEach(s=>s.onchange=()=>{scores[level][+s.dataset.score]=s.value;resultUI()});resultUI()}
function resultUI(){const a=scores[level].filter(x=>x!=='').map(Number),sum=a.reduce((x,y)=>x+y,0),ratio=a.length?sum/(a.length*5):0,tier=!a.length?'尚未評分':ratio>=.8?'高階':ratio>=.6?'中階':ratio>=.4?'初階':'不符合';$('#result').innerHTML=`<span>${a.length<10?'評估未完整 · 暫時落點':'本階表現落點'}</span><strong>${tier}</strong><div>已評 ${a.length} / 10 項</div><p>${a.length?`${sum} ÷ (${a.length} × 5) = ${(ratio*100).toFixed(1)}%`:'選擇分數後，這裡會顯示比例。'}</p><p>≥80% 高階<br>≥60% 中階<br>≥40% 初階<br>&lt;40% 不符合</p><p>未觀察不等於 0 分。未完整的落點不能視為全項達標；本頁不提供人員晉升結論。</p>`}
function rulesUI(){$('#rules').innerHTML=`<div class="panel"><h2>Company Values</h2><p>沿用公司 Inconsistent／Successful／Exceptional，與專業能力評分並列。</p>${table(T[3])}<div class="notice">以一段期間的表現通盤判斷。單一亮點不足以推定整體卓越；資料不足先標待補。公司落錨與 NoShow 規則仍沿用原文件。</div></div><details open><summary>Sr.／PM／工程：先約定責任與決策權</summary><p>以下為分工建議，專案啟動時需指定實際主責與整合決策者。</p>${table(T[5])}</details><details><summary>任務大小：看複雜度與責任</summary>${table(T[6])}<p>工時用於排程，AI 做得更快不會自動降低任務複雜度。正式人員管理另列管理職標準。</p></details><details><summary>待一起定案的內容</summary>${table(T[T.length-1].map((r,i)=>i&&r[0]==='評分結構'?[r[0],'共同職能一套分數，沿用原比例','必要項目、未觀察處理與正式評量流程']:r))}</details>`}
function extraUI(){$('#changes').innerHTML=`<div class="panel"><h2>原本 12 項如何對應到本稿 10 項？</h2><p>以下調整仍是提案，供逐項確認。本次恢復完整評分描述，未將新增及整併項目視為定案。</p>${table(MAPPING)}</div>`;$('#research').innerHTML=`<div class="panel"><h2>2026 大廠公開資料</h2><p>查閱：2026-09-10。區分正式職級責任、官方職缺與設計實務；不以網站頁尾年份當作更新證據。</p><div class="notice">本次未取得各大廠完整的 2026 版 1–5 分考核表。下方來源供能力方向參考；本頁 200 條行為描述是 CMoney 討論稿。</div></div>${RESEARCH.map(r=>`<article class="panel"><span class="badge">${esc(r.kind)}</span><h2>${esc(r.company)}</h2><span class="label">${esc(r.date)}</span><p>${esc(r.finding)}</p><div class="notice"><b>對本稿的建議</b><br>${esc(r.implication)}</div><p><b>證據限制：</b>${esc(r.limit)}</p><a href="${esc(r.url)}" target="_blank" rel="noopener">查看官方來源 ↗</a>${r.extra?` · <a href="${esc(r.extra)}" target="_blank" rel="noopener">補充官方職缺 ↗</a>`:''}</article>`).join('')}<div class="panel"><h3>歷史框架不冒充 2026 更新</h3><p>Intercom 的公開職級文章發布於 2021 年，未列入本次 2026 證據。AI 實作要求的增加也不表示設計基本功可以省略。</p></div>`}
function render(){extraUI();discussionUI();levelUI();mapUI();reviewUI();rulesUI();document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!==page));document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-pressed',b.dataset.page===page)})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});render();</script></html>
