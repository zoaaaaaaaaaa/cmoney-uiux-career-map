<script>const DATA={"version": "v5", "date": "2026-09-17", "items": [{"id": "C1", "name": "問題釐清", "source_ids": ["C1"], "definition": "釐清使用者需求、產品目標與限制，比較方案，說明為什麼做、先做什麼，以及如何取捨。隨職等提高，從明確的設計任務，逐步擴大到跨產品的共同問題。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依需求與範例整理設計內容；釐清使用對象、目標與限制，並據此決定細節時，仍需要協助。", "能釐清明確任務的對象、目標與限制，自行決定細節並說明理由。遇到不明確或難取捨的地方，會找負責人確認。", "能多次找出需求遺漏或衝突，提出有依據的替代做法，確認後調整。後續任務能減少遺漏或不必要的工作。"], "actions": ["寫清楚誰會使用、使用情境，以及這次要改善什麼。", "列出限制與未知，找相關同事確認，再比較做法。", "記下選擇理由，以及需要資深設計師或 PM 決定的問題。"], "example": "假設情境：調整收藏按鈕前，你確認目標是讓使用者找回收藏，發現文字和入口位置都有影響，再跟 PM 確認修改範圍。", "observations": [], "responsibility": "釐清明確任務的使用對象、目標與限制，決定細部設計。"}, {"scores": ["能依明確需求提出做法；釐清背後問題、確認假設，以及比較方案代價與範圍時，部分判斷仍需要協助。", "能獨立釐清產品問題的情境、目標、限制與未知，比較方案並提出建議。涉及範圍或權限變更時，帶著建議找負責人確認。", "能處理模糊需求、錯誤假設或限制衝突，用證據調整方案與範圍。後續任務或迭代能確認無效設計或重做減少。"], "actions": ["寫清楚使用者卡在哪裡，以及目標、限制與假設。", "比較方案，說明推薦做法、暫不處理的部分與原因。", "記下決定與風險；要調整範圍或資源時，找負責人確認。"], "example": "假設情境：PM 想新增篩選器，你從客服與操作紀錄發現主因是排序難懂。比較後建議先改排序，獲得同意後記下調整範圍，並安排驗證查找成功率。", "observations": [], "responsibility": "釐清一個產品問題的原因，比較方案並提出取捨。"}, {"scores": ["能提出熟悉問題的改善機會；主動找出領域問題、比較機會並決定先驗證什麼時，仍需要協助。", "能主動找出產品或領域的機會，依目標、證據與限制提出優先順序、最小驗證範圍，再跟決策負責人確認下一步。", "面對資源競爭或證據矛盾，能找出關鍵未知與風險，提出可比較的選項。後續結果能確認無效投入或重大遺漏減少，並幫助相關工作釐清問題。"], "actions": ["整理使用者問題、產品目標、證據與未知。", "比較維持現況、小幅修改與完整方案，建議先做哪一部分。", "確認決策負責人、選擇理由、下一步與重新討論的時機。"], "example": "假設情境：團隊想重做訂閱頁，你發現主因是權益難懂，建議先測試說明方式。記下範圍調整、決定與測試結果；未被採用的提案仍如實記錄。", "observations": [], "responsibility": "主動找出產品或領域的機會，提出優先順序與最小驗證範圍。"}, {"scores": ["能從熟悉的領域提出跨產品問題；比較各產品目標、共用效益與必要差異，形成建議時仍需要協助。", "能依各產品證據找出共同問題，比較共用、保留差異與分階段處理的短期、長期代價，協助決策並確認分工。", "面對跨產品目標衝突或資訊不足，能補足證據、調整範圍並促成決策。後續結果顯示投入更有效或體驗改善，團隊也能用這些方法處理新問題。"], "actions": ["比較各產品的使用情境、證據與限制。", "列出共用、保留差異與暫緩處理的成本及影響。", "跟決策負責人確認選擇理由與後續分工。"], "example": "假設情境：兩款產品想共用會員流程，你發現權限不同，建議只共用身分辨識、保留各自授權步驟，並追蹤實作與使用者理解。", "observations": [], "responsibility": "找出單一產品難以解決的共同問題，判斷哪些一起解、哪些保留差異。"}], "clarifications": []}, {"id": "C2", "name": "UI 品質與資訊呈現", "source_ids": ["C2"], "definition": "透過資訊層級、字體、版面、色彩與對比，建立清楚且一致的視覺表達。依使用情境與品牌定位做出設計判斷，確保不同內容、狀態與裝置下的可讀性，並落實到產品實作；跨產品時保留必要的品牌與使用差異。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依規範完成基本畫面；調整資訊層級、排版比例及不同內容或狀態的呈現時，仍需要指導。", "能依產品與品牌規範完成資訊層級、排版與色彩配置，自行檢查任務所需的內容、尺寸及狀態，修正視覺細節並追蹤實作差異。", "能多次解決長內容、高資訊量或版型限制下的視覺問題，兼顧品牌一致性與閱讀辨識。後續任務能延續做法，並以檢查或回饋確認改善。"], "actions": ["依閱讀順序設定資訊層級，對照產品與品牌規範。", "檢查字級、間距、對齊與對比，涵蓋不同內容、尺寸及狀態。", "比對設計與實作，修正視覺差異並留下對照。"], "example": "假設情境：文章卡片的長標題擠到摘要，日期也容易漏看。你調整字級、間距與分組，再檢查長短標題及無圖狀態，確認資訊清楚、品牌風格一致。", "observations": [], "responsibility": "依既有規範完成畫面，落實資訊層級、視覺細節與品牌一致性。"}, {"scores": ["能完成熟悉情境的 UI 設計；獨立判斷資訊優先順序、品牌表達與跨畫面一致性，並確認實作品質時，仍需要協助。", "能獨立提出 UI 方案，說明資訊層級、視覺風格與品牌表達的選擇。涵蓋所需內容、裝置與狀態，確認跨畫面一致性並追蹤實作修正。", "能在高資訊量、特殊內容與品牌要求衝突時，提出有依據的視覺解法。後續觀察能確認資訊辨識或比較效率改善，實作品質維持一致。"], "actions": ["依任務目標規劃資訊層級，比較視覺方案並說明選擇。", "檢查跨畫面一致性、品牌表達，以及不同內容、裝置與狀態。", "完成視覺驗收，記錄實作差異、影響與修正方式。"], "example": "假設情境：投資列表遇到長公司名與大數值時難讀。你調整資訊層級、維持品牌風格，再檢查不同內容與實作，留下前後對照及使用觀察。", "observations": [], "responsibility": "獨立規劃產品問題的 UI 方案，兼顧資訊層級、品牌表達與實作品質。"}, {"scores": ["能改善個別功能的視覺呈現；整合領域內的設計方向、處理規範衝突及建立品質判斷時，仍需要協助。", "能主導領域內的視覺方向，整合跨功能資訊層級與品牌表達。針對既有介面限制提出取捨，透過設計審查與實作檢查落實品質標準。", "能解決領域內反覆出現的視覺衝突，明確區分共通原則與情境差異。後續功能能延續設計方向，閱讀問題持續減少，品質判斷也能被同事運用。"], "actions": ["檢視領域內的資訊層級、視覺語言與品牌一致性，找出共通問題。", "依使用需求、既有介面與品牌定位，提出視覺方向及取捨。", "透過設計審查、實作檢查與使用回饋，追蹤後續版本品質。"], "example": "假設情境：看盤 App 的自選股、個股頁與價格提醒，有的只用紅綠色表示漲跌，有的沒標單位。你統一閱讀順序，補上正負號與單位，再檢查長股名、大數值，請使用者辨認價格與漲跌；後續版本沿用檢查方式。", "observations": [], "responsibility": "主導產品或領域的視覺方向，統整跨功能資訊呈現與品質標準。"}, {"scores": ["能提出跨產品的視覺方向；整合品牌定位、使用情境與技術限制，界定共用標準及必要差異時，仍需要協助。", "能依品牌定位與使用情境，建立跨產品視覺原則、品質標準及代表性方案。主導一致性與產品差異的關鍵取捨，推動各團隊落實，並驗證資訊辨識與理解。", "能處理品牌、裝置與技術限制交織的跨產品設計難題，形成可延續的視覺方向。後續團隊能據此完成新的設計取捨，實作與使用回饋也顯示資訊理解、品牌辨識或視覺一致性持續提升。"], "actions": ["比較各產品的品牌定位與使用情境，釐清共同視覺問題及必要差異。", "用關鍵頁面方案定義視覺原則與驗收標準，說明共用、差異及技術取捨。", "推動各團隊落實，追蹤後續方案的設計判斷、實作品質與使用回饋。"], "example": "假設情境：投資工具與學習產品的方案頁資訊順序不一。你定義價格、權益與限制的共同層級，分別保留數據比較及課程特色的品牌表達，協調關鍵頁面實作；後續新方案依此設計，再用回饋確認資訊辨識與品牌一致性。", "observations": [], "responsibility": "主導跨產品視覺策略與關鍵設計判斷，建立兼顧品牌識別與產品差異的品質標準。"}], "clarifications": [{"question": "這裡的 UI 品質具體看哪些地方？", "answer": "看資訊層級、可讀性、視覺一致性、品牌識別與實作品質。字級、間距、對齊、色彩和對比是具體檢查項目，設計判斷則要能說明使用需求與品牌依據。"}, {"question": "產品沒有完整的視覺或品牌規範，怎麼做？", "answer": "可以先從現有畫面、品牌素材與使用情境整理需要一致的部分，再跟設計負責人確認。評分看你在這個職階如何運用、釐清或改善規則，不以公司是否已提供完整文件來判斷。"}, {"question": "符合期待與超出期待，怎麼區分？", "answer": "2 符合期待：完成本階的視覺判斷與實作品質。Jr. 落實任務規範，Md. 獨立提出 UI 方案，Sr. 統整領域方向，Principal 主導跨產品視覺原則與關鍵取捨。3 超出期待：進一步解決複雜限制，並有持續改善；Principal 也看團隊能否運用原則完成新的設計判斷。只有文件或範例，還不足以證明成果。"}]}, {"id": "C3", "name": "流程與互動設計", "source_ids": ["C3"], "definition": "依使用者需求與產品目標，設計符合使用情境的流程與互動。讓步驟精簡、選項易懂、操作回饋清楚，減少不必要的跳轉與重複輸入，協助使用者順利完成任務；同時保留必要確認，以及出錯或中斷後的處理方式。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依需求與範例安排主要步驟；判斷操作順序、簡化多餘步驟及補齊回饋時，仍需要指導。", "能依明確需求設計流程，讓步驟、操作說明與回饋易懂。自行檢查多餘操作、必要確認及錯誤處理；複雜或範圍外情境會提出確認。", "能多次找出令人困惑的選項、重複操作或不明回饋。調整後以操作檢查或使用回饋確認任務更容易完成，並將做法延續至後續任務。"], "actions": ["確認需求、使用情境與任務目標，畫出入口到完成的步驟。", "檢查順序、操作說明與回饋，刪除多餘步驟，保留必要確認及錯誤處理。", "自行走完流程，確認任務可完成；複雜情境找同事一起確認。"], "example": "假設情境：使用者收藏文章時，先開選單再找收藏，完成後也沒有提示。你把入口移到文章操作區，保留未登入導引，補上成功回饋與失敗重試，再走完流程確認任務可完成。", "observations": [], "responsibility": "將明確需求轉成簡潔易懂的操作步驟，完成互動細節。"}, {"scores": ["能設計熟悉情境的主要流程；將需求轉成完整路徑、判斷步驟必要性並處理角色差異時，仍需要協助。", "能依使用者需求與產品目標，獨立設計完整流程，讓入口、順序與選項易懂。精簡多餘步驟，顧到角色差異、必要確認與中斷後接續，並跟工程確認可行性。", "能在多路徑、角色與限制互相影響時，重整步驟，減少卡關、跳轉或重複輸入。後續觀察顯示任務更容易完成，必要確認與錯誤處理仍完整。"], "actions": ["依需求與使用情境，整理從開始到完成任務的完整路徑。", "比較操作順序，確認選項易懂、步驟必要，涵蓋所需角色與例外情境。", "跟工程確認可行性，操作原型或產品，依使用觀察修正流程。"], "example": "假設情境：使用者必須先註冊才能看訂閱方案，付款時又要重填資料。你改成先比較方案再登入付款，保留已填內容與付款確認，補上修改及重試，再觀察使用者能否順利完成。", "observations": [], "responsibility": "獨立設計一個產品問題的完整流程，兼顧需求、易用性與實作可行性。"}, {"scores": ["能改善個別功能的流程；依完整任務整合多項需求、跨功能步驟與資料銜接時，仍需要協助。", "能依領域目標與使用情境，整合跨功能流程，減少重複輸入與不必要切換。協調既有系統限制，確認主要及例外情境順暢，修改不影響相關流程。", "能找出功能切分或操作順序造成的根本問題，重新規劃任務路徑，例如合併重複決策、調整操作順序。方案落實後，確認原有問題持續改善、必要控制仍完整，並說明設計改變與成果的關聯。"], "actions": ["依完整任務整理跨功能需求，找出多餘切換、重複輸入與流程斷點。", "協調功能與工程一起調整，保留必要操作並處理既有系統限制。", "檢查主要流程與例外，追蹤後續版本的理解、操作與任務完成情況。"], "example": "假設情境：學習任務分散在選課、課程、練習與進度四個入口。你依操作觀察，重新安排「開始學習、完成練習、接續下一堂」的任務路徑，保留選課與返回控制。上線後追蹤中斷與重複查找是否減少，並確認改善與這次流程調整的關聯。", "observations": [], "responsibility": "主導領域內的跨功能體驗，整合使用流程並簡化任務操作。"}, {"scores": ["能提出跨產品流程改善；從案例找出共通結構、定義適用範圍並推動團隊採用時，仍需要協助。", "能找出跨產品反覆出現的任務問題，建立可複用的流程與互動模式，定義適用條件、必要差異及例外處理。以代表性情境驗證後，推動各團隊採用。", "面對跨產品、版本與技術限制，能持續調整共用模式與過渡做法。後續團隊能自行用它設計新流程，且重複決策、操作落差或使用者卡關持續減少。"], "actions": ["比較跨產品反覆出現的任務，整理共同目標、核心步驟、狀態與例外。", "定義可複用的任務流程與互動模式，說清楚適用條件、必要差異及不適用情況。", "用代表性產品驗證後推動採用，追蹤新流程的使用情況並持續更新模式。"], "example": "假設情境：多款產品在登入或驗證後，都無法回到原本進行中的任務。你建立「保留任務脈絡、完成驗證、返回原步驟」的共用流程模式，定義重新驗證條件與產品差異。先在代表性產品驗證，再讓其他團隊依此設計新流程，追蹤中斷與重做是否減少。", "observations": [], "responsibility": "建立可複用的跨產品任務流程與互動模式，讓各團隊能處理共同問題並保留必要差異。"}], "clarifications": [{"question": "每個案子都要跨平台或有很多角色嗎？", "answer": "依實際任務需要設計。跨產品可以處理各產品共同的互動問題，不必把無關流程串在一起。有 AI 功能時，也要考慮等待、結果修改、重試與替代操作。"}, {"question": "流程精簡，是不是步驟越少越好？", "answer": "看使用者是否容易理解並完成任務。減少重複輸入、不必要跳轉與難懂選項，同時保留必要確認、修改及錯誤處理。可以用操作檢查、使用觀察或既有紀錄確認改善，不只計算點擊次數；超出期待仍需有持續成果。"}, {"question": "Sr. 的符合期待與超出期待，差在哪？", "answer": "2 看能否獨立整合跨功能流程，處理限制與例外，讓任務順暢完成。3 須先穩定達標，再找出既有功能切分或操作邏輯的根本問題，提出不同的任務路徑並實際改善。重點是流程判斷與持續成效，不以改版規模、少幾次點擊或單次結果判斷。"}]}, {"id": "C4", "name": "質化或量化研究", "source_ids": ["C4", "C5"], "definition": "用證據了解使用者、支持設計判斷，分清事實與假設。先看既有回饋、客服紀錄、數據或研究；不足以回答問題，且時間與資源允許時，再做質化或量化研究。重點是合理解讀、用在設計上，並說明限制與後續驗證安排。", "facets": [{"name": "質化研究", "question": "透過訪談、操作觀察或開放式回饋，了解使用情境、想法與操作困難。"}, {"name": "量化研究", "question": "透過行為資料、結構式問卷、任務成功率或適合的實驗，了解問題規模與變化。"}], "scoring_note": "看證據如何支持設計判斷與改善，不按研究次數或方法種類評分；質化或量化可擇一或搭配。", "clarifications": [{"question": "一定要自己做一次新研究，才能評這項嗎？", "answer": "不用。既有使用者回饋、客服紀錄、數據或研究結果，只要來源可信、適用於目前問題，也能作為依據。評分看你如何判讀、用在設計上，以及辨識還有哪些未知。需要進一步了解或驗證、時間與資源也允許時，應安排適合的研究；沒有新研究本身不扣分，但也不能把尚未驗證的假設寫成已知結果。"}, {"question": "只有做質化，或只有用量化資料，也可以達標嗎？", "answer": "可以。評的是你能不能依問題選方法、合理解讀結果並用在設計上。質化或量化擇一適合就能提供證據，也可以搭配；不要求每個案子或整段評估期間都湊齊兩種方法，做的種類多也不會自動加分。"}, {"question": "沒時間訪談，或需要的數據查不出來，怎麼辦？", "answer": "先說明缺什麼、會影響哪些判斷，再跟 PM 或主管討論可行做法。例如參考適用的既有訪談、客服紀錄或報表，安排較小範圍的操作觀察，或調整這次能回答的問題。替代資料仍要確認來源與限制；若只能找到線索，就如實保留為待驗證，不能當成已證明有效。主管也要協助安排時間、權限或資源。"}, {"question": "沒做另一種研究，就要把整項標未觀察嗎？", "answer": "不用。只要目前採用的方法與結果，已足以判斷這個職階的表現，就可以評分。只有因為缺少合理機會，導致整項仍沒有足夠證據時，才先標未觀察並保留已完成部分；缺資源不直接等於低分。"}, {"question": "只有研究計畫，或結果不支持原本方案，怎麼評？", "answer": "只有計畫還不能當成完成驗證；可以用既有資料支持它實際能回答的判斷。評分時看整理、判讀與應用的實際表現，決定不做或維持原方案也可以是好的判斷。若聲稱設計已改善問題，就要有相應的結果。原型觀察能說明理解或操作情況，不能直接當成正式轉換、留存或營收成果；資料前後有變化，也要考慮其他原因。"}], "levels": [{"scores": ["能依安排蒐集資料或執行測試；辨認來源、區分事實與推測，並整理相關發現時，仍需要引導。", "能在協助下整理任務資料、記下來源並分清事實與推測，經討論後用在設計上。需要且條件允許時，參與安排好的研究並記錄結果。", "能多次從資料找出被忽略的差異，提出確認方式，經討論後補查或調整設計。後續紀錄能確認誤解已修正、設計有所改善。"], "actions": ["確認問題，整理既有回饋、客服紀錄、觀察或數據。", "跟負責人確認資料適用性；需要且條件允許時參與研究。", "把發現用在設計上，記下來源與尚未確認的部分。"], "observations": ["使用質化資料時：能在協助下整理既有回饋、訪談或操作觀察，記下來源，分清實際看到的事與推測；需要補查時，依安排參與。", "使用量化資料時：能在協助下整理既有數據或研究結果，確認對象、期間與數字意義，說明資料還不能回答什麼。"], "example": "假設情境：客服截圖顯示收藏入口文字容易被誤解。你整理線索，討論後修改文字並保留來源；修改是否有效仍待觀察，不能直接當成成果。", "responsibility": "整理任務資料，分清事實與推測，經討論後用在設計上。"}, {"scores": ["能整理資料與初步發現；判斷證據是否適用、還缺什麼，以及如何查證與應用時，仍需要協助。", "能獨立判讀既有證據，說明設計依據與未知。需要且資源允許時，完成適合的質化或量化研究；將發現用於設計並追蹤結果。", "面對矛盾或不明的結果，能找出誤判風險，用適合的資料或查證支持調整、維持或停止方案。後續能確認誤判或無效投入減少，並依新結果修正。"], "actions": ["寫清楚問題，整理既有證據、已知與未知。", "判斷證據是否足夠；需要且資源允許時，選方法並執行研究。", "說明設計依據與限制，追蹤結果及待驗證事項。"], "observations": ["使用質化資料時：能判斷既有回饋、訪談或操作觀察是否適用，整理使用情境與發現；需要補充了解且條件允許時，完成適合的研究。", "使用量化資料時：能選擇適用的既有指標、報表或研究結果，確認對象、期間、計算方式與限制；需要補充資料時，提出可行的取得方式。"], "example": "假設情境：沒時間訪談，但付款失敗紀錄顯示特定版本無法重試。你建議先修正並追蹤紀錄；這能支持修復決定，仍不能推斷使用者放棄付款的原因。", "responsibility": "獨立判讀產品問題的證據，選擇查證方法並用於設計。"}, {"scores": ["能整理領域問題與證據；找出關鍵未知、安排查證優先順序，以及在資料或資源受限時提出選項，仍需要協助。", "能找出領域方向的關鍵未知，依證據、風險與資源完成必要查證。條件不足時協調替代做法與驗證時機；向決策負責人提出選項，追蹤決定與效果。", "面對證據衝突、資料或資源不足，能找出可用依據與必要補查，推進關鍵決策。後續結果能確認試錯減少或使用者問題改善，並持續修正判斷。"], "actions": ["整理假設、證據與缺口，依誤判代價決定查證順序。", "協調研究資源；不足時改用適合資料、縮小範圍或分階段驗證。", "用發現與限制討論決策，追蹤效果及未解問題。"], "observations": ["使用質化資料時：能整合領域內的既有回饋與研究，處理矛盾線索，找出仍需了解的部分；需要且條件允許時安排補查，支持方向判斷。", "使用量化資料時：能判斷領域內的既有數據是否足以回答問題，處理定義、比較條件與資料限制；有缺口時安排可行查證，再提出投入建議。"], "example": "假設情境：團隊想重做訂閱流程，資料顯示可能是重試卡關。你確認資源後安排操作觀察、測試局部修改，協助負責人先修這段；整體轉換效果等資料齊全再追蹤。", "responsibility": "找出影響領域方向的關鍵未知，安排查證並支持投入決策。"}, {"scores": ["能整理跨產品共同問題與差異；判斷證據能否共用、哪些需分別驗證，以及如何支持共同投入時，仍需要協助。", "能分清跨產品共同問題、差異與證據適用範圍。需要時協調資源完成查證，不足時安排替代做法與驗證時機；用發現支持共同決策並追蹤結果。", "面對情境差異、證據衝突或高查證成本，能分清共用與分別判斷的依據。後續團隊能自行判讀、安排查證，結果也顯示共同決策或體驗持續改善。"], "actions": ["比較各產品資料，分清共同發現、情境差異與未知。", "依需要協調查證資源，各團隊可選適合的方法。", "用發現支持共同決策，確認待查問題的負責人與時機。"], "observations": ["使用質化資料時：能比較各產品既有回饋與研究的適用範圍，分清共同發現與情境差異；需要補查時，協調各團隊的時間與資源。", "使用量化資料時：能確認各產品既有數據是否可比，處理指標、族群與產品階段差異；指出需要補足的部分，支持有依據的共同決定。"], "example": "假設情境：兩款產品都有導覽問題。一款的操作觀察足以支持改分類，另一款只有點擊量。你協助分清證據用途，後者在資源允許時補做觀察，再各自決定修改方式。", "responsibility": "判斷跨產品證據的適用範圍，支持共同方向與資源安排。"}], "facet_mode": "method_options"}, {"id": "C5", "name": "溝通協作與設計交付", "source_ids": ["C6", "C7"], "definition": "說清楚設計決策、依據與取捨，理解並回應利害關係人的問題，追蹤待確認事項。安排分工、時程、規格、版本與驗收，有變動時同步更新，讓同事理解設計並順利接手。", "facets": [{"name": "溝通與決策討論", "question": "能否說清楚自己的設計決策、依據與取捨，回應利害關係人的問題，並確認決定與分工？"}, {"name": "工作安排與設計交付", "question": "設計內容、版本、配合順序與驗收條件是否清楚，合作同事能否接著做？"}], "scoring_note": "溝通與交付分開記錄，最後給整項一個分數；符合期待與超出期待都需要兩個面向都符合目前職等的期待。分別看設計決策的說明、提問的回應與後續確認，以及交接和執行安排，並記下所需協助及外部限制。", "clarifications": [{"question": "溝通與交付的熟練程度不同，怎麼評？", "answer": "分開記下兩邊已能獨立完成的部分，以及需要協助的步驟，再對照整項描述。2 符合期待需要兩個面向都完成這個職階的責任；設計說明、回應提問、規格或交接安排中需要支持的部分，可以列為下一步練習。"}, {"question": "利害關係人的問題，一定要當場全部答出來嗎？", "answer": "先確認對方想了解什麼，用已知依據回應。需要查證時，說明待確認的部分、找誰協助與何時回覆，再完成後續確認。Jr. 遇到複雜取捨時可以請同事一起討論；評分看是否讓疑問獲得處理，不要求即席回答所有問題。"}, {"question": "PM 沒接受提案，或工程延誤，就不能達標嗎？", "answer": "看是否說清楚設計依據與取捨、理解並回應對方的顧慮，以及找對決策負責人確認。有變動時，更新範圍、時程與交接安排。不同意見和外部延誤不直接等於低分；要對照你實際負責的溝通與交付工作。"}], "levels": [{"scores": ["能介紹畫面、回答熟悉問題並整理交付；說明設計理由、追蹤提問及補齊交接資訊時，仍需要協助。", "能說明任務的設計理由、回答畫面與操作問題；複雜或未知事項會請同事協助並追蹤。依範圍安排時間，交付畫面、狀態與版本，配合驗收及變更。", "能從提問找出誤解，用對照或示範說清楚設計，交付變動時也能更新規格。後續任務能確認重複補問、版本混淆或交接遺漏減少。"], "actions": ["用目標、畫面與操作說明設計理由，針對同事疑問回答。", "記下待查問題、協助者與回覆時間，確認後更新說明。", "安排討論與修改，整理規格、版本及驗收方式。"], "observations": ["能說清楚明確任務中的設計決策與理由，回答畫面和操作相關問題；需要協助的部分會整理並追蹤回覆。", "能安排自己的交付，提供正確規格與版本，有變動會更新並配合驗收。"], "example": "假設情境：PM 問錯誤訊息為何放在欄位下，你示範如何幫使用者找到修改位置。工程追問帳號重複的處理，你討論確認後補齊流程，再更新規格與驗收條件。", "responsibility": "說明任務的設計理由、回應提問，完成規格與驗收交接。"}, {"scores": ["能說明主要做法並安排部分交付；完整解釋方案依據、處理分歧、範圍變更或交付衝突時，仍需要協助。", "能獨立說明方案依據與取捨，回應利害關係人的問題、追蹤待查事項。確認分工、交付順序、規格、版本與驗收，變更時同步更新。", "面對立場分歧或工作互相等待，能釐清顧慮，用證據或原型協助決策並調整交付。後續變更仍能順利交接，誤解、等待或重做持續減少。"], "actions": ["整理設計決策、依據與替代方案，說明選擇及影響。", "釐清各方顧慮，用證據或示範回答，追蹤待查問題並確認決策。", "安排交付、規格與驗收；變更時確認接手同事能繼續做。"], "observations": ["能獨立說明產品問題中的設計決策、依據與取捨，回應利害關係人的顧慮並完成後續確認。", "能安排完整產品問題的交付順序、規格與驗收，讓合作同事順利接手。"], "example": "假設情境：你建議收合折扣碼區塊，業務擔心難找，工程想確認適用入口。你用觀察與原型說明取捨，跟 PM 安排風險驗證，再交付各入口狀態與驗收條件。", "responsibility": "說清楚產品方案的取捨、回應各方疑問，協調完整設計交付。"}, {"scores": ["能說明熟悉功能與交付安排；整合跨功能取捨、回應各方關切及協調階段驗收時，仍需要協助。", "能說明領域內設計依據與跨功能取捨，回應各方問題並追蹤。釐清決定權，安排階段交付、規格與驗收；需調整資源或範圍時，帶選項找負責人確認。", "面對目標衝突、新舊版本並行或順序變動，能說清楚影響、回應追問並協調交付。後續版本能確認反覆釐清、版本落差或重做減少。"], "actions": ["說明重要設計決策、功能如何配合，以及取捨與影響。", "用流程、證據或方案比較回應顧慮，追蹤待查問題。", "確認決策後安排階段交付，更新相關規格、版本與驗收順序。"], "observations": ["能說明領域內設計決策與跨功能取捨，回應不同利害關係人的問題，確認待查事項和最後決定。", "能安排多功能的階段交付、新舊規格與驗收，處理版本和工作接續。"], "example": "假設情境：你建議區分「已付款」與「已開通」，PM 和客服擔心增加疑惑。你用完整流程說明等待與進度回饋，跟工程確認提醒時機後回覆，再更新會員及付款規格。", "responsibility": "說明領域內跨功能取捨，回應各方問題並安排階段交付。"}, {"scores": ["能提出跨產品方案與交付建議；解釋共同原則、回應採用成本，以及協調分工、時程與驗收衝突時，仍需要協助。", "能說明跨產品決策的依據、共用原則與差異，回應適用性、成本及體驗問題並追蹤。釐清決定權，協調版本、規格與驗收；變更或超出權限時找負責人確認。", "能將跨產品目標、版本或時程衝突整理成選項，協調過渡規格與驗收。後續團隊能依決策理由處理新疑問，誤解、等待或交接遺漏持續減少。"], "actions": ["整理共同原則、必要差異與採用成本，說明設計決策。", "用具體情境回應各方問題，整理分歧並確認決定權。", "協調規格、版本與驗收分工，變更時說明影響並同步更新。"], "observations": ["能清楚表達跨產品設計決策，說明共同原則與必要差異，回應各團隊的顧慮並確認後續決定。", "能協調跨產品版本、過渡規格與驗收安排，讓各團隊清楚接手條件。"], "example": "假設情境：兩款產品接同一套登入服務，其中一款想保留原畫面。你說明共用操作與品牌差異，回應改版成本，請工程確認限制後安排過渡版本與驗收。", "responsibility": "說清楚跨產品方向與差異，回應採用疑問並協調各團隊交付。"}], "show_facets_in_map": false}, {"id": "C6", "name": "AI 探索與應用", "source_ids": ["C8"], "definition": "持續探索並善用 AI，改善需求整理、方案發想、內容與原型製作、設計檢查等工作。自己判斷、檢查並修正產出，比較品質與整體效率，持續調整真正有幫助的用法。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依教學用 AI 完成部分工作；選用法、補背景、檢查產出與比較修改成本時，仍需要協助。", "能主動嘗試適合任務的 AI 用法，提供背景與限制，檢查修正後用到工作。說明品質或效率如何改善，並依結果調整。", "遇到 AI 產出不合用或修改費時，能找出原因、調整用法。後續任務能確認時間、遺漏或重做減少，品質維持或提升，並分享有效做法。"], "actions": ["選一個耗時或易漏的步驟，記下原做法與品質要求。", "提供背景讓 AI 協助，對照需求檢查並修正產出。", "比較成果與修改在內的總時間，下次再確認是否適用。"], "example": "假設情境：你請 AI 依欄位規則列出錯誤情境與文案，再刪除不適用建議、修正語氣。記下整理及修改時間，下次表單再比較效率與遺漏是否改善。", "observations": [], "responsibility": "在自己的任務中嘗試 AI，檢查產出並比較品質或效率。"}, {"scores": ["能用 AI 完成熟悉步驟、檢查明顯問題；選擇值得嘗試的環節、調整交接及確認整體效果時，仍需要協助。", "能在產品設計中主動找出 AI 應用機會，實際嘗試並調整。檢查修正產出，讓成果符合需求，並用前後比較確認品質或整體效率改善。", "當 AI 加速製作卻增加修改或交接負擔，能調整工具與做法。後續任務能確認總時間、遺漏或重做減少，品質符合要求，並說清楚適用條件。"], "actions": ["選出值得改善的設計環節，訂好品質要求與比較方式。", "實際用 AI 完成任務，檢查並修正內容、畫面或互動。", "比較製作、檢查、修改與交接成本，持續調整用法。"], "example": "假設情境：你讓 AI 依元件製作兩版搜尋原型，自行補上載入、無結果與返回操作。確認都能完成任務後，比較製作、修改與交接時間，留下適用做法。", "observations": [], "responsibility": "找出產品設計中適合 AI 的環節，確認品質或整體效率改善。"}, {"scores": ["能提出熟悉工作的 AI 用法；找出領域共同需求、安排同事試用及整合檢查與交接時，仍需要協助。", "能找出領域內 AI 應用機會，安排試用並調整流程。跟同事確認檢查與交接方式，比較含修改成本的品質與效率，延續有效用法。", "能解決功能、規則或工作方式差異造成的 AI 出錯與交接問題。後續採用能確認整段流程的品質或效率改善，效果不佳時也會調整或停用。"], "actions": ["找出領域內耗時、易漏或常重做的設計工作。", "和同事用實際任務試做，確認背景、檢查與交接方式。", "追蹤後續採用效果，改進有效用法、停用效果差的做法。"], "example": "假設情境：新增方案常漏改結帳或會員頁。你用 AI 列出受影響畫面，找 PM、設計與工程試用並人工修正。後續版本比較整理、審查與重做時間，以及漏改情況。", "observations": [], "responsibility": "帶著同事試用 AI，改善領域內耗時、易錯的設計流程。"}, {"scores": ["能提出跨產品 AI 應用建議；判斷推廣價值、適應團隊條件及確認整體效果時，仍需要協助。", "能持續探索跨產品 AI 用法，針對共同問題和各團隊試做。依產品差異調整用法與檢查，推動採用並確認品質或效率改善。", "能排除規則、流程與工具差異造成的採用障礙，確認含修改及維護成本的品質或效率改善。後續團隊能自行評估新工具，調整、更新或停用。"], "actions": ["比較各產品的共同瓶頸，選出值得一起嘗試的 AI 用法。", "各團隊用實際任務試做，確認差異、成果與完整成本。", "追蹤採用效果，讓團隊能自行檢查、調整與評估新工具。"], "example": "假設情境：兩個團隊都想加快原型製作。你讓有元件庫的團隊試用 AI 沿用元件，另一團隊用 AI 比較版型；各自記錄製作、修正與交接時間，依成果調整後續用法。", "observations": [], "responsibility": "推動跨產品 AI 應用，依團隊差異調整並確認採用效果。"}], "clarifications": [{"question": "每個任務都要用 AI，或學很多工具嗎？", "answer": "看整段期間是否持續探索、把適合的用法放進實際工作，再依結果改進。每個任務不必硬用 AI，也不按工具數量或使用次數評分；要說明自己嘗試了什麼、如何判斷，以及帶來的品質或效率變化。"}, {"question": "怎麼確認 AI 真的有幫助？", "answer": "用相近任務比較前後成果，時間要算進檢查、修改和交接，品質可看資訊是否正確、狀態是否完整、重做是否減少。能提升品質或效率都可以，但省時後仍要符合任務的品質要求；只有產出草稿更快，還不足以說明整體改善。"}, {"question": "一定要用 AI 做原型或寫程式嗎？", "answer": "應用可以是整理需求、探索方案、製作內容或原型、檢查設計與交付。依實際工作選擇有幫助的用途；如果做原型，要說清楚哪些是模擬，正式程式與上線則依專案分工。"}]}, {"id": "C7", "name": "設計系統與知識共用", "source_ids": ["C9"], "definition": "用對現有元件、規則與案例，將重複需求整理成可共用的內容。說清楚用途、限制與維護方式，確認設計與實作一致，並讓後續工作減少重做；依需要共用，不要求每案新增元件或所有產品用同一套系統。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依範例使用元件與規則；選擇變體、補齊狀態、命名及說明例外時，仍需要協助。", "能正確使用元件、規則與命名，檢查變體和狀態。不適用時說明缺口，留下清楚的交付與例外說明。", "能多次找出元件、命名或說明容易被誤用的地方，確認後補充修改。後續任務能減少同類誤解與重做，並維持一致性。"], "actions": ["查現有元件與範例，確認版本及適用情境。", "依規則命名、使用變體，避免重複建立元件。", "附上不適用的情境與畫面，找負責人確認。"], "example": "假設情境：收藏似乎需要第三種按鈕樣式，你先檢查現有變體，再把無法表達的狀態交給元件負責人確認。", "observations": [], "responsibility": "用對現有元件與規則，補齊任務狀態，提出不適用的情況。"}, {"scores": ["能用熟悉元件完成主要畫面；判斷新情境、補足缺口及說明替代做法與限制時，仍需要協助。", "能判斷元件與規則是否適用，用對既有內容或提出替代做法。交付時說清楚狀態、用途與限制，減少重複或不一致。", "能把重複需求整理成可沿用的元件、規則或案例，說清楚適用範圍。後續實際使用與調整能減少重複解釋、製作或品質問題。"], "actions": ["先查既有規則，判斷能否直接使用。", "新增或修改前，說明缺口、狀態與適用範圍，找負責人確認。", "觀察後續使用，修正難懂或不適用的內容。"], "example": "假設情境：多個表單反覆出現錯誤提示問題。你整理提示位置與文案規則，在下一個表單沿用並依回饋修改，留下兩次交付紀錄。", "observations": [], "responsibility": "判斷現有內容是否適用、補足缺口，讓成果能被接手與沿用。"}, {"scores": ["能整理元件或案例；判斷領域共用需求、處理工程差異與例外，以及安排維護時，仍需要協助。", "能針對領域重複問題，選用或補強共用元件、規則與案例。說清楚用途、限制及維護方式，讓後續工作實際採用。", "能解決規則、需求與工程實作的落差，安排修改與回報。後續內容持續被使用、更新，同事能自行擴充，重做或不一致也減少。"], "actions": ["找出重複問題，確認既有內容與擴充需要。", "補齊情境、狀態、限制、工程對應與維護分工。", "追蹤實際使用，確認重做或不一致是否減少。"], "example": "假設情境：你補齊表單元件的錯誤狀態，跟工程確認一致，再追蹤後續功能的使用、問題回報與維護。", "observations": [], "responsibility": "整理領域共用內容，安排維護，確認後續工作用得上。"}, {"scores": ["能提出跨產品共用建議；比較效益、團隊差異與維護成本，確認適用範圍及分工時，仍需要協助。", "能判斷跨產品共用價值，確認適用範圍、例外與維護分工。推動實際採用、確認設計與工程一致，依使用問題調整並保留合理差異。", "能解決需求與技術差異造成的使用、更新困難，兼顧一致性與例外。後續團隊能自行擴充維護，實際紀錄也顯示重複製作或品質問題減少。"], "actions": ["比較共用元件、共用原則與分開處理的成本。", "推動有幫助的內容被採用，確認例外及維護負責人。", "追蹤使用與擴充，確認設計和實作一致。"], "example": "假設情境：多款產品反覆重做價格資訊。你整理共用規則、保留各自排版，確認維護分工，再追蹤團隊能否自行沿用與擴充。", "observations": [], "responsibility": "選擇跨產品共用內容，協調擴充與維護，推動持續採用。"}], "clarifications": [{"question": "一定要建 Design System，或做新元件嗎？", "answer": "先把適用的現有內容用對，也能提供評分證據。較高分會看後續是否真的有人使用、使用問題有沒有改善，以及是否持續更新。可以共用原則或案例，也可以保留產品差異；C8 再另外看同事的判斷能力是否進步。"}], "discussion_tag": "考慮與 C2 合併"}, {"id": "C8", "name": "主動當責與專業影響力", "source_ids": ["C10"], "definition": "主動提出並承接責任範圍內的問題，遇到阻礙會尋求協助、跟進處理。依結果修正判斷，把經驗用在後續工作；資深職等也要透過合作、審查或指導，幫助同事和團隊自行判斷、持續改善。", "facets": [], "scoring_note": "", "levels": [{"scores": ["能依提醒提出問題並修正；主動判斷影響、尋求協助、追蹤進度及運用回饋時，仍需要引導。", "能主動提出任務問題，說明判斷與所需協助，完成自己的修正並跟進。依回饋調整做法，將經驗用在下一次工作。", "遇到做法或分工不清，能整理影響與可承接部分，帶著建議確認並跟進。調整工作習慣後，同類遺漏與需要提醒的情況持續減少。"], "actions": ["及早提出問題、影響與判斷，說明需要誰協助。", "完成自己負責的修正，確認範圍外問題的接手人與進度。", "檢討遺漏原因，調整做法並在下次任務確認。"], "example": "假設情境：交付表單後，你發現錯誤提示會清空輸入，主動告知 PM 與工程、補上設計並確認修改。之後將資料保留加入檢查，觀察是否減少遺漏。", "observations": [], "responsibility": "主動提出任務問題並跟進，把回饋用在後續工作。"}, {"scores": ["能修正已發現的產品問題；主動釐清沒人接手的部分、持續跟進，或在結果不如預期時修正判斷，仍需要協助。", "能主動承接產品問題，提出遺漏與可行做法，確認分工並跟進。依實際結果修正判斷，把有效經驗用在後續工作。", "面對反覆擱置、判斷被推翻或中途出現限制，能調整做法並推進下一步。後續同類問題減少，合作同事也能運用這些經驗。"], "actions": ["查看後續回饋，提出未處理問題的影響與建議。", "確認承接與協助分工，追蹤到問題處理或有明確決定。", "對照結果與原判斷，修正做法並分享經驗。"], "example": "假設情境：取消訂閱上線後，使用者仍誤解權益何時結束。你主動查看回饋、承接說明調整，跟 PM 確認後追蹤效果，再將經驗用在其他權益文案。", "observations": [], "responsibility": "主動補上產品問題中的遺漏，釐清分工並跟進，依結果修正判斷。"}, {"scores": ["能推進熟悉問題並分享經驗；處理跨功能反覆問題，並透過指導幫同事自行判斷時，仍需要協助。", "能主動推動領域改善、確認分工並跟進阻礙。檢討自己的判斷，透過合作、審查或指導，讓同事逐步自行處理類似問題。", "遇到問題反覆發生、做法失效或同事難以判斷，能找出原因並調整處理與指導方式。後續問題減少，同事能自行比較選項、推進處理並傳遞經驗。"], "actions": ["提出反覆或無人承接的問題，說明影響與可做的事。", "確認方向並跟進，遇到限制時調整做法或尋求協助。", "透過審查與合作教同事判斷，再觀察是否能自行運用。"], "example": "假設情境：付款失敗流程常到驗收才補，你檢討審查方式，和同事練習判斷失敗情境並修正。下一個功能讓同事自行整理，再確認遺漏是否提早補齊。", "observations": [], "responsibility": "推動領域反覆問題的改善，指導同事自行判斷與處理。"}, {"scores": ["能推進初步跨產品改善；處理長期責任缺口、調整指導方式，讓各團隊自行延續時，仍需要協助。", "能主動推動跨產品改善，確認責任、協調支持並跟進。依結果修正主張，透過合作或指導，讓各團隊理解適用範圍並自行運用。", "遇到長期無人承接、做法衝突或改善中斷，能檢討並調整主張與推動方式。後續團隊能自行找出缺口、承接及檢討，共同問題減少，經驗也能傳給其他團隊。"], "actions": ["找出跨產品共同問題，主動提出推動方式與分工建議。", "確認決策支持與責任，追蹤改善，依產品差異及結果調整。", "讓團隊自行判斷與修正，持續觀察並提供協助。"], "example": "假設情境：兩款產品的權益說明常過期，各方卻都以為別人會檢查。你協調變更與檢查責任，依各產品情況調整做法；後續新方案由團隊自行檢查，過期說明逐漸減少。", "observations": [], "responsibility": "推動跨產品共同改善，協調責任，讓團隊自行延續。"}], "clarifications": [{"question": "同一個案子，C5 和 C8 怎麼分別評？", "answer": "C5 看設計討論、分工、規格與驗收是否清楚，合作同事能否順利接手；C8 看是否主動承接問題、依結果修正自己的判斷，以及把改善用到後續工作。可以用同一案子的不同紀錄說明，但單純準時交件不會讓兩項一起拿高分。"}, {"question": "當責代表所有問題都要自己扛嗎？", "answer": "在自己的責任與決定權內承接；超出範圍時，提出影響和建議，找有權限的人確認分工與資源，並跟進後續決定。評分看實際採取的行動，不要求加班、越權，或保證自己無法控制的結果。合理提出停止或延後，也可以是負責的判斷。"}, {"question": "只有自己一位設計師，怎麼展現專業影響力？", "answer": "Jr.、Md. 可以從自己的任務、修正判斷和後續改善累積，不必另外找人指導。Sr.、Principal 可以在正常工作中與 PM、工程或其他事業單位的設計師合作、審查或分享，讓對方實際運用。主管應協助安排相應機會與支持，x-lab 也一樣。"}, {"question": "和公司價值觀有重複嗎？", "answer": "公司價值觀沿用既有名稱與評估規則。C8 依目前職等，看具體工作中的承接、判斷修正與專業影響；要有行動和後續紀錄，不另外用「態度積極」或「很有責任感」直接給分。"}]}], "common_rules": [{"title": "這份職能地圖怎麼用", "text": "這份三段試評稿分成 8 項共同職能，每項都有四個職階的責任、做法與三段行為描述。先選目前職階，再對照實際工作紀錄，討論表現和下一步。正式考核制度還需要主管確認。先前的四角色 AI 模擬討論針對原 10 項版本，沒有重新審閱這次的三段文字。"}, {"title": "三段評等怎麼區分", "text": "1 能力發展中：已能做到部分工作，但本階的重要責任尚未穩定完成，需要具體引導或協助。2 符合期待：能穩定完成本階責任，包括合理判斷、品質檢查、合作與追蹤。3 超出期待：穩定達標之外，在較難情境中帶來可確認、能延續的改善。正常向 PM 確認目標、向工程師確認可行性及參與設計審查，不會因此被評低分。Jr. 的問題定義與複雜取捨，本來就可以由他人協助。"}, {"title": "職等銜接與表現評等，分開看", "text": "職等比較看責任如何從明確任務、一個產品問題，擴大到產品或領域及跨產品。每一項評等都只對照目前職等的責任；高一階的 1 不等於前一階的 2，也不預設已達成前一階全部要求。3 超出期待要有額外判斷與後續成果，不以文件、工具或工時數量決定，也不要求每項建立制度。是否晉升另外看下一階責任的實際表現。"}, {"title": "C4 看證據與研究判斷；C5 看溝通與交付", "text": "C4 先看設計判斷是否有適用的證據。既有回饋、數據或研究結果已足夠時，可以直接使用；需要更了解使用者或驗證設計，且時間與資源允許時，應安排質化或量化研究，可擇一或搭配。超出期待也不要求每案新增研究或湊齊兩種方法。C5 的溝通與決策討論、工作安排與設計交付，則是兩個都要負責的面向，符合期待與超出期待都需要兩邊達標。兩項都各給一個分數。缺少合理機會而無法判斷整項時，保留已有紀錄，標未觀察並安排補足。"}, {"title": "先確認評估期間與工作條件，再看整段表現", "text": "評估前，主管和設計師一起確認這段時間負責哪些工作、完成標準，以及可以取得的時間、資料和協助。評分時看整段期間的實際完成方式與需要的支持，不以單次失誤或一次需要提醒就決定分數。缺少資源或工作機會的部分，要分開記錄並安排補足。"}, {"title": "先說清楚這次要做到哪裡", "text": "任務開始時，先確認使用對象、流程起點與終點、負責範圍、相關平台和品質要求。完整是把這次需要的情況處理好，不是每個案子都要有跨平台、多角色或所有狀態。發現範圍外的風險時，仍要說明，並確認由誰接著處理。"}, {"title": "負責推動工作，和最後拍板是不同責任", "text": "設計師主導專業工作，包括提出問題和選項、找相關同事討論，以及追蹤決定和實作。資源、優先順序、上線和是否停止投入，要由專案中有這項決定權的負責人確認。提案沒被接受或遲遲沒回覆時，看你是否有合理判斷、及時找人協調並跟進；不要求越權，也不能把還沒採用的提案算成已完成的改善。"}, {"title": "證據能說明到哪裡，就評到哪裡", "text": "上線前測試、可操作原型和上線後資料都可以當證據，但要說清楚能回答的問題。原型能看出使用者懂不懂、能不能操作，還不能直接證明正式轉換、留存或營收。推翻假設、停止無效方案也可以是好的判斷。數字變好不會自動高分；前後有變化，也不一定就是這次設計造成的。"}, {"title": "缺少機會時，要一起安排怎麼補足", "text": "缺任務、時間、資料權限、工程協助或交流機會時，記下缺什麼、已經做了什麼、有哪些替代方式、誰會協助，以及何時再看。已有足夠證據就依實際表現評分；無法判斷整項才標未觀察，已有證據仍保留。C4 沒做另一種研究方法不會直接變成未觀察，替代資料也只能支持它實際能回答的問題。主管應在正常工作內安排機會，避免一直等不到，或到期末才突然增加要求。"}, {"title": "同一個案子可以用在多項，但要說明不同能力", "text": "每項要說清楚自己的責任、行動與結果。同一案子可以提供不同能力的紀錄：C1 看問題與取捨判斷，C4 看證據解讀與應用，C5 看溝通、規格與交接安排，C8 看主動承接、修正判斷及後續影響。不能只因準時交件或案子上線，就讓多項一起拿高分；團隊與他人的貢獻也要分開說明。"}, {"title": "不同事業單位，用同一套共同標準", "text": "各事業單位和 x-lab 的產品、階段與任務可以不同，評分仍對照相同的職階責任與共同職能。探索中的產品可以用查明了什麼、因此決定做或不做什麼來說明成果；成熟產品則可以用實際改善與後續使用情況說明。"}, {"title": "持續探索 AI，確認實際幫助", "text": "C6 看整段期間如何探索並善用 AI，提升設計品質或工作效率。要有實際嘗試、產出檢查與後續調整，不按工具數量或使用次數評分，也不要求每個任務都使用。比較效率要包含檢查、修改與交接成本，成果仍須符合任務要求。原型要說明模擬限制；正式程式與上線依專案分工。"}, {"title": "從主動承接，到帶動後續改善", "text": "C8 看如何在目前職等的責任內主動提出與承接問題、依結果修正判斷，並讓改善延續。Jr.、Md. 從自己的任務與產品問題累積；Sr.、Principal 也要透過合作、審查或指導，幫助同事及團隊自行判斷。不要求有部屬或開課；事業單位只有一位設計師或在 x-lab，主管仍應協助安排正常工作內的合作機會、相應決定權與資源。"}, {"title": "先看各項分布，再討論發展與晉升", "text": "三段試評呈現各項評等、已評項目數與未觀察項目，不計算總分、平均、百分比或整體高低分級。舊五分的分數不能直接換算，請用原工作案例重新對照。發展中項目要說明需要的支持，超出期待要有具體成果；不能用另一項的高表現抵銷尚未做到的責任。正式考核如何彙整，以及晉升的評估期間與判斷方式，仍需要確認。"}], "pending_decisions": ["三段試評是否適合正式採用、如何彙整各項判斷、看多長的期間，以及由誰一起用實際案例校準「穩定／持續」的標準。", "C4 採用的方法、結果與限制，以及 C5 的溝通和交付分別怎麼記錄；證據仍不足或缺少合理機會時，正式評分與晉升怎麼處理。", "各專案的優先順序、MVP、成功指標、資源、上線和停止投入，由誰決定；卡住時找誰協調。", "事業單位只有一位設計師、x-lab 或跨團隊工作時，由哪些主管提供時間、任務、資料和工程協助。", "Product Builder 若需要提交正式程式、整合或上線，先寫清楚適用職務、提供的協助，以及驗收條件。", "管理職的招募、人力安排、績效和培育制度另行定義；專業職四階不會默認包含這些責任。"], "mapping_v3": [["舊版 v3 項目", "這版對應項目", "調整方式"], ["工作大小", "C1、C5", "看責任、複雜度、取捨與設計交付；工時用來排程。"], ["元件使用", "C7 設計系統與知識共用", "保留正確使用、判斷是否適用，以及後續是否繼續使用。"], ["設計品質與一致性", "C2 UI 品質與資訊呈現", "看資訊呈現與實作品質；後續共用另看 C7。"], ["流程與資訊架構", "C3 流程與互動設計", "看操作路徑、狀態、例外，以及失敗後怎麼繼續。"], ["使用者體驗與互動設計", "C2、C3", "分開看資訊是否清楚、操作是否完整。"], ["用戶研究", "C4 質化或量化研究", "研究與驗證整理在同一項；依問題選質化或量化，記錄方法、實際結果與應用，不要求兩種都做。"], ["數據", "C4 質化或量化研究", "研究與驗證整理在同一項；依問題選質化或量化，記錄方法、實際結果與應用，不要求兩種都做。"], ["需求分析與產品策略", "C1 問題釐清", "看如何判斷問題、方向、範圍和代價。"], ["跨部門溝通與協作", "C5 溝通協作與設計交付", "看設計決策能否說清楚、利害關係人的問題是否獲得回應，以及交付能否順利接續。"], ["簡報會議", "C5 溝通協作與設計交付", "看能否說明設計決策、依據與取捨，回應提問並確認後續；不按聽眾職稱決定職階。"], ["領導", "C8 主動當責與專業影響力", "以主動承接與持續改善為基礎，資深職等也看同事和團隊能否運用；保留專業指導，正式人員管理另外定義。"], ["當責", "C8 主動當責與專業影響力", "看主動承接問題、依結果修正判斷，以及後續改善；C5 另看協作與交付安排，公司價值觀沿用既有規則。"], ["新增能力", "C6 AI 探索與應用", "聚焦持續探索並善用 AI，將嘗試用在實際工作，檢查產出並確認設計品質或整體效率的改善。"]], "mapping_v4": [["前一版 10 項（舊編號）", "本版對應（新編號）", "調整"], ["C1 問題理解與取捨", "C1 問題釐清", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C2 UI 品質與資訊呈現", "C2 UI 品質與資訊呈現", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C3 流程與互動完整性", "C3 流程與互動設計", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C4 用戶理解與證據判讀＋C5 驗證與持續迭代", "C4 質化或量化研究", "研究與驗證整理在同一項；依問題選質化或量化，記錄方法、實際結果與應用，不要求兩種都做。"], ["C6 協作與決策溝通＋C7 交付與工作管理", "C5 溝通協作與設計交付", "聚焦設計決策的說明、利害關係人提問的回應，以及分工、規格與交付安排。兩個面向各自觀察，整項給一個分數；主動承接與後續影響另看 C8。"], ["C8 AI、原型與工具應用", "C6 AI 探索與應用", "聚焦持續探索並善用 AI，將嘗試用在實際工作，檢查產出並確認設計品質或整體效率的改善。"], ["C9 設計系統與知識重用", "C7 設計系統與知識共用", "保留原有能力，更新編號，說清楚和相近項目各自看什麼。"], ["C10 專業指導與影響", "C8 主動當責與專業影響力", "擴大為主動承接、修正判斷與持續改善；資深職等保留透過合作、審查或指導帶動團隊的要求。"]], "context": {"roles": [["項目", "職能 1｜Jr. Designer", "職能 2｜Md. Designer／Product Designer", "職能 3｜Sr. Designer／Product Builder", "職能 4｜Principal Designer"], ["角色定位", "在明確目標下，獨立完成設計任務", "獨立解決範圍明確的產品問題", "主導一個產品或領域，找出機會並完成改善", "主導跨產品的體驗方向，解決共同問題"], ["負責範圍", "單一任務、功能或範圍清楚的一段流程", "完整使用流程或產品問題，從釐清到驗證", "產品或領域內互相影響的問題、優先順序與後續改善", "多個產品的共同體驗、系統與重要取捨"], ["如何獨立工作", "自己完成設計；釐清問題和複雜取捨時可請人協助", "自己釐清問題、比較方案；大幅調整範圍時一起討論決定", "主動提出做什麼、為什麼做、怎麼驗證，依專案分工完成", "提出跨產品方向，協調各方做出決定，並跟進實際使用"], ["品質責任", "自己交付的流程、畫面、狀態和規格", "負責問題的完整體驗與上線品質", "領域內的品質、重要設計決定和持續改善", "跨產品的品質原則與共同體驗問題"], ["期待成果", "符合任務目標，穩定交付，能依回饋修改", "確認問題有沒有改善，根據結果調整", "讓產品或領域有實際成果，並決定下一步", "改善跨產品問題，讓多個團隊持續受益"], ["如何幫助同事", "說明設計理由，把回饋用到工作上", "給同事有依據、做得到的建議", "透過指導與審查，幫助同事改善判斷", "讓多個團隊實際使用共同原則與方法，持續提升設計能力"], ["管理責任", "沒有正式人員管理要求", "沒有正式人員管理要求", "需要專業指導，不要求有直屬部屬或負責績效管理", "需要跨團隊專業影響，不要求有直屬部屬或負責績效管理"]], "scale": [["評等", "定義", "判斷重點"], ["1 能力發展中", "已能完成部分工作，但本職階的重要責任尚未穩定做到，需要引導或協助。", "說清楚已能做到什麼、哪些重要判斷或後續處理需要練習，以及誰能協助。"], ["2 符合期待", "能穩定完成本職階責任，做出合理判斷、自行檢查並完成合作與後續追蹤。", "這是本職階的達標表現。正常討論、請教與依權 }
function facetsUI(item,compact=false){
 if(!item.facets.length||(!compact&&item.show_facets_in_map===false))return '';
 const guide=item.levels[level];
 const methodOptions=item.facet_mode==='method_options';
 const heading=methodOptions?'依問題選用資料或研究方法':'評分時，兩個面向都要看';
 return `<div class="facet-guide"><b>${heading}</b>${methodOptions?'<p>質化或量化可擇一或搭配，既有資料足夠時可直接使用。</p>':''}${item.facets.map((f,i)=>`<div><strong>${esc(f.name)}</strong><p>${esc(guide.observations[i])}</p></div>`).join('')}</div>`;
}
function cardsUI(){
 const q=query.trim().toLowerCase();
 const rows=ITEMS.filter(i=>/^c\d+$/.test(q)?i.id.toLowerCase()===q:(i.id+i.name+i.definition+i.levels[level].scores.join('')+i.levels[level].actions.join('')+i.facets.map(f=>f.name).join('')).toLowerCase().includes(q));
 $('#cards').innerHTML=rows.length?rows.map(item=>{
  const guide=item.levels[level];
  return `<article class="card"><h3 class="card-title"><span>${esc(item.id)}／${esc(item.name)}</span>${item.discussion_tag?`<span class="badge discussion-tag">${esc(item.discussion_tag)}</span>`:''}</h3>
  <div class="definition"><b>這項職能在看什麼？</b><p>${esc(item.definition)}</p></div>
  ${facetsUI(item)}
  <div class="action-guide"><b>這一階，我可以怎麼做？</b><ol>${guide.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ol><small>可以從這些做法開始；評分時仍要看實際表現和工作紀錄。</small></div>
  <details class="example"><summary>看一個工作例子</summary><p>${esc(guide.example)}</p><small>這是用來解釋做法的假設情境，實際分數仍要對照整段期間的表現。</small></details>
  <h4 class="rubric-heading">${titles[level]} · 三段評等標準</h4>
  <p class="role-responsibility"><b>這一階負責什麼：</b>${esc(guide.responsibility)}</p>
  <div class="rubric">${guide.scores.map((v,i)=>`<div class="rubric-row ${i===BASELINE_INDEX?'baseline':''}"><b>${i+1} · ${scoreNames[i]}</b><div>${esc(v)}</div></div>`).join('')}</div>
  <details><summary>評分時可能會想問</summary>${item.clarifications.map(c=>`<p><b>${esc(c.question)}</b></p><p>${esc(c.answer)}</p>`).join('')}</details>
  </article>`;
 }).join(''):'<div class="empty">沒有符合的職能，試試其他關鍵字。</div>';
}
function comparisonUI(){
 const item=ITEMS.find(i=>i.id===comparisonId);
 const comparisonLevels=visibleLevelIndexes.map(i=>({index:i,guide:item.levels[i]}));
 const shownScores=comparisonMode==='all'?scoreNames.map((_,i)=>i):[BASELINE_INDEX];
 const row=(label,cells,className='')=>`<tr class="${className}"><th scope="row">${label}</th>${cells.map(cell=>`<td>${cell}</td>`).join('')}</tr>`;
 const scope=row('這一階<br>負責什麼',comparisonLevels.map(({guide})=>esc(guide.responsibility)),'comparison-scope');
 const rubrics=shownScores.map(i=>row(`${i+1}<small>${esc(scoreNames[i])}</small>`,comparisonLevels.map(({guide})=>esc(guide.scores[i])),i===BASELINE_INDEX?'comparison-baseline':'')).join('');
 const examples=comparisonExamples?row('我可以怎麼做',comparisonLevels.map(({guide})=>`<ol>${guide.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ol>`))+row('工作例子',comparisonLevels.map(({guide})=>esc(guide.example))):'';
 $('#compare').innerHTML=`<div class="comparison-intro"><h2>同一項職能，三個職等怎麼不同？</h2><p>職等 1 暫時隱藏；目前比較 Md.、Sr. 與 Principal。橫向看職等責任，縱向看三段評等。</p></div>
 <div class="comparison-controls">
  <label class="comparison-select" for="compare-item">選擇職能<select id="compare-item">${ITEMS.map(i=>`<option value="${i.id}"${i.id===comparisonId?' selected':''}>${esc(i.id)}／${esc(i.name)}</option>`).join('')}</select></label>
  <div class="comparison-modes" role="group" aria-label="比較哪些評等"><button type="button" data-comparison-mode="baseline" aria-pressed="${comparisonMode==='baseline'}" class="${comparisonMode==='baseline'?'active':''}">2／符合期待</button><button type="button" data-comparison-mode="all" aria-pressed="${comparisonMode==='all'}" class="${comparisonMode==='all'?'active':''}">完整三段評等</button></div>
  <label class="comparison-toggle"><input id="compare-examples" type="checkbox"${comparisonExamples?' checked':''}>一起看做法與案例</label>
 </div>
 <div class="definition comparison-definition"><h3 class="card-title"><span>${esc(item.id)}／${esc(item.name)}</span>${item.discussion_tag?`<span class="badge discussion-tag">${esc(item.discussion_tag)}</span>`:''}</h3><p>${esc(item.definition)}</p></div>
 <p class="comparison-hint">評等只對照目前職等。3 超出期待須先穩定達標，並有持續改善，不代表直接晉升。${comparisonExamples?'例子皆為假設情境。':''}<span>表格可左右滑動，內容完整展開。</span></p>
 <div class="comparison-scroll" tabindex="0" role="region" aria-label="${esc(item.id)} 三個職等比較表，可左右滑動">
  <table class="comparison-table"><caption class="visually-hidden">${esc(item.id)}／${esc(item.name)}：${comparisonMode==='all'?'完整三段評等':'2 符合期待'}，三個職等比較</caption><colgroup><col class="comparison-label">${comparisonLevels.map(()=>'<col>').join('')}</colgroup><thead><tr><th scope="col">比較項目</th>${comparisonLevels.map(({index})=>`<th scope="col"><small>職等 ${index+1}</small>${esc(titles[index])}</th>`).join('')}</tr></thead><tbody>${scope}${rubrics}${examples}</tbody></table>
 </div>`;
 $('#compare-item').onchange=e=>{comparisonId=e.target.value;comparisonUI();syncRoute();$('#compare-item').focus()};
 document.querySelectorAll('[data-comparison-mode]').forEach(b=>b.onclick=()=>{comparisonMode=b.dataset.comparisonMode;comparisonUI();$(`[data-comparison-mode="${comparisonMode}"]`).focus()});
 $('#compare-examples').onchange=e=>{comparisonExamples=e.target.checked;comparisonUI();$('#compare-examples').focus()};
}
function reviewUI(){
 $('#review').innerHTML=`<div class="panel"><h2>先看目前表現，再看下一階需要什麼。</h2><p>先試評 ${titles[level]} 的 ${N} 項職能，看看哪些已穩定做到、哪些需要練習。目前顯示的三個職等分開暫存，重新整理後會清除。</p>
 <div class="notice"><b>C4、C5 怎麼評？</b><br>C4：先看既有證據是否足夠；需要補充了解或驗證、時間資源也允許時，再安排質化或量化研究。<br>C5：溝通與交付都符合本職階要求，才能評為 2 符合期待或 3 超出期待。<br>缺少合理機會、仍不足以判斷整項時，先標未觀察並安排補足。</div>
 <div class="calc"><div>${ITEMS.map((item,i)=>`<div class="score-block"><div class="score"><label for="s${i}">${item.id} ${esc(item.name)}</label><select id="s${i}" data-score="${i}"><option value="">未觀察</option>${scoreNames.map((name,j)=>`<option ${scores[level][i]==j+1?'selected':''} value="${j+1}">${j+1} · ${esc(name)}</option>`).join('')}</select></div>${facetsUI(item,true)}</div>`).join('')}</div><div class="result" id="result" aria-live="polite"></div></div>
 <p class="label">這版先看各項評等分布。請用實際案例重新對照三段標準，舊五分的分數不能直接換算。</p></div>
 <details><summary>評分前，要一起確認什麼？</summary>${commonRules()}</details>
 <details><summary>三段評等的共同定義</summary>${table(DATA.context.scale)}</details>
 <div class="panel"><h2>要晉升，需要累積哪些成果？</h2>${table(DATA.context.promotion)}<div class="notice">晉升另外看下一階責任的實際表現。正式考核如何彙整、評估期間，以及未觀察項目怎麼處理，還需要主管確認。</div></div>`;
 document.querySelectorAll('[data-score]').forEach(s=>s.onchange=()=>{scores[level][+s.dataset.score]=['1','2','3'].includes(s.value)?s.value:'';resultUI()});resultUI();
}
function resultUI(){
 const groups=scoreNames.map((_,j)=>ITEMS.filter((item,i)=>String(scores[level][i])===String(j+1)));
 const observed=groups.reduce((n,g)=>n+g.length,0);
 const missing=ITEMS.filter((item,i)=>!['1','2','3'].includes(String(scores[level][i])));
 $('#result').innerHTML=`<span>${observed===0?'尚未開始':observed<N?'部分完成':'已完成試評'}</span><strong>${observed} / ${N}</strong><p>已評職能</p><div class="rating-distribution">${groups.map((g,j)=>`<div data-rating-count="${j+1}"><b>${j+1} · ${esc(scoreNames[j])}</b><span>${g.length} 項</span><small>${g.length?g.map(i=>esc(i.id)).join('、'):'—'}</small></div>`).join('')}<div data-rating-count="unobserved"><b>未觀察</b><span>${missing.length} 項</span><small>${missing.length?missing.map(i=>esc(i.id)).join('、'):'—'}</small></div></div><p>先逐項確認需要的協助與後續行動；這裡不以總分或百分比判定整體表現，也不自動判斷晉升。</p>`;
}
function rulesUI(){
 $('#rules').innerHTML=`<div class="panel"><h2>公司價值觀 · Company Values</h2><p>沿用公司的 Inconsistent（不一致）、Successful（成功）、Exceptional（卓越），跟專業能力分開評估。</p>${table(DATA.context.values)}<div class="notice">要看整段期間的表現。Successful 需要絕大多數時間都符合；Exceptional 則要在這個基礎上，經常帶來額外的正面影響。依公司規則，只要任一情境被判為 Inconsistent，該價值觀就判為 Inconsistent；有 NoShow（沒有觀察到相關行為）的情境，通常不應給 Exceptional。資料不足時先記下待補內容。</div></div>
 <details open><summary>Sr.、PM 和工程，分別負責什麼？</summary><p>以下是分工建議。專案開始時，要確認實際由誰負責、誰做最後決定，以及卡住時找誰協調。</p>${table(DATA.context.responsibilities)}</details>
 <details><summary>任務大小怎麼看？</summary>${table(DATA.context.complexity)}<p>看問題的複雜度和負責範圍，工時用來排程。AI 讓製作變快，不代表問題就變簡單。正式人員管理會另外訂管理職標準。</p></details>
 <details><summary>還需要一起確認的事</summary><ul>${DATA.pending_decisions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>`;
}
function changesUI(){
 $('#changes').innerHTML=`<div class="panel"><span class="badge">三段試評版</span><h2>每個職等，先看發展中、符合期待與超出期待。</h2><p>保留 ${N} 項職能、四階責任與做法，共 ${N*4*RATING_COUNT} 條評等描述。符合期待延續原本的達標要求；能力發展中與超出期待重新整理，讓各段差異更清楚。舊分數需要用實際案例重新評估。</p><p>試評先呈現各項分布與未觀察項目，總分、百分比與整體分級不套用在這版。</p></div>
 <div class="panel"><span class="badge">歷史調整：10 項 → ${N} 項</span><h2>把重複的項目放在一起，說清楚各自看什麼。</h2><p>研究與驗證、協作與交付各整合成一項。對照表左欄保留舊版名稱，方便查找。</p>${table(DATA.mapping_v4)}</div>
 <div class="panel"><h2>C4 看證據與研究判斷，C5 看兩個責任面向。</h2><p>C4 先看既有證據能否支持設計判斷；需要更了解使用者或驗證設計、時間與資源也允許時，應安排質化或量化研究，可擇一或搭配。C5 的溝通與決策討論、工作安排與設計交付，則仍是兩個都需要完成的責任面向。</p><div class="notice">例如既有客服紀錄或行為資料已足以支持這次的設計判斷，就可以依實際表現評 C4。沒有新研究本身不扣分；只有計畫或推測，仍不能當成已完成驗證。缺少資源時，記下限制、已有成果和後續安排；只有無法判斷整項時才標未觀察。</div>
 <p>符合期待與超出期待都依各職階的具體責任判斷，兩項各給一個評等。</p></div>
 <div class="panel"><h2>原本的 v3 職能地圖，對應到哪裡？</h2>${table(DATA.mapping_v3)}</div>`;
}
function researchUI(){
 $('#research').innerHTML=`<div class="panel"><h2>三段評等的參考與選擇</h2><span class="label">查閱日期：${esc(DATA.rating_basis.date)}</span><p>${esc(DATA.rating_basis.summary)}</p>${table([['資料','可確認的做法與限制'],...DATA.rating_basis.sources.map(r=>[r.name,r.finding])])}<p>${DATA.rating_basis.sources.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)} ↗</a>`).join(' · ')}</p></div>
 <div class="panel"><h2>2026 大廠公開資料</h2><p>以下能力方向的查閱日期：2026-09-10。分別標明職階責任、官方職缺和設計案例，也說明可以確認的日期。</p><div class="notice">這次沒有取得各大廠完整的 2026 版內部考核表。以下資料可以參考能力方向，這份 ${N*4*RATING_COUNT} 條評等描述則是為 CMoney 撰寫的討論稿。</div></div>${DATA.research.map(r=>`<article class="panel"><span class="badge">${esc(r.kind)}</span><h2>${esc(r.company)}</h2><span class="label">${esc(r.date)}</span><p>${esc(r.finding)}</p><div class="notice"><b>這份職能地圖可以參考什麼？</b><br>${esc(r.implication)}</div><p><b>這份資料的限制：</b>${esc(r.limit)}</p><a href="${esc(r.url)}" target="_blank" rel="noopener">查看官方來源 ↗</a>${r.extra?` · <a href="${esc(r.extra)}" target="_blank" rel="noopener">查看補充職缺 ↗</a>`:''}</article>`).join('')}
 <div class="panel"><h3>較早的參考資料</h3><p>Intercom 的職階文章發布於 2021 年，因此沒有列為 2026 年更新的依據。參考 AI 相關要求時，也會一起保留設計基本功。</p></div>`;
}
function discussionUI(){
 $('#discussion').innerHTML=`<div class="panel"><span class="badge">版本與討論紀錄</span><h2>這份草稿怎麼整理出來的？</h2><p>先前由 UIUX 主管、Md.、Sr.、Principal 四個 AI 角色，針對當時的十項職能提問、討論並確認修改。歷史紀錄保留原編號、名稱和當時的意見。</p><p>之後依 Monica 確認的方向整理成八項，重寫相關評分、做法與觀察重點，再逐條調整成較自然的台灣職場用語。先前的角色沒有重新審閱這版文字。</p><div class="notice"><b>保留的討論共識</b><br>正常找同事討論不算能力不足；推動工作與最後拍板分清楚；評分要看證據實際能說明什麼；高分需要具體改善與持續效果。事業單位只有一位設計師，或在 x-lab，也要由主管安排正常工作內的交流機會。</div>
 <p><a href="archive/v4_10_items/UIUX角色討論與修訂紀錄.md" target="_blank">閱讀原十項角色討論</a> · <a href="archive/v4_10_items/uiux-career-map.html" target="_blank">查看原十項網頁</a></p><p><a href="UIUX職能合併修訂紀錄.md" target="_blank">查看項目與計分調整</a> · <a href="用語調整紀錄.md" target="_blank">查看用語調整與 Threads 參考</a></p></div>
 <div class="panel"><h2>還需要確認的制度內容</h2><ul>${DATA.pending_decisions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
}
function render(){
 levelUI();mapUI();comparisonUI();reviewUI();rulesUI();changesUI();researchUI();discussionUI();
 $('#levels').classList.toggle('hidden',page==='compare');
 document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!==page));
 document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-pressed',b.dataset.page===page)});
}
function readRoute(){
 const hash=window.location.hash.slice(1),match=/^compare(?:-(C[1-8]))?$/.exec(hash);
 if(match){page='compare';comparisonId=match[1]||'C1'}
 else page=pages.includes(hash)?hash:'map';
}
function syncRoute(){window.history.replaceState(null,'',page==='compare'?`#compare-${comparisonId}`:`#${page}`)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;syncRoute();render()});
window.addEventListener('hashchange',()=>{readRoute();render()});
readRoute();
render();

</script>
